        };
        var msg = mode === 'replace'
          ? ('已用新内容替换计算稿：' + added.length + ' 行')
          : ('已导入 ' + added.length + ' 行');
        if (added.length === 0) msg = '这次没有导入任何行';
        if (sectionN) msg += ' · 部位 ' + sectionN + ' 个（' + secNames.join('、') + (sectionN > secNames.length ? ' 等' : '') + '）';
        if (imgStat.ok) msg += ' · 附图 ' + imgStat.ok + ' 张';
        if (imgOnlyN) msg += ' · 纯图行 ' + imgOnlyN;
        if (dupSkipped) msg += ' · 跳过重复 ' + dupSkipped + ' 行';
        var probs = [];
        if (imgStat.fail) probs.push(imgStat.fail + ' 张图没取出来');
        if (res.imgSkipped) probs.push(res.imgSkipped + ' 张图超限未读');
        if (multiImgs) probs.push(multiImgs + ' 张同格多图未导入（一行只挂一张）');
        var cutByCap = visited - added.length - skippedEmpty;
        if (cutByCap > 0) probs.push('超出每表上限，还有 ' + cutByCap + ' 行没导入');
        if (res.warnCell) probs.push('有超长单元格被截到 200 字');
        if (res.warnCol) probs.push('超过 20 列未读取');
        /* 底部状态栏一行放不下太多字：只报前两条，其余给个总数 */
        if (probs.length) msg += '。⚠ ' + probs.slice(0, 2).join('；') +
          (probs.length > 2 ? ' 等 ' + probs.length + ' 项' : '');
        if (savedOk === false) {
          /* 这条是真会丢东西的，单独用弹层拦一下，不跟普通提示混 */
          msg += ' · 10 秒内可撤销';
          appTip(msg, 10000, undoImport, 'warn');
          fhImportAlert('内容已上屏，但没存进本机（存储满了？）—— 关掉重开前请先「导出 Excel」留一份。');
        } else if (added.length) {
          appTip(msg + ' · 10 秒内可撤销', 10000, undoImport);
        } else {
          appTip(msg, 5000, null, 'warn');
        }
      }).catch(function () {
        taskOver();
        if (task.aborted) return;
        if (task.rollback) {
          try {
            Promise.resolve(task.rollback()).then(function () { sheetSave(); });
            fhImportAlert(mode === 'replace'
              ? '导入失败，已把整张计算稿恢复到导入前（原有内容一行没丢）。'
              : '导入失败，已把这次加的行撤掉（原有内容没变）。');
            return;
          } catch (e2) {}
        }
        fhImportAlert('写入计算稿失败，请重试（原有内容没变）');
      });
    };
  }

  /* ═══════ 推送更新（2026-09-22 用户：「更新我们能推送吧？」）═══════
     机制：动态插一个 <script src="https://fhzjsj.cn/calc/version.js">（JSONP，绕开 file:// 跨域），
          服务端那个文件里写  window.__fhLatest={"version":"1.9","url":"…"}
     ⇒ **想推更新，只需改服务器上那一个 js 文件**，所有装了旧版的用户下次启动就能看到提示。
     ⇒ 双保险：① 底栏「有新版本 →」小链接 ② 设置面板「版本」行标记。
     ★ 铁律：任何失败（没网 / 文件不存在 / 被拦）一律**静默忽略**，绝不弹错、绝不影响使用。 */
  window.FH_VERSION = '1.0.0-community';                           // 社区版独立版本线
  window.APP_VER_LABEL = 'V1.0.0 社区版';                          // 界面显示的唯一版本名（标题/设置共用）
  window.FH_UPDATE_JS = '';   // 社区版不做更新推送

  /* ══ 版本 / 运行环境标识（第 14 条）══
     一处定义、多处共用：标题栏、浏览器标签、设置面板都显示「版本名 · 桌面版/网页版」。
     （2026-10-08 用户：「这些不要写」——构建日期 / 功能差异两行小字已删。）
     pywebview 注入晚于页面 ready，故 ready / pywebviewready / 兜底延时 三处各刷新一次。 */
  /* ── 公告（2026-10-20 用户：账号这一行做个公告红点）──────────────
     公告源 = 主站静态文件 /calc/notice.json（运营改一个文件即可发布，不用发版、不用动数据库）。
     有新版就用红点提示；点开读完记 id，之后不再打扰。任何失败都静默——公告不能影响使用。 */
  var FH_NOTICE_SEEN = 'fh_notice_seen_v1';
  function fhNoticeCheck() {
    /* ★ 用 <script> 而不是 fetch：壳的 origin 是 http://127.0.0.1:<端口>，
       主站静态文件没有 CORS 头，fetch 会被浏览器拦；<script> 不受同源限制（同 version.js 的做法）。 */
    try {
      var sc = document.createElement('script');
      sc.src = (window.FH_API_BASE || 'https://fhzjsj.cn') + '/calc/notice.js?t=' + Date.now();
      sc.onload = function () {
        var j = window.__fhNoticeData;
        if (!j || !j.id || !j.body) return;
        window.__fhNotice = j;
        var seen = '';
        try { seen = localStorage.getItem(FH_NOTICE_SEEN) || ''; } catch (e) {}
        var dot = document.getElementById('setNoticeDot');
        if (dot && String(j.id) !== seen) dot.style.display = 'inline-block';   /* hidden 会被行内 display 覆盖，显式控制 */
      };
      sc.onerror = function () {};       /* 公告拉不到一律静默 */
      document.head.appendChild(sc);
      setTimeout(function () { try { sc.remove(); } catch (e) {} }, 8000);
    } catch (e) {}
  }
  function fhShowNotice() {
    var n = window.__fhNotice;
    if (!n) return;
    if (document.getElementById('fhNoticeBox')) return;
    var d = document.createElement('div');
    d.className = 'confirm-mask show'; d.id = 'fhNoticeBox';
    var body = String(n.body || '').split('\n').map(function (ln) { return escHtml(ln); }).join('<br>');
    d.innerHTML = '<div class="confirm-box" style="max-width:420px"><div class="confirm-title">' + escHtml(n.title || '公告') + '</div>' +
      '<div class="confirm-text" style="text-align:left;line-height:1.7">' + body + '</div>' +
      '<div class="pay-btns"><button class="pay-btn solid" id="fhNoticeOk">知道了</button></div></div>';
    document.body.appendChild(d);
    document.getElementById('fhNoticeOk').onclick = function () {
      try { localStorage.setItem(FH_NOTICE_SEEN, String(n.id)); } catch (e) {}
      var dot = document.getElementById('setNoticeDot');
      if (dot) dot.style.display = 'none';
      d.remove();
    };
  }
  window.fhShowNotice = fhShowNotice;
  /* ★ 2026-10-22：把恢复预览也挂到 window —— 糯米B 的隔离 harness 连续两次抽不出这个函数的边界
     （9023~9226，204 行、内部依赖 8 个外部标识符），卡在 BLOCKED。挂出来后她可以在整页环境里
     直接 window.fhRestorePreview(fakeRes) 调到，不必再抽函数。纯调试出口，不影响运行。 */
  window.fhRestorePreview = fhRestorePreview;
  function fhApplyVer() {
    window.FH_IS_DESKTOP = !!(window.pywebview && window.pywebview.api);
    window.APP_ENV_LABEL = window.FH_IS_DESKTOP ? '桌面版' : '网页版';
    var ver = window.APP_VER_LABEL + ' · ' + window.APP_ENV_LABEL;
    var tv = document.getElementById('titleVer');
    if (tv) tv.textContent = window.APP_VER_LABEL;   /* 标题栏只留版本号（用户 2026-10-19：桌面版删掉） */
    var sv = document.getElementById('setVer');
    if (sv && !window.__fhNewVersion) sv.textContent = ver;
    if (!window.FH_COMMUNITY && !window.__fhNoticeChecked) { window.__fhNoticeChecked = true; setTimeout(fhNoticeCheck, 900); }   // 社区版无公告
    document.title = '方衡造价计算器 ' + window.APP_VER_LABEL;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fhApplyVer);
  else fhApplyVer();
  window.addEventListener('pywebviewready', fhApplyVer);
  setTimeout(fhApplyVer, 1200);   // pywebview 注入晚于 ready 的兜底

  function fhVersionIsNewer(candidate, current) {
    function parse(v) {
      var m = String(v || '').trim().match(/^v?(\d+(?:\.\d+)*)(?:-([0-9A-Za-z.-]+))?$/i);
      return m ? { parts: m[1].split('.').map(Number), pre: m[2] || '' } : null;
    }
    var a = parse(candidate), b = parse(current);
    if (!a || !b) return false;
    var n = Math.max(a.parts.length, b.parts.length);
    for (var i = 0; i < n; i++) {
      var av = a.parts[i] || 0, bv = b.parts[i] || 0;
      if (av !== bv) return av > bv;
    }
    return !!b.pre && !a.pre;
  }

  window.fhCheckUpdate = function (done) {
    if (window.FH_COMMUNITY || !window.FH_UPDATE_JS) { if (done) done(null); return; }   // 社区版无更新推送
    var s = document.createElement('script');
    s.src = window.FH_UPDATE_JS + '?_=' + Date.now();
    s.onload = function () {
      var j = window.__fhLatest;
      try { s.remove(); } catch (e) {}
      if (!j || !j.version) { if (done) done(null); return; }
      window.__fhLatestRaw = j;   /* 原样存下（含 notes），「更新了什么」弹窗要用 */
      if (!fhVersionIsNewer(j.version, window.FH_VERSION)) { if (done) done(null); return; }
      window.__fhNewVersion = j;
      fhShowUpdate(j);
      if (done) done(j);
    };
    s.onerror = function () { try { s.remove(); } catch (e) {} if (done) done(null); };
    document.head.appendChild(s);
  };

  function fhShowUpdate(j) {
    var bar = document.querySelector('.bottom-bar');
    if (bar && !document.getElementById('fhUpdLink')) {
      var a = document.createElement('a');
      a.id = 'fhUpdLink'; a.className = 'fh-upd';
      /* ★ 2026-10-23 修「一键升级变成拉浏览器下载」（用户实测）：桌面版点底栏提示
         不再 href 直开浏览器（target=_blank 会把下载甩给系统浏览器），与设置页
         「一键升级」按钮走同一条壳内下载→校验→静默装链路；网页版保留原行为。 */
      a.href = '#';
      a.textContent = '有新版本' + (j.version ? ' ' + j.version : '') + ' →';
      a.onclick = function (ev) {
        ev.preventDefault();
        if (window.FH_IS_DESKTOP && window.pywebview && window.pywebview.api) {
          /* 用户 2026-10-23：底栏点击 → 打开设置面板（升级入口在那里的「检查更新/一键升级」），不跳网页 */
          var setBtn = document.querySelector('.panel-set');
          if (setBtn) { setBtn.click(); window.__fhToast && window.__fhToast('版本信息在设置面板里，点「检查更新」可一键升级'); }
          else { fhUpgradeStart(window.__fhNewVersion || j); }
        } else {
          window.open(j.url || 'https://fhzjsj.cn/tools/calc-download', '_blank', 'noopener');
        }
        return false;
      };
      bar.appendChild(a);
    }
    var v = document.getElementById('setVer'), b = document.getElementById('setUpd');
    if (v) v.textContent = window.APP_VER_LABEL + ' · 有新版本';
    /* 桌面版且有直链 → 一键升级；网页版/没有直链 → 照旧去下载页 */
    if (b) {
      b.textContent = (window.FH_IS_DESKTOP && j.url) ? '一键升级' : '去下载';
      b.classList.add('solid');
    }
    window.__fhToast && window.__fhToast('有新版本 ' + (j.version || '') + '，可一键升级');
  }

  /* ── 一键升级（2026-10-19 用户拍板）：壳下载 → SHA256 校验 → 拉起安装器 ── */
  function fhUpgradeStart(j) {
    if (!(window.FH_IS_DESKTOP && window.pywebview && window.pywebview.api && j && j.url)) {
      window.open((j && j.url) || 'https://fhzjsj.cn/tools/calc-download', '_blank', 'noopener');
      return;
    }
    /* ★ 糯米 3cca5af-06：没带 SHA256 的版本不走自动执行链，回落人工下载 */
    if (!j.sha256) {
      window.__fhToast('这个新版本没带校验信息，请去官网下载安装');
      window.open('https://fhzjsj.cn/tools/calc-download', '_blank', 'noopener');
      return;
    }
    var b = document.getElementById('setUpd'), v = document.getElementById('setVer');
    var reset = function () { if (b) { b.disabled = false; b.textContent = '一键升级'; }
                             if (v) v.textContent = window.APP_VER_LABEL + ' · 有新版本'; };
    if (b) { b.disabled = true; b.textContent = '下载中…'; }
    if (v) v.textContent = '正在下载新版本…';
    window.pywebview.api.upgrade_download(j.url, j.sha256, 'fh_setup_' + (j.version || '') + '.exe').then(function (r) {
      if (!r || !r.ok) { reset(); window.__fhToast((r && r.error) || '下载失败'); return; }
      if (b) b.textContent = '启动安装器…';
      window.pywebview.api.upgrade_run(r.path).then(function (r2) {
        if (r2 && r2.ok) {
          if (v) v.textContent = '安装器已启动';
          window.__fhToast('安装器已启动：按提示点下一步，装完重新打开就好');
        } else { reset(); window.__fhToast((r2 && r2.error) || '安装器没起来'); }
      }).catch(function () { reset(); window.__fhToast('安装器没起来，请重试'); });
    }).catch(function () { reset(); window.__fhToast('下载中断了，请重试'); });
  }
  window.fhUpgradeStart = fhUpgradeStart;

  /* ── 更新完成弹窗（⑥）：升级后第一次打开，告诉用户新增了什么 ──
     version.js 里加 notes:["…","…"] 就有内容可显；没写就给一句兜底。 */
  function fhShowWhatsNew() {
    if (document.getElementById('fhWhatsNew')) return;
    var raw = window.__fhLatestRaw || {};
    var notes = (raw.version === window.FH_VERSION && Array.isArray(raw.notes) && raw.notes.length)
      ? raw.notes : [];
    var d = document.createElement('div');
    d.className = 'confirm-mask show'; d.id = 'fhWhatsNew';
    d.innerHTML = '<div class="confirm-box" style="max-width:360px">' +
      '<div class="confirm-title">已更新到 ' + window.APP_VER_LABEL + '</div>' +
      '<div class="confirm-text" style="text-align:left">' +
        (notes.length
          ? notes.map(function (t) { return '<div style="margin:3px 0">· ' + esc(String(t)) + '</div>'; }).join('')
          : '修复了一些问题，用着更稳。') +
      '</div>' +
      '<div class="pay-btns"><button class="pay-btn solid" id="fhWhatsNewOk">知道啦</button></div></div>';
    document.body.appendChild(d);
    document.getElementById('fhWhatsNewOk').onclick = function () { d.remove(); };
  }
  /* 升级检测：上次记录的版本号 ≠ 本次 → 就是刚升级完，弹一次「更新了什么」 */
  (function () {
    try {
      var prev = localStorage.getItem('fh_last_ver');
      localStorage.setItem('fh_last_ver', window.FH_VERSION);
      if (prev && prev !== window.FH_VERSION) {
        setTimeout(function () { try { fhCheckUpdate(function () { fhShowWhatsNew(); }); } catch (e) {} }, 2200);
      }
    } catch (e) {}
  })();

  /* ── 轻量提示条（解锁成功等反馈，不打断操作）── */
  window.__fhToast = function (msg) {
    var t = document.getElementById('fhToast');
    if (!t) { t = document.createElement('div'); t.id = 'fhToast'; document.body.appendChild(t); }
    t.textContent = msg; t.className = 'fh-toast show';
    clearTimeout(window.__fhToastTimer);
    window.__fhToastTimer = setTimeout(function(){ t.className = 'fh-toast'; }, 2800);
  };

  /* ── 到上限时把加行按钮置灰（视觉暗示；仍可点，点了弹提示说明原因）── */
  window.fhSyncCap = function () {
    var capNow = window.fhCapNow ? window.fhCapNow() : FH_ROW_CAP;
    var full = sheetRows.length >= capNow;
    var btn = document.getElementById('sheetAddRow');
    if (btn) { btn.style.opacity = full ? '.45' : ''; btn.title = full ? '标准版每张表最多 ' + FH_ROW_CAP + ' 行，点这里了解「更大容量」' : '在选中行上方插入一行；没选行则加在末尾'; }
    Array.prototype.forEach.call(document.querySelectorAll('[data-act="ins"]'), function (x) {
      x.style.opacity = full ? '.35' : ''; x.style.cursor = full ? 'not-allowed' : '';
    });
    /* ★ 常驻提示条：满了就一直在（不消失），明写"导出不受影响" */
    var bar = document.getElementById('fhCapBar'), capMsg = document.getElementById('fhCapMsg'),
        capBuy = document.getElementById('fhCapBuy');
    if (bar) {
      bar.hidden = !full;
      if (full && capMsg) {
        if (window.__fhUnlocked) {
          capMsg.innerHTML = '<b class="fh-cap-ok">导出不受影响</b> —— 已到更大容量上限。' +
            '<b>还要更多？直接联系我们</b>（微信／邮箱待定）。';
          if (capBuy) capBuy.hidden = true;
        } else {
          capMsg.innerHTML = '<b class="fh-cap-ok">导出不受影响</b> —— 「导出 Excel」随时可用，已算的内容一条不丢；' +
            '只是这张表到了标准版上限（<b>' + window.FH_ROW_CAP + ' 行</b>），<b>不能再加行</b>。';
          if (capBuy) capBuy.hidden = false;
        }
      }
    }
  };

  /* 表格一变就同步一次（不用知道内部渲染函数名，靠 MutationObserver 兜住） */
  function fhWatch() {
    var tb = document.getElementById('sheetBody');
    if (!tb) { setTimeout(fhWatch, 300); return; }
    new MutationObserver(function () { fhSyncCap(); }).observe(tb, { childList: true });
    fhSyncCap();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fhWatch); else fhWatch();

  /* ── 设置面板里的按钮（登录 / 购买 / 检查更新）──
     ★ 登录与购买的真接口还没接上 → 只给"即将开放"的实话，不伪造不扣分 */
  document.addEventListener('click', function (e) {
    if (e.target && e.target.id === 'setLogin') {
      /* ★ 2026-10-19 一期登录：已登录→退出；未登录→真登录（fhShowLogin 内部已按桌面/网页分流）
         红队修复：window.confirm 在 WebView2 环境不可靠，换自绘弹层 */
      if (window.__fhMe && window.__fhMe.logged) {
        if (document.getElementById('fhLogout')) return;
        var dl = document.createElement('div');
        dl.className = 'confirm-mask show'; dl.id = 'fhLogout';
        dl.innerHTML = '<div class="confirm-box" style="max-width:340px"><div class="confirm-title">退出登录</div>' +
          '<div class="confirm-text">退出当前账号？<br><b>已算的内容都还在本机，不受影响。</b></div>' +
          '<div class="pay-btns"><button class="pay-btn solid" id="fhLogoutYes">退出</button>' +
          '<button class="pay-btn" id="fhLogoutNo">先不退</button></div></div>';
        document.body.appendChild(dl);
        document.getElementById('fhLogoutNo').onclick = function () { dl.remove(); };
        document.getElementById('fhLogoutYes').onclick = function () { dl.remove(); window.fhDoLogout(); };
      } else fhShowLogin();
    }
    if (e.target && e.target.id === 'setBuy') { fhShowUnlock(); }
    if (e.target && e.target.id === 'setNoticeDot') { fhShowNotice(); }
    if (e.target && e.target.id === 'fhCapBuy') { fhShowUnlock(); }
    if (e.target && e.target.id === 'setUpd') {
      if (window.__fhNewVersion) {   /* 桌面版走一键升级；网页版/无直链 → 下载页 */
        var jn = window.__fhNewVersion;
        if (window.FH_IS_DESKTOP && jn.url) { fhUpgradeStart(jn); return; }
        window.open((jn.url || 'https://fhzjsj.cn/tools/calc-download'), '_blank');
        return;
      }
      var v = document.getElementById('setVer');
      if (v) { v.textContent = '检查中…'; }
      fhCheckUpdate(function (j) {
        var v2 = document.getElementById('setVer');
        if (!v2) return;
        if (j) return;                       /* 有新版时 fhShowUpdate 已经把文案改好了 */
        v2.textContent = '已是最新';
        setTimeout(function () { v2.textContent = window.APP_VER_LABEL + ' · ' + window.APP_ENV_LABEL; }, 1600);
      });
    }
  }, true);

  /* 启动后静默检查一次（延迟 1.5s，不抢启动；失败静默忽略） */
  try { setTimeout(function () { try { fhCheckUpdate(); } catch (e) {} }, 1500); } catch (e) {}
})();
</script>

<!-- ══ 计算器前端点击埋点 + 使用习惯汇总（2026-09-29 / 2026-10-19）══
     点击级：button_id + 匿名 client_id，定位"用户哪一步多点了一次"。
     会话级：会话计数 + 功能桶计数（2026-10-19，VV 拍板），零内容上传。
     铁律：不记输入内容、无 PII、上报 body 不含 token —— 身份由服务端验 Bearer 后派生
     （Bearer 是登录鉴权本身，随请求头发出；此处「不发 token」指不进统计载荷）。
     默认开启、不设开关（用户 2026-10-19）：只发功能计数/会话时长/匿名编号，不发任何内容。
     身份切换（登录/退出/换号）：结束当前会话并重建计数——A 的操作不算到 B 头上。
     web 与 desktop 副本一致；desktop 离线时 fetch 失败，点击攒批重试、会话汇总丢弃（下轮 beat 补）。 -->
<script>
(function () {
  try {
    /* ID 一律 UUID 形（糯米 8f38eae P2-03）：服务端只认这个形状，自由文本混不进来 */
    function uuidv4() {
      if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
        var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }
    var UUID_RE = /^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/;
    var cid = (function () {
      try { var c = localStorage.getItem('fh_client_id'); if (c && UUID_RE.test(c)) return c; } catch (e) {}
      var n = uuidv4();
      try { localStorage.setItem('fh_client_id', n); } catch (e) {}
      return n;
    })();
    /* ★ 2026-10-19 糯米审核 P1-06：这里**不再把 token 当 user_id**。
       身份由服务端验 Bearer 签名后派生；本文件只发行为元数据，不发任何凭据。 */
    var uid = null;
    function authHeader() {
      try { var t = localStorage.getItem('fh_token'); return t ? { 'Authorization': 'Bearer ' + t } : {}; }
      catch (e) { return {}; }
    }
    var sid = uuidv4();

    var Q = [];
    var lastKey = '', lastT = 0;
    var STASH_KEY = 'fh_calc_stash';

    function currentView() {
      var v = document.querySelector('.vs-btn.on');
      return (v && v.dataset) ? (v.dataset.viewTo || 'calc') : 'calc';
    }
    function panelIdxOf(el) {
      if (!el || !el.closest) return null;
      var p = el.closest('.panel');
      if (!p) return null;
      var all = document.querySelectorAll('.panel');
      return Array.prototype.indexOf.call(all, p);
    }
    function resolveId(el) {
      if (!el || !el.classList) return null;
      if (el.classList.contains('sym-btn')) {
        if (el.classList.contains('steel-open-btn')) return 'act:steel';
        if (el.classList.contains('formula-btn')) return 'act:formula';
        if (el.classList.contains('transpose-btn')) return 'act:transpose';
        if (el.classList.contains('fx-btn')) return 'act:fx';
        if (el.dataset && el.dataset.ins) return 'sym:' + el.dataset.ins;
        return null;
      }
      if (el.classList.contains('vs-btn')) return 'view:' + ((el.dataset && el.dataset.viewTo) || '?');
      if (el.classList.contains('panel-copy')) return 'panel:copy';
      if (el.classList.contains('panel-add')) return 'panel:add';
      if (el.classList.contains('panel-close')) return 'panel:close';
      if (el.classList.contains('panel-set')) return 'set:open';
      if (el.classList.contains('set-theme-toggle')) return 'set:theme';
      if (el.id) {
        var map = {
          sheetSnap: 'sheet:snap', sheetAddSection: 'sheet:addSection', sheetAddRow: 'sheet:addRow',
          sheetExport: 'sheet:export', sheetClear: 'sheet:clear', closeBtn: 'sheet:close',
          sheetImport: 'sheet:import', sheetRestoreUndo: 'restore:undo',
          fhImpGo: 'import:go', fhImpCancel: 'import:cancel',
          fhNoMetaGeneric: 'import:genericFromNoMeta', fhNoMetaCancel: 'import:cancelNoMeta',
          fhStructGeneric: 'import:genericFromStruct', fhStructCancel: 'import:cancelStruct',
          fhRestoreGoNew: 'restore:goNew', fhRestoreGo: 'restore:go', fhRestoreCancel: 'restore:cancel',
          fhLoginSend: 'login:sendCode', fhLoginGo: 'login:go', fhLoginCancel: 'login:cancel',
          fhBuy: 'buy:open', fhBuyM1: 'buy:m1', fhBuyM3: 'buy:m3', fhBuyRealCancel: 'buy:cancel',
          imgViewerCopy: 'img:copy', imgViewerDel: 'img:del', imgViewerClose: 'img:close',
          barUndo: 'bar:undo', barCancel: 'bar:cancel', calcResultValue: 'result:copy',
          minBtn: 'title:min', maxBtn: 'title:max', appCloseBtn: 'title:close',
          setLogin: 'set:login', setUpd: 'set:update', setBuy: 'set:buy'
        };
        if (map[el.id]) return map[el.id];
      }
      return null;
    }
    function enqueue(id, pidx) {
      var now = Date.now();
      var key = id + '|' + (pidx == null ? '' : pidx);
      var red = (key === lastKey && now - lastT < 1500) ? 1 : 0;
      lastKey = key; lastT = now;
      Q.push({
        button_id: id, view: currentView(),
        panel_idx: pidx == null ? null : pidx,
        redundant: red, session_id: sid, client_id: cid
      });
      useBump(id);
      useBeatSoon();          /* 短会话也别丢数：首次点击就落一条 beat（20 秒最小间隔） */
      if (Q.length >= 10) flush();
    }
    function stash(batch) {
      try {
        var arr = [];
        try { arr = JSON.parse(localStorage.getItem(STASH_KEY) || '[]'); } catch (e) {}
        if (!Array.isArray(arr)) arr = [];
        /* 旧版本把 token 写进过 user_id —— 攒批重发前先剔除，避免凭据落本地缓存 */
        arr = arr.map(function (x) { if (x && typeof x === 'object') { delete x.user_id; } return x; });
        batch = batch.map(function (x) { if (x && typeof x === 'object') { delete x.user_id; } return x; });
        arr = arr.concat(batch);
        if (arr.length > 200) arr = arr.slice(arr.length - 200);
        localStorage.setItem(STASH_KEY, JSON.stringify(arr));
      } catch (e) {}
    }
    function send(batch) {
      if (window.FH_COMMUNITY) return;   /* 社区版零埋点：任何使用数据不出本机 */
      try {
        /* ★ 2026-10-19：桌面版 origin 是 127.0.0.1:<随机端口>，相对路径永远打不到主站
           （排期方案 §1.1 实锤）。改绝对基址；FH_API_BASE 未定义时兜底线上。 */
        fetch((window.FH_API_BASE || 'https://fhzjsj.cn') + '/api/calc/track', {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
          body: JSON.stringify(batch),
          keepalive: true
        }).then(function (r) { if (!r.ok) stash(batch); }).catch(function () { stash(batch); });
      } catch (e) { stash(batch); }
    }
    function flush() {
      if (!Q.length) return;
      var batch = Q.splice(0, Q.length);
      send(batch);
    }
    function flushStash() {
      try {
        var arr = JSON.parse(localStorage.getItem(STASH_KEY) || '[]');
        if (Array.isArray(arr) && arr.length) { localStorage.removeItem(STASH_KEY); send(arr); }
      } catch (e) {}
    }

    document.addEventListener('click', function (e) {
      if (!(e.target instanceof Element)) return;
      var el = e.target.closest('button, [data-track]');
      if (!el) return;
      var id = resolveId(el);
      if (!id) return;
      enqueue(id, panelIdxOf(el));
    }, true);

    document.addEventListener('change', function (e) {
      if (e.target instanceof Element && e.target.classList.contains('panel-prec')) {
        enqueue('panel:prec', panelIdxOf(e.target));
      }
    }, true);

    document.addEventListener('mousedown', function (e) {
      if (e.target instanceof Element && e.target.closest('.le-val')) {
        enqueue('line:copy', panelIdxOf(e.target));
      }
    }, true);

    /* ── 使用习惯·会话汇总（2026-10-19 VV 拍板；8f38eae 糯米验收后补隐私开关+会话边界）──
       零内容上传：只发 会话id / 功能桶计数 / 时长 / 时间戳 / desktop|web，
       不发计算稿内容、手机号、token；user_id 由服务端验 Bearer 后派生。 */
    var USE_T0 = Date.now();
    var USE_STARTED = new Date().toISOString();
    var USE_FEATS = {};
    var USE_EVENTS = 0;
    function useBump(id) {
      try {
        var f = String(id || '').split(':')[0] || 'other';
        USE_FEATS[f] = (USE_FEATS[f] || 0) + 1;
        USE_EVENTS++;
      } catch (e) {}
    }
    /* ★ 2026-10-21 卓米D：原来只在 start / 每 5 分钟 beat / 关窗 end 时发。
       线上实测 109 个会话里 33 个 duration=0、feature_counts={} —— 用户开一会儿就关，
       一条数都没落（关窗时的 keepalive 也常来不及）。改成"点一下就补一次 beat"，
       20 秒最小间隔 → 首次点击就落数，短会话也有记录；长会话仍由 5 分钟心跳兜底。 */
    var USE_LAST_BEAT = 0;
    function useBeatSoon() {
      try {
        if (USE_EVENTS === 0) return;
        var now = Date.now();
        if (now - USE_LAST_BEAT < 20000) return;
        USE_LAST_BEAT = now;
        usageSend('beat');
      } catch (e) {}
    }
    function usageSend(phase) {
      if (window.FH_COMMUNITY) return;   /* 社区版零埋点：任何使用数据不出本机 */
      try {
        fetch((window.FH_API_BASE || 'https://fhzjsj.cn') + '/api/calc/usage', {
          method: 'POST',
          headers: Object.assign({ 'Content-Type': 'application/json' }, authHeader()),
          body: JSON.stringify({
            phase: phase,
            session_id: sid,
            started_at: USE_STARTED,
            duration_ms: Date.now() - USE_T0,
            events_total: USE_EVENTS,
            counts: USE_FEATS,
            /* ★ 2026-10-21 卓米D：桌面版 pywebview 注入晚于脚本执行，start 那一刻
               FH_IS_DESKTOP 还是 undefined → 全标成 web（线上 109 条里 desktop 只有 6 条，
               占比明显不对）。不确定就发 null；服务端是 COALESCE(mode, ?)，后面的 beat
               会把真值补上。 */
            mode: (window.FH_IS_DESKTOP === true ? 'desktop'
                  : (window.FH_IS_DESKTOP === false ? 'web' : null)),
            client_id: cid
          }),
          keepalive: true
        }).catch(function () {});
      } catch (e) {}
    }
    /* ★ 糯米 8f38eae P1-01：身份切换（登录/退出/换号）→ 结束旧会话、重建计数。
       A 的操作不会算到 B 头上；服务端另有身份锁兜底。 */
    var USE_TOKEN_FP = null;
    function usageFp() { try { return localStorage.getItem('fh_token') || ''; } catch (e) { return ''; } }
    function usageRotate(endOld) {
      if (endOld) usageSend('end');
      sid = (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : ('s' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
      USE_T0 = Date.now();
      USE_STARTED = new Date().toISOString();
      USE_FEATS = {};
      USE_EVENTS = 0;
      usageSend('start');
    }
    window.__fhUsageOnIdentityChange = function () {
      try {
        var fp = usageFp();
        if (fp === USE_TOKEN_FP) return;
        USE_TOKEN_FP = fp;
        usageRotate(true);   /* 旧身份会话落终态 → 新会话起点 */
      } catch (e) {}
    };
    USE_TOKEN_FP = usageFp();

    setInterval(flush, 8000);
    setInterval(function () { usageSend('beat'); }, 300000);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') { flush(); usageSend('beat'); }
    });
    window.addEventListener('beforeunload', function () { flush(); usageSend('end'); });
    flushStash();
    usageSend('start');
  } catch (e) {}
})();
</script>
</body>
</html>
