// 符号按钮已随列创建（createPanel 内逐列绑定），无全局符号栏

function getCurrentLineOf(ta) {
  const start = ta.selectionStart;
  const text = ta.value;
  const lineStart = text.lastIndexOf('\n', start - 1) + 1;
  const lineEnd = text.indexOf('\n', start);
  return text.substring(lineStart, lineEnd === -1 ? text.length : lineEnd).trim();
}

let recordTimer = null;

/* 顶部结果（现在在顶栏）= 本列【所有行】结果之和（≥2 行有效时右侧标「N 行合计」）。
   单行时与以前一样（就等于该行结果）；一行都算不出来则清空。
   抽成独立函数是因为 L1 之后结果只有一份，**切换当前列**时也得把它换成那一列的数。 */
function renderAnswer(panel) {
  if (!panel || !panel.input) return;
  const lines = panel.input.value.split('\n');
  let sum = 0, cnt = 0, latest = '';
  for (let i = 0; i < lines.length; i++) {
    const t = lines[i].trim();
    if (!t) continue;
    let r = NaN;
    try { r = safeEval(t); } catch (e) { r = NaN; }
    if (typeof r === 'number' && isFinite(r)) { sum += r; cnt++; latest = formatNum(r); }
  }
  const ansEl = panel._ansEl, tagEl = panel._ansTag, modeSel = panel._answerMode;
  const mode = modeSel && modeSel.value === 'latest' ? 'latest' : 'total';
  if (cnt > 0) {
    const total = formatNum(sum), value = mode === 'latest' ? latest : total;
    if (ansEl) {
      ansEl.classList.remove('answer-ph');
      ansEl.textContent = value;
      ansEl.title = mode === 'latest' ? '本列最后一条有效算式结果' : (cnt > 1 ? ('本列 ' + cnt + ' 行结果合计') : '本列当前行结果');
    }
    if (tagEl) tagEl.textContent = '';
    if (modeSel) modeSel.hidden = cnt < 2;
    lastResult = value;
  } else {
    if (ansEl) { ansEl.classList.remove('answer-ph'); ansEl.textContent = ''; ansEl.title = '本列结果'; }
    if (tagEl) tagEl.textContent = '';
    if (modeSel) modeSel.hidden = true;
    lastResult = '';
  }
}

function onInput() {
  if (!activePanel) return;
  const ta = activePanel.input;
  const v = getCurrentLineOf(ta);
  renderLineEcho(activePanel);     // 行尾浅色结果（镜像层，与输入框逐行对齐）
  renderAnswer(activePanel);       // 顶栏结果 = 本列各行结果之和

  if (v) {
    if (!bootQuiet) renderLabelDropdown();     // 启动恢复时别把下拉弹出来
    try {
      const r = safeEval(v);
      if (typeof r === 'number' && isFinite(r)) scheduleRecord(v, formatNum(r), curLineIndex(ta), bootQuiet);
    } catch(e) {}
  } else {
    hideLabelDropdown();
  }
  panelsSave();   // 算式框内容持久化（防抖）—— 与表里的 srcLine 绑定一起活过重启
}

/* 行尾浅色结果：与输入框同字体、同宽、同换行的「镜像层」——
   算式文本透明占位（保证每行位置与 textarea 一致），只把结果画成浅色。
   为什么不用「底部结果条」：那样换行后要来回找行号，行尾直读最省事。 */
function renderLineEcho(panel) {
  if (!panel || !panel._echo) return;
  const ta = panel.input, echo = panel._echo;
  const lines = ta.value.split('\n');
  let html = '';
  for (let i = 0; i < lines.length; i++) {
    const src = lines[i];
    const t = src.trim();
    let val = '', err = '', bad = '';
    if (t) {
      const r = safeEval(t);
      if (typeof r === 'number' && isFinite(r)) val = formatNum(r);
      else {
        /* ★ 2026-10-08：evalDiagnose 改返回 {msg, bad} —— bad 是出错的字符/片段，
           在算式原文里原位标红（「哪里错了标红」，用户）。找得到才标，别标错。 */
        const d = evalDiagnose(t);
        err = d.msg; bad = d.bad || '';
      }
    }
    let srcHtml = escHtml(src);
    let marked = false;
    if (bad) {
      const b = escHtml(bad);
      const at = srcHtml.indexOf(b);
      if (at >= 0) {
        /* ★ 2026-10-08 用户「不要写什么不认识」：错字原位标红后就**不再跟文字说明**——
           红字本身就是提醒；完整原因挪进悬停提示（鼠标放红字上看）。
           标不上的（原文剥标注后位置对不上）才退回行尾短文案。 */
        srcHtml = srcHtml.slice(0, at) + '<span class="le-bad" title="' + escAttr(err) + '">' + b + '</span>' + srcHtml.slice(at + b.length);
        marked = true;
      }
    }
    html += '<div>' + (src ? srcHtml : '&#8203;') +
            (val ? '<span class="le-dash">\u2014\u2014</span><span class="le-val" data-v="' + escAttr(val) + '" title="点一下复制这个结果">' + escHtml(val) + '</span>' : '') +
            (err && !marked ? '<span class="le-dash">\u2014\u2014</span><span class="le-err" title="' + escAttr(err) + '">' + escHtml(err) + '</span>' : '') +
            '</div>';
  }
  echo.innerHTML = html;
  echo.scrollTop = ta.scrollTop;
  echo.scrollLeft = ta.scrollLeft;
}

/**
 * 防抖写入历史。同表达式去重：
 * - 已在首位：仅在结果变化时更新（位数切换等场景）
 * - 已在其他位置：移除旧条目后置顶（点历史改一处重算不会产生重复条目）
 */
function scheduleRecord(expr, formatted, line, quiet) {
  clearTimeout(recordTimer);
  recordTimer = setTimeout(() => {
    const idx = history.findIndex(h => h.expr === expr);
    if (idx === 0) {
      if (history[0].val === formatted) { if (!quiet && typeof line === 'number') sheetAutoSync(line, expr); return; }
      history[0].val = formatted;
      history[0].time = Date.now();
    } else {
      if (idx > 0) history.splice(idx, 1);
      history.unshift({ expr: expr, val: formatted, time: Date.now() });
      if (history.length > 200) history.pop();
    }
    safeLS.set('calc_history', JSON.stringify(history));
    /* 自动入表：光标那一行算出的算式同步进计算稿（同一行反复算只更新，不堆废行）。
       quiet=true（启动恢复）时**不写** —— 否则会拿算式框里的旧文本把用户在表里手改的数顶掉。 */
    if (!quiet && typeof line === 'number') sheetAutoSync(line, expr);
  }, 600);
}

/* ══════════════════════════════════════════════════════════════════════
   算式「落点」抽象（2026-09-20）
   计算稿态**不再有顶部输入框**（用户：「计算稿模式这个行不要」）——
   符号行 / 型钢 / 公式 / f(x) / 转置 / 日期 一律作用到**表格里当前选中那一行的「计算式」格**；
   简洁态仍作用到顶部算式框。两种写法不同（textarea vs contenteditable），统一走下面这组 helper。
   ══════════════════════════════════════════════════════════════════════ */
function selExprCell() {
  const r = (sheetSel !== null && sheetSel !== undefined) ? sheetFind(sheetSel) : null;
  if (!r || r.kind !== 'item') return null;
  const tr = document.querySelector('#sheetBody tr[data-id="' + r.id + '"]');
  return tr ? tr.querySelector('td.c-expr') : null;
}
function exprSpot() {
  if (curView !== 'sheet') return inputArea ? { panel: true } : null;
  const ae = document.activeElement;
  if (ae && ae.classList && ae.classList.contains('c-expr')) return { cell: ae };   // 正在某格里打字
  const cell = selExprCell();
  return cell ? { cell: cell } : null;
}
function spotText(sp) { return sp.cell ? targetText(sp.cell) : inputArea.value; }
/* contenteditable 里算「选区起止」：用 Range 量字符偏移，别数 DOM 节点 */
function cellSelOffsets(el) {
  const full = targetText(el);
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) { const p = full.length; return [p, p]; }
  const r = sel.getRangeAt(0);
  if (!el.contains(r.startContainer) || !el.contains(r.endContainer)) { const p = full.length; return [p, p]; }
  const off = function (node, o) {
    const q = document.createRange();
    q.selectNodeContents(el);
    try { q.setEnd(node, o); } catch (e) { return full.length; }
    return q.toString().length;
  };
  const a = off(r.startContainer, r.startOffset), b = off(r.endContainer, r.endOffset);
  return [Math.min(a, b), Math.max(a, b)];
}
function spotSel(sp) {
  if (!sp.cell) return [inputArea.selectionStart, inputArea.selectionEnd];
  return cellSelOffsets(sp.cell);
}
/* 写回 + 落库：格子派发 input 事件走既有编辑逻辑；顶部算式框走 onInput() */
/* ★ 2026-09-30 修用户反馈「Ctrl+Z 撤不掉 Ctrl+1 插的括号」：
   程序替用户改内容走的是「直接覆盖文字」（targetSetText = el.textContent = ...），
   浏览器**不**把它当成一步操作记进原生撤销栈；而 Ctrl+Z 一见焦点在输入区里就放行给原生
   → 两边都没接住，按了等于没按。
   办法：改写**之前**留一份快照（原文本 + 原光标），Ctrl+Z 优先撤这一步。
   只留一步；用户真敲键盘（isTrusted 的 input）就作废 ——
   既免得撤出陈旧内容，也不跟浏览器原生的「逐字撤销」抢。 */
var cellUndoSnap = null;
function spotUndoPush(el, text, caret) {
  if (!el) return;
  if (cellUndoSnap && cellUndoSnap.el !== el) return;   // 别的输入区还留着待撤的，不覆盖
  cellUndoSnap = { el: el, text: text, caret: caret };
}
function spotUndoClear() { cellUndoSnap = null; }
document.addEventListener('input', function (e) {
  if (e.isTrusted) spotUndoClear();
}, true);

function spotWrite(sp, text, caret) {
  if (sp.cell) {
    spotUndoPush(sp.cell, targetText(sp.cell), targetCaret(sp.cell));
    targetSetText(sp.cell, text, Math.max(0, caret));
    sp.cell.dispatchEvent(new Event('input', { bubbles: true }));
  } else {
    spotUndoPush(inputArea, inputArea.value, inputArea.selectionStart);
    inputArea.value = text;
    inputArea.focus();
    inputArea.setSelectionRange(caret, caret);
    onInput();
  }
}
function spotSetCaret(sp, pos) {
  if (sp.cell) targetSetText(sp.cell, targetText(sp.cell), Math.max(0, pos));
  else { try { inputArea.focus(); inputArea.setSelectionRange(pos, pos); } catch (e) {} }
}
function spotFlashEmpty() { sheetFlash('先在表里点一行 —— 符号会写进那一行的「计算式」格', 2800); }

/* Ctrl+1 / Ctrl+2 的加括号 —— 「算」视图与「计算稿」的格子**共用同一套语义**
   （2026-09-22 用户要求：「在计算稿里的计算式快捷键记得同那边，例如 Ctrl+1」）。
   走 spot 抽象（exprSpot / spotText / spotSel / spotWrite），所以 textarea 和 contenteditable
   走的是同一份逻辑，不会再出现两边行为不一样。 */
function bracketAroundSel(sp) {
  sp = sp || exprSpot();
  if (!sp) { spotFlashEmpty(); return false; }
  const v = spotText(sp), se = spotSel(sp), s = se[0], en = se[1];
  if (s !== en) {
    const sel = v.slice(s, en);                       // 框选了 → 把选中内容包成 (选中)
    spotWrite(sp, v.slice(0, s) + '(' + sel + ')' + v.slice(en), en + 2);
  } else {
    spotWrite(sp, v.slice(0, s) + '()' + v.slice(en), s + 1);   // 没框选 → 补一对括号、光标停中间
  }
  return true;
}
function bracketAroundLine(sp) {
  sp = sp || exprSpot();
  if (!sp) { spotFlashEmpty(); return false; }
  const v = spotText(sp), s = spotSel(sp)[0];
  const ls = v.lastIndexOf('\n', s - 1) + 1;
  const leRaw = v.indexOf('\n', s);
  const le = leRaw === -1 ? v.length : leRaw;
  const line = v.slice(ls, le);
  if (!line.trim()) return false;
  const lead = line.match(/^\s*/)[0], trail = line.match(/\s*$/)[0];
  const core = line.slice(lead.length, line.length - trail.length);
  const out = lead + '(' + core + ')' + trail;
  const caret = Math.min(Math.max(s + 1, ls), ls + out.length);   // +1 = 前面多出来的那个左括号
  spotWrite(sp, v.slice(0, ls) + out + v.slice(le), caret);
  return true;
}

/* ── 底栏提示条：光标停在「计算式」格里时，换成快捷键说明 ──
   （2026-09-22 用户要求「计算式快捷键要同那边，例如 Ctrl+1」后，让这两个键好发现。）
   ★ 为什么不做成"常驻加一句"：底栏是 flex 布局，左边统计会随明细/附图变长
     （实测 750 宽窗口：空表剩 554px、3 行 3 图只剩 380px），而原来那句已经要 408px
     → 常驻加字会被 `text-overflow: ellipsis` 截掉，等于白加。改情境提示又省地方又出现在对的时刻。 */
const TIP_BASE = '点行首空白或序号选整行 · Ctrl+C 复制 · 选中目标行 Ctrl+V 粘到下方 · 右键行可插行/删行 · 双击格子编辑';
const TIP_EXPR = '计算式格：Ctrl+1 加括号 / Ctrl+2 整行套括号 · Ctrl+1 未框选=补空括号 · Ctrl+3~0 插函数';
/* ★ 2026-09-30 修红队实测缺陷：sheetFlash 刚写上的提示会被这里无条件冲掉
   （focusin / focusout 都会调本函数），用户根本来不及看。加「让位窗口」：
   flash 写过后在展示期内本函数不接管，窗口一过自动恢复常态提示。 */
var sheetTipHoldUntil = 0;
function syncSheetTip() {
  const el = document.getElementById('sheetTip');
  if (!el) return;
  if (Date.now() < sheetTipHoldUntil) return;   // 一闪而过的提示还在展示期，让它说完
  const ae = document.activeElement;
  const inExpr = !!(ae && ae.classList && ae.classList.contains('c-expr') &&
                    ae.closest && ae.closest('#sheetBody'));
  el.textContent = inExpr ? TIP_EXPR : TIP_BASE;
  el.title = TIP_BASE + '\n' + TIP_EXPR;      // 悬停能看全（截断时也有救）
}
document.addEventListener('focusin', function () {
  setTimeout(function () { try { syncSheetTip(); } catch (e) {} }, 0);
}, true);
document.addEventListener('focusout', function () {
  setTimeout(function () { try { syncSheetTip(); } catch (e) {} }, 0);
}, true);

function insertAtCursor(s) {
  const sp = exprSpot();
  if (!sp) { spotFlashEmpty(); return false; }
  const v = spotText(sp);
  const se = spotSel(sp), start = se[0], end = se[1];
  let txt = s;
  let wrapped = false;   // true = 本次已把框选内容包成完整函数（含右括号）
  // 有框选时：根据插入符号类型决定包裹方式
  if (start !== end) {
    const sel = v.slice(start, end);
    // 如果是函数调用形式（如 round、sqrt），包裹成 round(选中) 而不是 (选中)round()
    if (/^[a-zA-Z_][a-zA-Z0-9_]*\($/.test(s)) {
      txt = s + sel + ')';   // round(1+1)，自带右括号
      wrapped = true;
    } else if (s === '(' || s === ')') {
      txt = '(' + sel + ')';
    } else {
      txt = '(' + sel + ')' + s;
    }
  }
  spotWrite(sp, v.slice(0, start) + txt + v.slice(end), start + txt.length);
  return wrapped;
}

async function copyResult(panel) {
  panel = panel || activePanel;
  if (!panel) return;
  /* 占位话不是结果，别让「复制」把它抄走 */
  if (panel._ansEl && panel._ansEl.classList.contains('answer-ph')) return;
  const val = ((panel._ansEl && panel._ansEl.textContent) || '').trim();
  if (!val) return;
  try {
    await navigator.clipboard.writeText(val);
    flashCopied(panel._copyBtn);
  } catch(e) {
    const ta = document.createElement('textarea');
    ta.value = val; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    flashCopied(panel._copyBtn);
  }
}
function flashCopied(btn) {
  if (!btn) return;
  btn.textContent = '已复制';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 1200);
}

function safeEval(expr) {
  let s = expr || '';
  // 1. 剥离标注（[ ] 【 】 内文字，以及 (expr=标注) 内 = 后的部分，均不参与计算）
  s = s.replace(/\[[^\]]*\]/g, '').replace(/【[^】]*】/g, '');
  /* ★★ 全角归一必须**在花括号判据之前**（糯米 #362 实测阻断）：
     `2{２＋３}` 里是全角数字，判据若用 ASCII [0-9] 认数字，页面会把这个花括号当标注剥掉（=2），
     而 normForSheet 先归一后判据、转成 (2+3)（=10）—— 同一份稿子页面与导出两个数。
     四条路径统一成：先全角归一（含全角花括号），再判花括号。全角转换本来就在第 3 步，
     提前到这里幂等无害。 */
  s = String(s).replace(/[¥$￥]/g, '').replace(/　/g, ' ')
       .replace(/[！-～]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
       .replace(/｛/g, '{').replace(/｝/g, '}');
  /* ★ 2026-10-21 卓米D：{ } 分情况 —— 晨曦/广联达手稿拿花括号当**分组括号**，
     一律当标注删会把 3.05×{(1.65＋1.6)×2【对称】＋7.2} 删成 3.05××2（真稿实测算不出）；
     但一律转圆括号也会错：造价稿里 {2}、{墙厚200}、{2层} 是**纯标注**，
     转成 (2) 会被补隐式乘号，12.5{2} 变成 25（静默错数，审核实测）。
     判据（剥掉【】[] 后）：有数字 + 有运算符 + 不含逗号 + 只含数字与运算符号 → 是式子，转圆括号；
     其余一律当标注剥掉（＝老行为，存量稿不受影响）。嵌套由内向外剥，最多 8 轮，超限留原样（白名单会拒，失败安全）。
     ⚠️ 同一套判据在本文件另有 3 处（evalDiagnose / normCommon / normForSheet），改一处必须四处同改。 */
  for (let bi = 0; bi < 8 && s.indexOf('{') >= 0; bi++) {
    const prev = s;
    s = s.replace(/\{([^{}]*)\}/g, (m, inner) => {
      const t = inner.replace(/\[[^\]]*\]/g, '').replace(/【[^】]*】/g, '');
      if (!/[0-9]/.test(t)) return '';                        // 纯文字标注
      if (/[,，]/.test(t)) return '';                         // 带逗号：当标注（别落进 JS 逗号运算符）
      if (!/[+\-*/×÷＋－]/.test(t)) return '';                 // 只有一个数：当标注（{2} 不是乘 2）
      if (/[^0-9\s.+\-*/()×÷＋－（）·]/.test(t)) return '';     // 掺了字母/中文：当标注
      return '(' + inner + ')';
    });
    if (s === prev) break;
  }
  s = s.replace(/\(([^()]*?)=[^()]*\)/g, '($1)');
  if (!s.trim()) return undefined;
  // 2/3. 去货币符号、全角 → 半角（上面为了花括号判据已做过一次，这里重做是幂等保险）
  s = s.replace(/[¥$￥]/g, '').replace(/　/g, ' ');
  s = s.replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  // 3.9 ★ 2026-10-08（用户实报）：「2 3」两个数中间只有空格 —— 原来到第 4 步去空格
  //     会拼成「23」静默算错（2 空格 3 ≠ 23！）。现在直接不认，让 evalDiagnose 给提示：
  //     「两个数之间要有运算符」。必须在去空格之前判（去了就找不回来了）。
  if (/\d\s+[.\d]/.test(s)) return undefined;
  // 4. 去空格 + 千分位逗号（1,234.5 → 1234.5）；但保留函数参数逗号（括号内，如 pow(2,10)）
  s = s.replace(/\s+/g, '');
  s = s.replace(/(\d),(?=\d)/g, (m, p1, off, str) => {
    let depth = 0;
    for (let i = 0; i < off; i++) { if (str[i] === '(') depth++; else if (str[i] === ')') depth--; }
    return depth > 0 ? m : p1;   // 括号内（函数参数）保留，括号外（千分位）删除
  });
  // 5. 运算符归一：×÷（）· → * / ( ) * ；π/PI/pi → Math.PI
  s = s.replace(/×/g, '*').replace(/÷/g, '/')
       .replace(/（/g, '(').replace(/）/g, ')')
       .replace(/[·•]/g, '*')
       .replace(/[πΠ]/g, '(' + Math.PI + ')').replace(/pi/gi, '(' + Math.PI + ')');
  // 5.5 百分号（2026-09-20 加）
  //     造价里税率 / 坡度 / 损耗率 / 系数全是百分数，但 JS 的 % 是「取余」——
  //     直接算会静默给出错值：100*5%+1 得的是 0（500 对 1 取余），不是 6（实测）。
  //     这里把「数字%」归一成「(数字/100)」，只在 % 后面跟运算符 / 右括号 / **左括号** / 结尾时才替换，
  //     所以 a%b 这种真取余写法不受影响。
  //     ★ 2026-10-08：lookahead 补上 `(` —— 原来漏了它，`5%(2)` 两边都不归一 → 静默按取余算出 1
  //     （应为 0.1）。红队第 2 路实测抓到。
  s = s.replace(/((?:\d+(?:\.\d+)?|\.\d+))%(?=[)+\-*/(]|$)/g, '($1/100)');
  // 5.6 隐式乘号（造价习惯手写 2(1.2+3.4)、3.6(1) 表示相乘）——
  //     JS 会当成「函数调用」直接报错。只在「数字 / 右括号」后面紧跟 ( 时补乘号，
  //     所以 sqrt(16)、round(a,b) 这类函数调用不受影响。
  s = s.replace(/(\d|\))\s*\(/g, '$1*(');
  // 6. ^ 当幂（**）
  s = s.replace(/\^/g, '**');
  // 7. 括号自动配平（造价常漏右括号）
  const open = (s.match(/\(/g) || []).length;
  const close = (s.match(/\)/g) || []).length;
  if (open > close) s += ')'.repeat(open - close);
  else if (close > open) { for (let i = 0; i < close - open; i++) s = s.replace(')', ''); }
  // 8. 函数名翻译（round/sqrt/abs 等 → Math.xxx；round 特意不映射 Math.round，见 fhrRound）
  s = s.replace(/\bround\b/gi, 'fhr')
       .replace(/\bsqrt\b/gi, 'Math.sqrt')
       .replace(/\babs\b/gi, 'Math.abs')
       .replace(/\btrunc\b/gi, 'Math.trunc')
       .replace(/\btan\b/gi, 'Math.tan')
       .replace(/\bsin\b/gi, 'Math.sin')
       .replace(/\bcos\b/gi, 'Math.cos')
       .replace(/\basin\b/gi, 'Math.asin')
       .replace(/\bacos\b/gi, 'Math.acos')
       .replace(/\batan\b/gi, 'Math.atan')
       .replace(/\bexp\b/gi, 'Math.exp')
       // ★ 顺序不能反（2026-09-23 修）：log 必须排在 ln 前面。
       //   反过来的话，ln(100) 先被换成 Math.log(100)，紧接着 log 那一条又去改自己刚写出来的
       //   「Math.log」，结果变成 Math.Math.log10(100) → 直接报错 → 算不出。ln 一直是坏的。
       .replace(/\blog\b/gi, 'Math.log10')
       .replace(/\bln\b/gi, 'Math.log')
       .replace(/\bpow\b/gi, 'Math.pow');
  // 9. 白名单校验（必须含数字，允许函数名字母；逗号用于 Math.pow(a,b) / fhr(a,b)）
  if (!/[0-9]/.test(s)) return undefined;
  if (/[^0-9+\-*/(),.%^eEa-zA-Z]/i.test(s)) return undefined;
  try { return Function('fhr', '"use strict"; return (' + s + ')')(fhrRound); }
  catch(e) { return undefined; }
}

/* ══ 算式错误解释（2026-10-07 第 1 条；2026-10-08 用户两改）══════════════
   safeEval 算不出时只返回 undefined，界面上一声不吭 —— 用户不知道错在哪。
   evalDiagnose(expr) 沿用 safeEval 同一条清洗/归一流水线，给出**真实**原因。
   ★ 2026-10-08 用户「我不想提示这么多字」：文案全部砍成一短句；
   ★ 2026-10-08 用户「哪里错了标红」：返回值改成 {msg, bad} —— bad 是算式里
     出错的字符/片段，行尾镜像层把它在原位标红（renderLineEcho），不用数格子。
     bad 找得到才标（标注剥离后位置对不上时宁可不标，别标错）。 */
function evalDiagnose(expr) {
  const raw = String(expr || '');
  let s = raw
    .replace(/\[[^\]]*\]/g, '').replace(/【[^】]*】/g, '')
    /* 全角归一先做（与 safeEval / normCommon / normForSheet 同序，糯米 #362） */
    .replace(/[¥$￥]/g, '').replace(/　/g, ' ').replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/｛/g, '{').replace(/｝/g, '}');
  /* 花括号口径与 safeEval 完全一致（式子→圆括号，纯标注→剥掉），顺序也一样：先花括号再 (expr=标注) */
  for (let bi = 0; bi < 8 && s.indexOf('{') >= 0; bi++) {
    const prev = s;
    s = s.replace(/\{([^{}]*)\}/g, (m, inner) => {
      const t = inner.replace(/\[[^\]]*\]/g, '').replace(/【[^】]*】/g, '');
      if (!/[0-9]/.test(t) || /[,，]/.test(t) || !/[+\-*/×÷＋－]/.test(t) ||
          /[^0-9\s.+\-*/()×÷＋－（）·]/.test(t)) return '';
      return '(' + inner + ')';
    });
    if (s === prev) break;
  }
  s = s.replace(/\(([^()]*?)=[^()]*\)/g, '($1)');
  if (!s.trim()) return { msg: '整行是标注 —— 前面加个数，如 1.5【柱墩体积】' };
  /* 与 safeEval 相同的归一（π 也换成数字，避免纯 π 行被误报「没有数字」） */
  s = s.replace(/[¥$￥]/g, '').replace(/　/g, ' ');
  s = s.replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  /* ★ 2026-10-08（用户）：「2 3」原来去空格后拼成「23」静默算错 —— 现在报错。
     与 safeEval 的 3.9 步同款判定，两个数之间必须有运算符。
     要在去空格之前判（去了空格就再也找不回来了）。 */
  const gap = s.match(/\d\s+[.\d]/);
  if (gap) return { msg: '「' + gap[0].replace(/\s+/g, ' ') + '」中间只有空格 —— 两个数之间要有运算符', bad: gap[0] };
  s = s.replace(/\s+/g, '');
  s = s.replace(/(\d),(?=\d)/g, '$1');
  s = s.replace(/×/g, '*').replace(/÷/g, '/').replace(/（/g, '(').replace(/）/g, ')')
       .replace(/[·•]/g, '*')
       .replace(/[πΠ]/g, '(' + Math.PI + ')').replace(/pi/gi, '(' + Math.PI + ')')
       .replace(/\^/g, '**');
  /* ① 非法字符：字符本体单独给 bad（镜像层原位标红），文案不重复说位置
     —— ★ 2026-10-08 用户「不要写什么不认识」：标红已经指出错在哪，别再写一长串 */
  const badChar = s.match(/[^0-9+\-*/(),.%^eEa-zA-Z]/i);
  if (badChar) {
    return { msg: '「' + badChar[0] + '」用错了', bad: badChar[0] };
  }
  /* ② 括号配平情况（safeEval 会自动补/删括号，但补完仍算不出时，差值就是真相） */
  const open = (s.match(/\(/g) || []).length, close = (s.match(/\)/g) || []).length;
  if (open > close) return { msg: '差 ' + (open - close) + ' 个右括号「)」' };
  if (close > open) return { msg: '多 ' + (close - open) + ' 个右括号「)」' };
  /* ③ 运算符接法：连写（1++2、1乘以除以混写）、结尾停在运算符上、空括号、悬空小数点。
     幂「^」在归一时已换成「**」，是合法运算符 —— 查连写前先把它摘掉，别误报。 */
  if (/\*\*$/.test(s)) return { msg: '结尾缺一个数' };
  const ops = s.replace(/\*\*/g, '');
  const m = ops.match(/[+\-*/]{2,}/);
  if (m) return { msg: '运算符连写「' + m[0] + '」', bad: m[0] };
  if (/[+\-*/]$/.test(ops)) return { msg: '结尾缺一个数' };
  if (/^[*/]/.test(ops)) return { msg: '开头不能是运算符' };
  if (/[+*/]\)/.test(ops)) return { msg: '「+)」括号里缺数字' };
  /* ★ 2026-10-08：空括号要排在「运算符后跟左括号」前面判 —— 否则 5*() 被抢答成
     「运算符后面直接跟了左括号「+(」」，明明是空括号（红队实测抓到）。 */
  if (/\(\)/.test(s)) return { msg: '有空括号 () —— 括号里要填内容' };
  if (/[+*/]\(/.test(ops)) return { msg: '「+(」括号里缺数字' };
  if (/\d\.\d*\./.test(s) || /\.$/.test(s)) return { msg: '小数点用重了' };
  /* ④ 不认识的文字：抽出字母词，不在函数名白名单里的原样报出来 */
  const KNOWN = { math:1, pi:1, e:1, round:1, fhr:1, sqrt:1, abs:1, trunc:1, tan:1, sin:1,
    cos:1, asin:1, acos:1, atan:1, exp:1, log:1, ln:1, pow:1 };
  const words = s.match(/[a-zA-Z]+/g) || [];
  for (let i = 0; i < words.length; i++) {
    if (!KNOWN[words[i].toLowerCase()]) {
      return { msg: '「' + words[i] + '」不是函数名 —— 或给它加【】变成标注', bad: words[i] };
    }
  }
  /* ⑤ 数值域 / 除零（2026-10-08 加）：式子结构没错、是算不出实数 ——
     原来一律落到「算式结构不对」，把用户往「括号写错」上带（红队实测：1/0、sqrt(-1)、ln(0) 全中）。 */
  if (/\/\s*\(?\s*0\s*\)?(?![\d.])/.test(s)) return { msg: '除数是 0' };
  if (/\b(sqrt|ln|log)\s*\(\s*-/.test(s)) return { msg: 'sqrt / ln / log 里不能是负数' };
  if (/\b(ln|log)\s*\(\s*0\s*\)/.test(s)) return { msg: 'ln / log 里不能是 0' };
  return { msg: '算不出 —— 查除 0、负数开方、括号接法' };
}

/* round(x, n)：四舍五入到 n 位小数（n 省略＝取整）。
   为什么不直接映射 Math.round —— Math.round 只收一个参数，
   round(88.263,2) 会被当成 Math.round(88.263) 得 88，第二位白写（2026-09-20 实测）。 */
function fhrRound(v, n) {
  const x = Number(v);
  if (!isFinite(x)) return x;
  const d = (n == null || n === '') ? 0 : Math.trunc(Number(n));
  const k = Math.pow(10, d);
  return Math.round(x * k) / k;
}

function formatNum(n) {
  const prec = parseInt(curPrec);
  if (Number.isInteger(n) && prec === 0) return n.toString();
  return Number(n.toFixed(prec)).toString();
}

function escHtml(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return escHtml(s).replace(/"/g,'&quot;'); }

/* ══════════════════════════════════════════════════════════════════════════
   浮层定位（2026-09-20 统一）
   背景：窗口最小只有 740×260、桌面壳默认 900×300，而所有下拉/小卡片都是 fixed 满屏定位。
   原来的写法有两处硬伤：
     ① 各处各算一遍坐标，且**先用硬编码的 360 / 300 / 200 估高度**
        （f(x) 下拉 13 项实际 440px，按 360 估 → 底部 LN / POW 顶出窗口被切掉，
          用户 2026-09-20 实拍指出）；
     ② 有的地方「先量尺寸、后加 .show」——元素还是 display:none，量到的宽高是 0，
        连估都估不准。
   现在统一成一条规则：**先把浮层显示出来 → 量真实尺寸 → 摆位**。
   摆位顺序：偏好方向放得下就用 → 放不下翻到另一侧 → 两侧都放不下就钳进窗口，
   并把高度压到剩余空间（浮层自己内部滚动）—— 保证**任何窗口尺寸下都完整可见**。

   el      ：浮层元素（position:fixed）
   anchor  ：锚点矩形（DOMRect 或 {top,bottom,left,right} 手搓的也行）
   opts    ：{ gap 默认 4（浮层与锚点的间距）, align: 'left'|'right'|'center' }
   ══════════════════════════════════════════════════════════════════════════ */
function placeFloat(el, anchor, opts) {
  if (!el || !anchor) return;
  opts = opts || {};
  const vw = window.innerWidth, vh = window.innerHeight;
  const PAD = 8;                                    // 离窗口边缘至少留 8px
  const gap = (opts.gap == null) ? 4 : opts.gap;

  /* 上一次可能压过高度/宽度 —— 先还原，不然量到的是被压小的尺寸 */
  el.style.maxHeight = '';
  el.style.maxWidth = '';
  el.style.left = '0px';
  el.style.top = '0px';
  /* 还没显示出来（display:none）就先临时占位，量完还原，用户看不到这一瞬 */
  const needProbe = (el.offsetWidth === 0 && el.offsetHeight === 0);
  if (needProbe) { el.style.visibility = 'hidden'; el.style.display = 'block'; }
  const w = el.offsetWidth, h = el.offsetHeight;
  if (needProbe) { el.style.display = ''; el.style.visibility = ''; }

  /* ── 纵向：先挑方向 ── */
  const below = vh - PAD - anchor.bottom - gap;     // 往下还有多少空间
  const above = anchor.top - gap - PAD;             // 往上还有多少空间
  let top;
  if (h <= below) top = anchor.bottom + gap;             // 下方放得下
  else if (h <= above) top = anchor.top - gap - h;       // 上方放得下（底边对齐锚点）
  else if (below >= above) top = anchor.bottom + gap;    // 两侧都不够 → 选大的一侧
  else top = anchor.top - gap - h;
  /* 钳进窗口，并保证至少留出一小截可见高度（否则浮层会变成 0 高） */
  const need = Math.min(h, 100);
  top = Math.max(PAD, Math.min(top, vh - PAD - need));

  /* ── 横向 ── */
  let left;
  if (opts.align === 'right') left = anchor.right - w;
  else if (opts.align === 'center') left = anchor.left + ((anchor.width || 0) - w) / 2;
  else left = anchor.left;
  left = Math.max(PAD, Math.min(left, vw - PAD - Math.min(w, vw - 2 * PAD)));

  el.style.left = Math.round(left) + 'px';
  el.style.top = Math.round(top) + 'px';

  /* ── 摆完还剩多少空间：不够就把高度压下来内部滚动，绝不顶出窗口 ── */
  const availH = vh - PAD - top;
  if (h > availH) {
    el.style.maxHeight = Math.max(0, Math.floor(availH)) + 'px';
    /* 压了高度**必须同时给内部滚动**：光设 max-height 而 overflow 还是 visible 时，
       内容照旧画到窗口外面被切掉（2026-09-21 在 740×260 实测：右键菜单「函数 / 计算表达式」
       两项被顶出窗口，点都点不到）。
       这里的浮层都不靠"溢出来展示"子元素 —— 子菜单一律 position:fixed 自己定位
       （.label-submenu / .ctx-submenu-panel / .steel-suggest），所以压宽压高都不会切坏它们。 */
    if (getComputedStyle(el).overflowY === 'visible') el.style.overflowY = 'auto';
  }
  const availW = vw - PAD - left;
  if (w > availW) {
    el.style.maxWidth = Math.max(0, Math.floor(availW)) + 'px';
    if (getComputedStyle(el).overflowX === 'visible') el.style.overflowX = 'auto';
  }
}




/* ── 记录窗口 · 附图：截图 Ctrl+V / 拖入 / 选图 ─────────────────────
   图片存 IndexedDB（localStorage 只有 5MB，存不下截图）；
   环境不给用就降级成内存（仅本次有效），并在提示行说明。 */
const SHOT_DB = 'forhan_calc_shots', SHOT_STORE = 'shots';
/* 附图提示文案已并入表格底部提示行（原附图区随左栏取消） */
let shotDB = null, shotStoreOK = true, shotMem = [], shotSeq = 1, shotUrls = [], shotViewId = null, shotHintTimer = null;

function shotOpenDB() {
  return new Promise(function (resolve, reject) {
    if (!window.indexedDB) { reject(new Error('no indexedDB')); return; }
    const req = indexedDB.open(SHOT_DB, 1);
    req.onupgradeneeded = function () {
      const db = req.result;
      if (!db.objectStoreNames.contains(SHOT_STORE)) {
        db.createObjectStore(SHOT_STORE, { keyPath: 'id', autoIncrement: true });
      }
    };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error || new Error('open fail')); };
  });
}
function shotTx(mode, run) {
  return new Promise(function (resolve, reject) {
    if (!shotDB) { reject(new Error('db not ready')); return; }
    let req;
    const tx = shotDB.transaction(SHOT_STORE, mode);
    req = run(tx.objectStore(SHOT_STORE));
    tx.oncomplete = function () { resolve(req ? req.result : undefined); };
    tx.onerror = function () { reject(tx.error || new Error('tx error')); };
    tx.onabort = function () { reject(tx.error || new Error('tx abort')); };
  });
}
function shotAll() {
  if (!shotStoreOK || !shotDB) return Promise.resolve(shotMem.slice());
  return shotTx('readonly', function (st) { return st.getAll(); })
    .catch(function () { shotStoreOK = false; return shotMem.slice(); });
}
/* 启动时清掉「没有任何行引用」的附图（2026-09-20）。
   来源：删行/清空时图先留着（好让「撤销」能把图一起带回来）、过了窗口才删；
   万一那次没删成，孤儿图会一直躺在 IndexedDB 里，越攒越多（渲染时全表要读一遍）。 */
async function pruneOrphanShots() {
  try {
    const all = await shotAll();
    if (!all.length) return;
    const used = {};
    sheetRows.forEach(function (r) { if (r.shotId != null) used[r.shotId] = 1; });
    let n = 0;
    for (let i = 0; i < all.length; i++) {
      const id = all[i] && all[i].id;
      if (id == null || used[id]) continue;
      await shotDelQuiet(id);
      n++;
    }
    if (n) { try { console.log('已清理无行引用的附图', n, '张'); } catch (e) {} }
  } catch (e) {}
}



/* 贴入前先压缩：长边 > 1400 才缩，统一转 JPEG(0.9)。
   一张 4K 截图 3~8MB → 通常压到 200~500KB，几十张也不至于把内存吃爆。 */
function shotCompress(blob) {
  return new Promise(function (resolve) {
    let done = false;
    const finish = function (b) { if (!done) { done = true; resolve(b || blob); } };
    try {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = function () {
        try {
          const LONG = 1400;
          let w = img.naturalWidth, h = img.naturalHeight;
          if (!w || !h) { URL.revokeObjectURL(url); finish(blob); return; }
          const k = Math.min(1, LONG / Math.max(w, h));
          w = Math.max(1, Math.round(w * k)); h = Math.max(1, Math.round(h * k));
          const cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          cv.toBlob(function (b) { URL.revokeObjectURL(url); finish(b); }, 'image/jpeg', 0.9);
        } catch (e) { URL.revokeObjectURL(url); finish(blob); }
      };
      img.onerror = function () { URL.revokeObjectURL(url); finish(blob); };
      img.src = url;
    } catch (e) { finish(blob); }
  });
}
/* 把一张图挂到某一行（每行一张：已有图先删旧的，不留孤儿） */
async function sheetAttachShot(rowId, file) {
  const r = sheetFind(rowId);
  if (!r || !file) return;
  const replaced = !!r.shotId;                  // 原来有图 → 这次是替换，得说一声
  if (r.shotId) { await shotDelQuiet(r.shotId); r.shotId = null; }
  const blob = await shotCompress(file);
  const rec = { blob: blob, time: Date.now(), name: (file && file.name) || '' };
  let stored = false, id = null;
  if (shotStoreOK && shotDB) {
    try { id = await shotTx('readwrite', function (st) { return st.add(rec); }); stored = true; }
    catch (e) { shotStoreOK = false; }
  }
  if (!stored) { id = 'm' + (shotSeq++); rec.id = id; shotMem.push(rec); }
  r.shotId = id;
  sheetSave();
  await sheetRender();
  if (stored) {
    sheetFlash(replaced ? '已替换这一行原来的附图' : '已贴到这一行');
  } else {
    /* 本环境存不住图：这句话必须留在屏幕上，不能像原来那样一闪而过 —— 用户会以为存住了 */
    appTip('这张图只存在本次运行里，关掉就没了（本环境不让长期存图）· 要留就用「导出 Excel」带出去', 7000, null, 'warn');
    sheetFlash('已贴入（本环境不能长期保存）');
  }
}
async function shotClone(id) {

  if (!source) return null;
  const rec = { blob: source.blob, time: Date.now(), name: source.name || '' };
  if (shotStoreOK && shotDB) {
    try { return await shotTx('readwrite', function (st) { return st.add(rec); }); }
    catch (e) { shotStoreOK = false; }
  }

}

    catch (e) { shotStoreOK = false; shotMem = shotMem.filter(function (r) { return r.id !== id; }); }

  let hit = false;

/* 提示写在计算稿底部那一行（原附图区的提示条已随左栏一起取消） */
function sheetFlash(msg, ms) {
  const el = $('sheetTip');
  if (!el) return;
  const hold = ms || 1800;
  /* ★ 2026-09-30 两处修正：
     ① 设「让位窗口」—— 否则 focusin/focusout 触发的 syncSheetTip 会立刻把这句话冲掉
        （红队实测：「已复制所选内容」存活不到 350ms），用户根本看不到。
     ② 到点**不再还原 dataset.orig 那句死文案** —— 那是第一次 flash 时记下的，
        之后焦点变了它也不知道，会还原出一句过时的提示。改成让 syncSheetTip 按

/* 取单张（存储或内存两条路都认） */
function shotGet(id) {
  if (shotStoreOK && shotDB && typeof id === 'number') {
    return shotTx('readonly', function (st) { return st.get(id); }).catch(function () { return null; });
  }
  for (let i = 0; i < shotMem.length; i++) {
    if (shotMem[i].id === id) return Promise.resolve(shotMem[i]);
  }
  return Promise.resolve(null);
}
/* 非 PNG（拖进来的 jpg 等）先转 PNG —— 剪贴板只收 image/png */
function shotToPng(blob) {
  return new Promise(function (resolve) {
    const img = new Image();
    const url = URL.createObjectURL(blob);
    img.onload = function () {
      let out = blob;
      try {
        const cv = document.createElement('canvas');
        cv.width = img.naturalWidth; cv.height = img.naturalHeight;
        cv.getContext('2d').drawImage(img, 0, 0);
        if (cv.toBlob) { cv.toBlob(function (b) { resolve(b || blob); }, 'image/png'); return; }
      } catch (e) { out = blob; }
      URL.revokeObjectURL(url);
      resolve(out);
    };
    img.onerror = function () { URL.revokeObjectURL(url); resolve(blob); };
    img.src = url;
  });
}
/* 复制这张图到系统剪贴板 → 直接去微信/QQ 对话框 Ctrl+V
   注：写剪贴板需要异步剪贴板 API（Chromium 88+/WebView2 均有）。
   实测「选中 <img> + execCommand('copy')」这条老兜底在现代 Chromium 只写 text/html、不带图，
   所以不做假兜底；真失败时提示走「把缩略图直接拖进微信」这条一定可行的路。 */
async function shotCopy(id) {
  const rec = await shotGet(id);
  if (!rec || !rec.blob) { shotFlash('这张图读不到了'); return; }
  let ok = false;
  try {
    if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem) {
      const blob = rec.blob.type === 'image/png' ? rec.blob : await shotToPng(rec.blob);
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      ok = true;
    }
  } catch (e) { ok = false; }
  shotFlash(ok ? '已复制 · 去微信里 Ctrl+V'

/* 看图放大：双击放大/还原、滚轮缩放、放大后拖动平移 */
let vScale = 1, vPanX = 0, vPanY = 0, vDrag = null, vOpenedAt = 0;
function shotZoomApply() {

    'scale(' + vScale + ') translate(' + (vPanX / vScale).toFixed(1) + 'px,' + (vPanY / vScale).toFixed(1) + 'px)';
  img.classList.toggle('zoomed', vScale > 1.001);
}

function shotFirstImage(dt) {
  if (!dt) return null;
  const items = dt.items ? Array.prototype.slice.call(dt.items) : [];
  for (let i = 0; i < items.length; i++) {
    if (items[i].kind === 'file' && /^image\//.test(items[i].type)) return items[i].getAsFile();
  }
  const files = dt.files ? Array.prototype.slice.call(dt.files) : [];
  for (let j = 0; j < files.length; j++) {

(function sheetInit() {
  /* 启动延后到本轮脚本执行完：sheetRows / viewSet 等用 let 声明在文件后段，
     同步跑会撞上暂时性死区（TDZ）直接报错。 */
  const boot = function () {
    sheetLoad();
    sheetTitleSync();
    viewSetLoad();
    sheetRender();
    shotOpenDB().then(function (db) { shotDB = db; return sheetRender(); })
                .catch(function () { shotStoreOK = false; return sheetRender(); })
                /* 图库就绪后再清孤儿图（必须在 sheetLoad 之后，否则不知道哪些图还被引用） */
                .then(function () { return pruneOrphanShots(); })
                /* 存完抬头看一眼存储余量（快满先提醒，见 storageGuard） */
                .then(function () { try { storageGuard(); } catch (e) {} });
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else setTimeout(boot, 0);

  /* Ctrl+V 贴图（每行一张）
     · 记录窗口开着 → 贴到当前选中的那一行
     · 否则 → 贴到「输入框里光标所在行」对应的表行（还没有就自动建一行）
     注：剪贴板同时带文字时一律让文字优先——从 Excel/Word 复制单元格会附位图，
        不挡住的话会把单元格内容吞成图片。 */
  document.addEventListener('paste', function (e) {
    const cb = e.clipboardData;
    if (!cb) return;
    const types = cb.types ? Array.prototype.slice.call(cb.types) : [];
    if (types.indexOf('text/plain') >= 0 || types.indexOf('text/html') >= 0) return;
    const f = shotFirstImage(cb);
    if (!f) return;
    if (curView !== 'calc') {                 // 计算稿态：贴到最后交互的那一行
      e.preventDefault();
      const t = sheetImageTargetRow();
      if (t) sheetAttachShot(t, f);
      else if (sheetRows.length) sheetAttachShot(sheetRows[sheetRows.length - 1].id, f);
      else sheetFlash('先在表里点一行，再贴图');
      return;
    }
    if (!activePanel) return;
    e.preventDefault();
    const row = sheetRowForLine(curLineIndex(activePanel.input));
    sheetAttachShot(row.id, f);
  });

  // 看图浮层
  $('imgViewerClose').addEventListener('click', shotCloseViewer);
  $('imgViewer').addEventListener('click', function (e) {
    if (e.target !== $('imgViewer')) return;
    shotCloseViewer();
  });
  // 双击放大 / 还原
  $('imgViewerImg').addEventListener('dblclick', shotZoomToggle);
  // 滚轮缩放（放大后按住拖动平移）
  $('imgViewer').addEventListener('wheel', function (e) {
    e.preventDefault();
    vScale = Math.min(6, Math.max(1, vScale * (e.deltaY < 0 ? 1.15 : 1 / 1.15)));
    if (vScale <= 1.001) { vPanX = 0; vPanY = 0; }
    shotZoomApply();
  }, { passive: false });
  $('imgViewerImg').addEventListener('mousedown', function (e) {
    if (vScale <= 1.001) return;
    e.preventDefault();
    vDrag = { x: e.clientX, y: e.clientY, px: vPanX, py: vPanY };
    $('imgViewerImg').classList.add('dragging');
  });
  document.addEventListener('mousemove', function (e) {
    if (!vDrag) return;
    vPanX = vDrag.px + (e.clientX - vDrag.x);
    vPanY = vDrag.py + (e.clientY - vDrag.y);
    shotZoomApply();
  });

    if (!vDrag) return;
    vDrag = null;
    $('imgViewerImg').classList.remove('dragging');
  });

var labelTargetEl = null;

  const full = targetText(el);
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return full.length;
  const r = sel.getRangeAt(0);
  if (!el.contains(r.startContainer)) return full.length;
  const pre = r.cloneRange();
  pre.selectNodeContents(el);
  try { pre.setEnd(r.startContainer, r.startOffset); } catch (e) { return full.length; }
  return pre.toString().length;

    const rr = sel.getRangeAt(0).cloneRange();
    rr.collapse(true);

    if (rect && (rect.top || rect.left)) return rect;

function targetSetText(el, text, caret) {
  if (!el) return;
  if (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') {
    el.value = text;
    el.focus();
    try { el.setSelectionRange(caret, caret); } catch (e) {}
    return;
  }
  el.textContent = text;
  el.focus();
  const node = el.firstChild;
  const sel = window.getSelection();
  if (!sel) return;
  const r = document.createRange();
  if (node) r.setStart(node, Math.min(caret, node.length)); else r.setStart(el, 0);
  r.collapse(true);
  sel.removeAllRanges();
  sel.addRange(r);

function getLabelContext() {
  const el = labelTargetEl || labelTargetNow();
  const pos = targetCaret(el);
  const text = targetText(el);
  for (let i = pos - 1; i >= 0; i--) {
    const c = text[i];
    if (c === '】' || c === ']') return null;
    if (c === '【' || c === '[') {
      // [ 和 【 都触发下拉，但插入时统一输出【xxx】中文方括号
      const query = text.substring(i + 1, pos);
      if (/[】\]]/.test(query)) return null;
      return { start: i, raw: '【', close: '】', query };
    }
  }
  return null;
}

  if (q) {
    visibleItems.forEach(it => { html += opt(it); });
    if (!visibleItems.length) html += `<div class="label-add" data-add="${escAttr(q)}">＋ 添加「${escHtml(q)}」为标签</div>`;
  } else {
    html += '<div class="label-cap">常用标签</div>';
    visibleItems.filter(it => it.kind === 'plain').forEach(it => { html += opt(it); });
    const rebarEntry = visibleItems.find(it => it.kind === 'rebarCard');
    const dateEntry = visibleItems.find(it => it.kind === 'dateCard');
    if (rebarEntry) html += entryOpt(rebarEntry, true);
    if (dateEntry) html += entryOpt(dateEntry, false);
    /* 柱墩入口 2026-10-08 已挪进「公式」菜单，这里不再出条目（清干净，别留死分支） */
  }

  labelDropdown.innerHTML = html;
  labelDropdown.classList.add('show');   // 先显示，placeFloat 才量得到真实高度
  positionDropdown();

  labelDropdown.querySelectorAll('.label-opt').forEach(el =>
    el.addEventListener('mousedown', e => { e.preventDefault(); selectByIdx(Number(el.dataset.idx)); }));
  const add = labelDropdown.querySelector('.label-add');
  if (add) add.addEventListener('mousedown', e => { e.preventDefault(); addCustomLabel(add.dataset.add); });

  // 自定义标签删除按钮
  labelDropdown.querySelectorAll('.del-label').forEach(btn =>
    btn.addEventListener('mousedown', e => { e.preventDefault(); delCustomLabel(btn.dataset.del); }));

  // 钢筋入口项：悬停二级下拉
  const rebarOptEl = labelDropdown.querySelector('.has-sub');
  if (rebarOptEl) renderRebarSubmenu(rebarOptEl);

  labelActive = visibleItems.length ? 0 : -1;
  updateActive();
}

function positionDropdown() {
  const el = labelTargetEl || inputArea;
  let anchor;
  if (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') {
    const rect = el.getBoundingClientRect();
    const caret = getCaretCoordinates(el, labelCtx.start + 1);
    const top = rect.top + caret.top - el.scrollTop + caret.height;
    const left = rect.left + caret.left - el.scrollLeft;
    anchor = { top: top, bottom: top, left: left, right: left, width: 0, height: 0 };
  } else {
    /* 表格格子（contenteditable）：按光标矩形定位 */
    const r = targetCaretRect(el);
    anchor = { top: r.top, bottom: r.bottom, left: r.left, right: r.left, width: 0, height: 0 };
  }
  /* 高度不再按固定 300 估 —— 量真实高度，放不下就翻到光标上方、再不够就压高度内滚 */
  placeFloat(labelDropdown, anchor, { gap: 4 });
}

function updateActive() {
  const opts = labelDropdown.querySelectorAll('.label-opt');
  opts.forEach((o, i) => o.classList.toggle('active', i === labelActive));
  if (opts[labelActive]) opts[labelActive].scrollIntoView({ block: 'nearest' });
}

function selectByIdx(i) {
  const it = visibleItems[i];
  if (!it) return;
  if (it.kind === 'rebarCard') { return; } /* 二级悬停下拉接管，键盘不额外动作 */
  if (it.kind === 'steelCard') { openSteelCalc(); return; }
  if (it.kind === 'dateCard') { openDateCalc(); return; }
  if (it.kind === 'triCard') { openTriCalc(); return; }  // 兜底：旧索引残留时仍可开卡
  /* 柱墩卡入口 2026-10-08 起走「公式」菜单（见 toggleFormulaDropdown 的 data-card="xz"），
     标签下拉不再产生 xzCard 条目，这里的分支已删 */
  if (it.kind === 'slopeCard') { insertLabelItem(it); return; }
  if (it.kind === 'meshCard') { insertLabelItem(it); return; }
  insertLabelItem(it);
}

function insertLabelItem(it) {
  if (!labelCtx || !it) return;
  const el = labelTargetEl || inputArea;      // 顶部算式框 or 表格里的计算式格子
  const text = targetText(el), pos = targetCaret(el);
  const before = text.substring(0, labelCtx.start);
  const after = text.substring(pos);
  let insert, caret;
  if (it.kind === 'plain') {
    insert = labelCtx.raw + it.name + labelCtx.close;
    caret = before.length + insert.length;
  } else if (it.kind === 'slopeCard') {
    // 找坡层平均厚度：h_avg = h_min + L * i / 2
    insert = '(1【最薄处厚度】+1【找坡方向的水平长度】*0.02【坡度】/2)';
    caret = before.length + 2; // 光标停在第一个 1 之后，方便直接改
  } else if (it.kind === 'meshCard') {
    // 钢筋网片重量（每平方米）：(1000/间距) * 2 方向 * 单根 kg/m
    insert = '((1000/200【钢筋间距】)*2*0.222【Φ6钢筋kg/m】)';
    caret = before.length + insert.length;
  } else {
    insert = '()*' + it.w + '【' + it.spec + '】';
    caret = before.length + 1;
  }
  targetSetText(el, before + insert + after, caret);
  hideLabelDropdown();
  if (el === inputArea) onInput();
  else el.dispatchEvent(new Event('input', { bubbles: true }));   // 格子：触发既有编辑逻辑落库
}

function selectLabel(t) { insertLabelItem({ kind:'plain', name:t, group:'标签' }); }

function addCustomLabel(q) {
  q = q.trim(); if (!q) return;
  if (!customLabels.includes(q)) { customLabels.push(q); safeLS.set('calc_labels', JSON.stringify(customLabels)); }
  selectLabel(q);
}
function delCustomLabel(q) {
  q = q.trim(); if (!q) return;
  customLabels = customLabels.filter(t => t !== q);
  safeLS.set('calc_labels', JSON.stringify(customLabels));
  renderLabelDropdown();
}

function hideLabelDropdown() { labelDropdown.classList.remove('show'); labelCtx = null; labelActive = -1; visibleItems = []; }

/* ══════════════════════════════════════════════════════════════════════
   单元格候选下拉（单位 / 项目名称）
   为什么不用 <datalist>：原生下拉是浏览器画的，那块深色面板样式改不了
   —— 用户 2026-09-18 反馈「单位的下拉太丑」。改成与标签下拉同一套皮肤。
   ══════════════════════════════════════════════════════════════════════ */
const UNIT_OPTIONS = ['m²','m³','m','km','kg','t','个','项','樘','套','处','组','根','块','张','片','台','座','工日','元'];
var cellDrop = $('cellDropdown');
var cdInput = null, cdItems = [], cdActive = -1;

/* 候选来源：单位 = 造价常用 + 表里用过的；项目名称 = 表里已经出现过的 */
function cdCollect(kind, cur) {
  cur = String(cur || '').trim();
  const seen = {}, out = [];
  const push = function (v, hint) {
    v = String(v == null ? '' : v).trim();
    if (!v || v === cur || seen[v]) return;
    seen[v] = 1; out.push({ v: v, hint: hint });
  };
  if (kind === 'unit') {
    UNIT_OPTIONS.forEach(function (u) { push(u, '常用'); });
    sheetRows.forEach(function (r) { if (r.kind !== 'section') push(r.unit, '表里用过'); });
  } else {
    sheetRows.forEach(function (r) { if (r.kind !== 'section') push(r.name, '表里已有'); });
  }
  return out;
}
function cdRender(q) {
  if (!cdInput) { closeCellDropdown(); return; }
  const kind = cdInput.dataset.pick || '';
  const all = cdCollect(kind, cdInput.value);
  const qq = String(q || '').trim().toLowerCase();
  cdItems = qq ? all.filter(function (it) { return it.v.toLowerCase().indexOf(qq) >= 0; }) : all;
  if (!cdItems.length) { closeCellDropdown(); return; }
  let html = '<div class="cd-cap">' + (kind === 'unit' ? '常用单位' : '表里的项目名称') + '</div>';
  cdItems.forEach(function (it, i) {
    html += '<div class="cd-opt" data-idx="' + i + '"><span class="cd-txt">' + escHtml(it.v) + '</span><span class="cd-hint">' + it.hint + '</span></div>';
  });
  cellDrop.innerHTML = html;
  cellDrop.classList.add('show');
  cdActive = 0;
  cdUpdateActive();
  /* 单位/项目名称候选：按真实高度摆位（贴近表格下边缘时自动上翻，不顶出窗口） */
  placeFloat(cellDrop, cdInput.getBoundingClientRect(), { gap: 2 });
  Array.prototype.slice.call(cellDrop.querySelectorAll('.cd-opt')).forEach(function (el) {
    el.addEventListener('mousedown', function (e) { e.preventDefault(); cdPick(Number(el.dataset.idx)); });
  });
}
function cdUpdateActive() {
  Array.prototype.slice.call(cellDrop.querySelectorAll('.cd-opt')).forEach(function (o, i) { o.classList.toggle('active', i === cdActive); });
  const a = cellDrop.querySelectorAll('.cd-opt')[cdActive];
  if (a) a.scrollIntoView({ block: 'nearest' });
}
function cdPick(i) {
  const it = cdItems[i];
  const el = cdInput;
  if (!it || !el) { closeCellDropdown(); return; }
  el.value = it.v;
  closeCellDropdown();
  el.focus();
  el.dispatchEvent(new Event('input', { bubbles: true }));   // 交给既有编辑逻辑落库
}
function closeCellDropdown() {
  if (cellDrop) cellDrop.classList.remove('show');
  cdInput = null; cdItems = []; cdActive = -1;
}
function openCellDropdown(input) { cdInput = input; cdRender(''); }

/* ══════════════════════════════════════════════════════════════════════
   页内二次确认（破坏性操作）
   壳里的 window.confirm 不一定弹得出来 —— 与其赌它，不如自己画一个：
   默认焦点落在「取消」，手抖也清不掉。
   ══════════════════════════════════════════════════════════════════════ */
var confirmMask = $('confirmMask');
var _confirmResolve = null;
function askConfirm(o) {
  o = o || {};
  return new Promise(function (resolve) {
    _confirmResolve = resolve;
    const t = $('confirmTitle'), x = $('confirmText'), y = $('confirmYes');
    if (t) t.textContent = o.title || '确认操作？';
    if (x) x.innerHTML = o.text || '';
    if (y) y.textContent = o.ok || '确认';
    confirmMask.classList.add('show');
    setTimeout(function () { try { $('confirmNo').focus(); } catch (e) {} }, 0);
  });
}
function confirmClose(v) {
  confirmMask.classList.remove('show');
  const r = _confirmResolve; _confirmResolve = null;
  if (r) r(v);
}
/* 输入弹窗（2026-09-27）：壳里没有可用的 window.prompt，自定义公式要问名字和内容。
   返回 Promise<string|null>，取消给 null。 */
var _promptResolve = null, _promptWithName = false;
function askPrompt(o) {
  o = o || {};
  return new Promise(function (resolve) {
    _promptResolve = resolve;
    _promptWithName = !!o.withName;
    const t = $('promptTitle'), x = $('promptText'), inp = $('promptInput'), ninp = $('promptInputName');
    if (t) t.textContent = o.title || '输入';
    if (x) x.innerHTML = o.text || '';
    if (ninp) {
      ninp.style.display = _promptWithName ? '' : 'none';
      ninp.value = o.nameValue || '';
      ninp.placeholder = o.namePlaceholder || '';
    }
    if (inp) { inp.value = o.value || ''; inp.placeholder = o.placeholder || ''; }
    $('promptMask').classList.add('show');
    setTimeout(function () { try {
      const first = (_promptWithName && ninp) ? ninp : inp;
      first.focus(); first.select();
    } catch (e) {} }, 0);
  });
}
/* 按当前模式收值：单输入返回 string；双输入（withName）返回 {name, expr}，算式必填 */
function promptCollect() {
  const inp = $('promptInput'), ninp = $('promptInputName');
  const expr = (inp ? inp.value : '').trim();
  if (_promptWithName) {
    const nm = (ninp ? ninp.value : '').trim();
    if (!expr) return null;
    return { name: nm, expr: expr };
  }
  return expr || null;
}
function promptClose(v) {
  $('promptMask').classList.remove('show');
  const r = _promptResolve; _promptResolve = null;
  if (r) r(v);
}
$('promptYes').addEventListener('click', function () { promptClose(promptCollect()); });
$('promptNo').addEventListener('click', function () { promptClose(null); });
$('promptMask').addEventListener('mousedown', function (e) { if (e.target === $('promptMask')) promptClose(null); });
document.addEventListener('keydown', function (e) {
  if (!$('promptMask').classList.contains('show')) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); promptClose(null); }
  else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); promptClose(promptCollect()); }
}, true);
$('confirmYes').addEventListener('click', function () { confirmClose(true); });
$('confirmNo').addEventListener('click', function () { confirmClose(false); });
confirmMask.addEventListener('mousedown', function (e) { if (e.target === confirmMask) confirmClose(false); });
/* Esc 关确认框：capture + 阻断传播，别让它顺带把「计算稿」也切回简洁 */
document.addEventListener('keydown', function (e) {
  if (!confirmMask.classList.contains('show')) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); confirmClose(false); }
  else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); if (document.activeElement === $('confirmYes')) confirmClose(true); }
}, true);

// 函数下拉（f(x) 按钮 + 右键菜单共用）
const fxDropdown = $('fxDropdown');
let fxCtxPanel = null;  // 记录哪个 panel 触发了下拉

function toggleFxDropdown(panel) {
  if (fxDropdown.classList.contains('show')) { hideFxDropdown(); return; }
  hideFormulaDropdown();
  fxCtxPanel = panel;
  setActive(panel);
  fxDropdown.innerHTML = fxItems.map((it, i) =>
    `<div class="fx-opt" data-idx="${i}"><span class="name">${it.n}</span><span class="desc">${it.desc}</span></div>`
  ).join('');
  fxDropdown.querySelectorAll('.fx-opt').forEach(el =>
    el.addEventListener('mousedown', e => {
      if (fxItems[Number(el.dataset.idx)] && fxItems[Number(el.dataset.idx)].tri) { openTriCalc(); hideFxDropdown(); return; }
      e.preventDefault();
      const sp0 = exprSpot();
      const wrapped = insertAtCursor(fxItems[Number(el.dataset.idx)].ins);
      if (!wrapped && sp0) {
        // 无框选：插入 round( 后自动补右括号占位，光标停在中间
        insertAtCursor(')');
        spotSetCaret(sp0, spotSel(sp0)[0] - 1);
      }
      hideFxDropdown();
    })
  );
  /* 先显示再量尺寸 —— 原来用硬编码的 360 估高度（实际 13 项约 440px），
     估小了就顶出窗口，底部 LN / POW 被切掉（2026-09-20 用户实拍）。 */
  fxDropdown.classList.add('show');
  placeFloat(fxDropdown, panel.wrap.querySelector('.fx-btn').getBoundingClientRect(), { gap: 4 });
}

function hideFxDropdown() { fxDropdown.classList.remove('show'); fxCtxPanel = null; }

/* 公式按钮下拉：找坡层平均厚度 / 钢筋网片重量（「Excel求值公式」已于 2026-09-22 删除） */
const formulaDropdown = $('formulaDropdown');
function toggleFormulaDropdown(panel) {
  if (formulaDropdown.classList.contains('show')) { hideFormulaDropdown(); return; }
  hideFxDropdown();
  hideLabelDropdown();
  setActive(panel);
  const builtin = Object.keys(formulaTemplates).map(k =>
    `<div class="fx-opt" data-k="${k}"><span class="name">${escHtml(formulaTemplates[k].name)}</span>` +
    `<span class="desc">${escHtml(formulaTemplates[k].desc || '')}</span></div>`).join('');
  const mine = customFormulas.map(function (f, i) {
    /* 列表里显示名称（菜单标签，方便认）；无名称回退显示算式。旧数据兼容 expr。 */
    let lb = String(f.name || f.expr || ''); if (lb.length > 20) lb = lb.slice(0, 20) + '…';
    return `<div class="fx-opt fx-mine" data-c="${i}"><span class="name">${escHtml(lb)}</span>` +
    `<div class="fx-actions">` +
    `<button class="fx-del-btn" data-delf="${i}" type="button" aria-label="删除" title="删除这个公式">✕</button>` +
    `<div class="fx-confirm-card" data-confirm="${i}">` +
    `<span class="fx-confirm-text">删除这条公式？</span>` +
    `<div class="fx-confirm-btns">` +
    `<button class="fx-confirm-no" data-confirm-no="${i}" type="button">取消</button>` +
    `<button class="fx-confirm-yes danger" data-confirm-yes="${i}" type="button">删除</button>` +
    `</div></div></div></div>`; }).join('');
  /* ★ 2026-10-08 用户：下柱墩卡片的入口挪到「公式」菜单里（原来在标签下拉，跟三角一样两处重复）。
     它是「填参数→吐算式」的开卡口，和公式菜单同一件事：都是把一段算式塞进当前格。 */
  /* ★ 2026-10-08（用户「写简单点，就写：下柱墩参数计算」）：长描述删掉 */
  const cards = '<div class="fx-opt fx-card" data-card="xz">' +
    '<span class="name">下柱墩参数计算</span></div>';
  formulaDropdown.innerHTML = cards + builtin + mine +
    '<div class="fx-opt fx-add" data-add="1"><span class="name">＋ 新增公式…</span></div>';
  formulaDropdown.querySelectorAll('.fx-opt').forEach(function (el) {
    el.addEventListener('mousedown', function (e) {
      e.preventDefault();
      if (el.dataset.card === 'xz') { hideFormulaDropdown(); openXzCalc(); return; }
      if (el.dataset.add) { addCustomFormula(); hideFormulaDropdown(); return; }
      if (el.classList.contains('fx-mine')) {
        // 点自定义公式：只有点文字区才插入；点删除/确认区被子元素拦截
        if (!e.target.closest('.fx-actions')) {
          insertCustomFormula(Number(el.dataset.c));
          hideFormulaDropdown();
        }
        return;
      }
      insertFormulaItem(el.dataset.k);
      hideFormulaDropdown();
    });
  });
  // 删除按钮：展开当前公式的 inline 确认卡片
  formulaDropdown.querySelectorAll('.fx-del-btn').forEach(function (btn) {
    btn.addEventListener('mousedown', function (e) {
      e.preventDefault(); e.stopPropagation();
      formulaDropdown.querySelectorAll('.fx-confirm-card.show').forEach(function (c) { c.classList.remove('show'); });
      var card = formulaDropdown.querySelector('.fx-confirm-card[data-confirm="' + btn.dataset.delf + '"]');
      if (card) card.classList.add('show');
    });
  });
  // 确认删除
  formulaDropdown.querySelectorAll('.fx-confirm-yes').forEach(function (btn) {
    btn.addEventListener('mousedown', function (e) {
      e.preventDefault(); e.stopPropagation();
      delCustomFormula(Number(btn.dataset.confirmYes));
    });
  });
  // 取消删除
  formulaDropdown.querySelectorAll('.fx-confirm-no').forEach(function (btn) {
    btn.addEventListener('mousedown', function (e) {
      e.preventDefault(); e.stopPropagation();
      var card = formulaDropdown.querySelector('.fx-confirm-card[data-confirm="' + btn.dataset.confirmNo + '"]');
      if (card) card.classList.remove('show');
    });
  });
  /* 同上：先显示再按真实高度摆位 */
  formulaDropdown.classList.add('show');
  placeFloat(formulaDropdown, panel.wrap.querySelector('.formula-btn').getBoundingClientRect(), { gap: 4 });
}
function hideFormulaDropdown() {
  formulaDropdown.classList.remove('show');
  // 连带清掉内嵌确认卡片的展开态，避免下拉关闭后卡片状态残留（下次重开会整块重建，这里提前归位更稳）
  formulaDropdown.querySelectorAll('.fx-confirm-card.show').forEach(function (c) { c.classList.remove('show'); });
}

/* 自定义公式（2026-09-27 用户要求：公式按钮能自己加、自己删）
   新增时把「光标处当前选中的算式」当模板 —— 造价里的公式往往是先手算一遍再存下来复用。 */
function addCustomFormula() {
  const sp = exprSpot();
  const preset = sp ? (function () { const s = spotSel(sp); return spotText(sp).slice(s[0], s[1]); })() : '';
  /* 2026-10-10 用户：名称只是菜单里的标签（方便认），算式才是公式本体；
     点一下只插算式、不插【名称】。弹窗两行：上=公式名称，下=算式。 */
  askPrompt({
    title: '新增公式',
    withName: true,
    namePlaceholder: '公式名称',
    value: preset,
    placeholder: '如：长*宽'
  }).then(function (r) {
    if (!r) return;
    customFormulas.push({ name: r.name || '', expr: r.expr, display: r.expr });
    safeLS.set(FORMULA_LS, JSON.stringify(customFormulas));
    sheetFlash('公式已存进「公式」按钮', 2600);
  });
}
function delCustomFormula(i) {
  const f = customFormulas[i];
  if (!f) return;
  customFormulas.splice(i, 1);
  safeLS.set(FORMULA_LS, JSON.stringify(customFormulas));
  hideFormulaDropdown();
  sheetFlash('公式已删除', 2000);
}
function insertCustomFormula(i) {
  const f = customFormulas[i];
  if (!f) return;
  const sp = exprSpot();
  if (!sp) { spotFlashEmpty(); return; }
  /* 插入只插算式本体（f.expr）；旧迁移数据无 expr 时回退 display/name，名称不进算式。 */
  const text = f.expr || f.display || f.name || '';
  const v = spotText(sp), se = spotSel(sp), start = se[0], end = se[1];
  spotWrite(sp, v.slice(0, start) + text + v.slice(end), start + text.length);
}

/* 公式项插入当前光标；slopeCard 光标停在首个数字后方便直接改 */
function insertFormulaItem(kind) {
  const t = formulaTemplates[kind];
  if (!t) return;
  const sp = exprSpot();                       // 计算稿态写进选中格；简洁态写进顶部算式框
  if (!sp) { spotFlashEmpty(); return; }
  const v = spotText(sp), se = spotSel(sp), start = se[0], end = se[1];
  const caret = start + (t.caretAfter != null ? t.caretAfter : t.insert.length);
  spotWrite(sp, v.slice(0, start) + t.insert + v.slice(end), caret);
}

/* 转置：整列【】⇄[ ] 互转（有【则转半角，否则转回全角） */
function transposeBrackets() {
  const sp = exprSpot();
  if (!sp) { spotFlashEmpty(); return; }
  const v = spotText(sp);
  let out = null;
  if (v.indexOf('【') >= 0 || v.indexOf('】') >= 0) out = v.replace(/【/g, '[').replace(/】/g, ']');
  else if (v.indexOf('[') >= 0 || v.indexOf(']') >= 0) out = v.replace(/\[/g, '【').replace(/\]/g, '】');

function onPanelKeydown(e) {
  const isCtrl = e.ctrlKey && !e.altKey && !e.metaKey;
  // Ctrl+1：框选 → 给选中内容加括号（1+1 → (1+1)）；未框选 → 在光标处补一对小括号（光标停在括号内）
  if (isCtrl && (e.key === '1' || e.code === 'Digit1')) {
    e.preventDefault();
    e.stopPropagation();   // 拦住全局 Ctrl+数字 插入函数处理器，避免 Ctrl+1 同时插出 sqrt() 等
    const ta = e.target;
    const s = ta.selectionStart, en = ta.selectionEnd;
    /* ★ 2026-10-08：程序改动前留快照 —— setRangeText 不进浏览器原生撤销栈，
       不自己记一份的话 Ctrl+Z 撤不掉（「?」里写着能撤，实际撤不了）。 */
    spotUndoPush(ta, ta.value, ta.selectionStart);
    if (s !== en) {
      const sel = ta.value.slice(s, en);
      ta.setRangeText('(' + sel + ')', s, en, 'end');
    } else {
      ta.setRangeText('()', s, s, 'end');
      ta.setSelectionRange(s + 1, s + 1);   // 光标落进括号中间，直接输内容
    }
    ta.dispatchEvent(new Event('input', { bubbles: true }));  // 触发重算
    return;
  }
  // Ctrl+2：给整个公式（光标所在整行）外面套一对小括号
  if (isCtrl && (e.key === '2' || e.code === 'Digit2')) {
    e.preventDefault();
    e.stopPropagation();   // 同上，拦住全局 Ctrl+2 的 abs()
    const ta = e.target;
    const text = ta.value;
    spotUndoPush(ta, ta.value, ta.selectionStart);   // 同上：给 Ctrl+Z 留一份快照
    const ls = text.lastIndexOf('\n', ta.selectionStart - 1) + 1;
    const leRaw = text.indexOf('\n', ta.selectionStart);
    const le = leRaw === -1 ? text.length : leRaw;
    const line = text.slice(ls, le);
    if (line.trim()) {
      const lead = line.match(/^\s*/)[0];
      const trail = line.match(/\s*$/)[0];
      const core = line.slice(lead.length, line.length - trail.length);
      ta.setRangeText(lead + '(' + core + ')' + trail, ls, le, 'preserve');
      ta.dispatchEvent(new Event('input', { bubbles: true }));
    }
    return;
  }
  if (!labelDropdown.classList.contains('show')) return;
  const n = visibleItems.length;
  /* 下拉开着时这四类键「只服务下拉」：必须 stopPropagation，
     否则 Esc 会继续冒泡到 document 上的视图切换处理器 → 顺手把计算稿切回「算」（2026-09-19 线上冒烟抓到）。 */

  else if (e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); if (n) { labelActive = Math.max(labelActive - 1, 0); updateActive(); } }

}

  /* 计算稿整行复制 → 粘到简洁计算器：只把「计算式」那一列（TSV 第 4 列）提出来，变成多行过程。
     （2026-10-08 用户：复制多行计算稿过来就多行过程）普通多行文本不含制表符 → 原样粘（多行过程本就支持）。 */
  input.addEventListener('paste', function (e) {
    if (curView !== 'calc') return;
    const cb = e.clipboardData;
    if (!cb) return;
    const text = cb.getData('text/plain') || '';
    if (!text.includes('\t')) return;            // 普通多行：原样（不拦）
    const rows = text.replace(/\r/g, '').split('\n').map(function (r) { return r.split('\t'); });
    const exprs = rows
      .filter(function (r) { return r.length > 3 && (r[3] || '').trim() !== ''; })
      .map(function (r) { return r[3].trim(); });
    if (!exprs.length) return;                   // 没识别到计算式列：原样
    e.preventDefault();
    const s = input.selectionStart, en = input.selectionEnd;
    const before = input.value.slice(0, s);
    const after = input.value.slice(en);
    const insert = exprs.join('\n');
    input.value = before + insert + after;
    const pos = before.length + insert.length;
    input.setSelectionRange(pos, pos);

  input.addEventListener('scroll', function () {

  });
  /* 点行尾那个浅色结果 → 复制这个数
     （mousedown + preventDefault：不让点按抢走输入框焦点，用户能接着往下敲） */
  panel._echo.addEventListener('mousedown', function (e) {

  /* 排除 .fx-btn（弹函数下拉）与 .act-btn（型钢/公式，有自己的 mousedown 绑定），
     它们不走通用插入。曾经还有 .keys-btn「?」按钮也在此排除——2026-10-08 按用户要求删除。 */
  wrap.querySelectorAll('.sym-btn:not(.fx-btn):not(.act-btn)').forEach(btn =>
    btn.addEventListener('click', () => { setActive(panel); insertAtCursor(btn.dataset.ins); }));
  // f(x) 按钮特殊：弹函数下拉而非插入（class 选择避免多列 ID 冲突）
  // 用 mousedown + preventDefault：阻止按钮抢焦点，保住输入框框选蓝条不消失
  wrap.querySelector('.fx-btn').addEventListener('mousedown', (e) => {
    e.preventDefault();
    e.stopPropagation();

  });
  // 型钢 / 公式：动作按钮（用 mousedown+preventDefault 保住输入框蓝条）
  const actBind = (sel, fn) => {
    const el = wrap.querySelector(sel);
    if (el) el.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); setActive(panel); fn(); });
  };

  closeBtn.addEventListener('click', e => { e.stopPropagation(); removePanel(panel); });
  syncPanelCloseTitle();   // 只有一列时提示「清空这一列的内容」
  setActive(panel);

  return panel;

function addPanel() {
  if (panels.length < MAX_PANELS) { createPanel(); syncPanelCloseTitle(); panelsSave(); }
}
/* 只剩一列时 ✕ 的语义从「关列」变成「清空这一列」——
   最后一列关掉就没地方算了，所以清空内容比无效更符合预期。 */
function clearPanel(panel) {
  if (!panel || !panel.input) return;
  setActive(panel);
  panel.input.value = '';
  onInput();                                   // 答案行、行尾结果随之清空，标签下拉收起
  try { hideFxDropdown(); } catch (e) {}

}
/* 让每列的 ✕ 提示文案跟着列数走：多列=关闭此列，只剩一列=清空这一列 */
function syncPanelCloseTitle() {
  const last = panels.length <= 1;
  panels.forEach(function (p) {
    const b = p.wrap && p.wrap.querySelector('.panel-close');
    if (b) b.title = last ? '清空这一列的内容' : '关闭此列';
  });
}
function removePanel(panel) {
  const i = panels.indexOf(panel);
  if (i < 0) return;
  if (panels.length <= 1) { clearPanel(panel); return; }   // 只有一列 → 清空而非关闭
  panel.wrap.remove();
  panels.splice(i, 1);
  if (activePanel === panel) setActive(panels[Math.max(0, i - 1)] || panels[0]);
  syncPanelCloseTitle();
  panelsSave();
}
function recomputeAll() {
  const keep = activePanel;
  panels.forEach(p => { setActive(p); onInput(); });
  setActive(keep);
  onInput();
}

/* ── 算式框持久化 ─────────────────────────────────────────────────────────
   panelsSave  ：存「列数 + 每列算式」。防抖 400ms（打字时不至于每键写一次盘）。
   panelsRestore：按存的列数建列、把算式填回去，然后**安静地**重算一遍
                 （bootQuiet=true：只出结果、不往计算稿写，避免顶掉用户手改的行）。
   见文件顶部 PANELS_LS 那段注释里写的那个"重开顶掉旧行"实测。 */
function panelsSave() {
  clearTimeout(panelsSaveTimer);
  panelsSaveTimer = setTimeout(function () {
    try {
      safeLS.set(PANELS_LS, JSON.stringify({
        n: panels.length,
        exprs: panels.map(function (p) { return p.input ? p.input.value : ''; }),
        modes: panels.map(function (p) { return p._answerMode ? p._answerMode.value : 'total'; }),
        /* ★ 2026-10-08：列 uid 也要存 —— 行归属线索 srcKey =「uid:行号」靠它。
           不存的话删过左侧列再重开，uid 会从头重排 → 归属错位、把已有行顶掉（红队实测）。 */
        uids: panels.map(function (p) { return (typeof p.uid === 'number') ? p.uid : 0; })
      }));
    } catch (e) {}
  }, 400);
}
function panelsRestore() {
  let d = null;
  try { d = JSON.parse(safeLS.get(PANELS_LS) || ''); } catch (e) { d = null; }
  const n = (d && d.n >= 1 && d.n <= MAX_PANELS) ? Math.floor(d.n) : 1;
  const exprs = (d && Object.prototype.toString.call(d.exprs) === '[object Array]') ? d.exprs : [];
  const modes = (d && Object.prototype.toString.call(d.modes) === '[object Array]') ? d.modes : [];
  /* 启动时已经建好第一列 → 这里只补差额，不重复建 */
  for (let i = panels.length; i < n; i++) { if (!createPanel()) break; }
  exprs.forEach(function (t, i) {
    if (panels[i] && panels[i].input && typeof t === 'string' && t) panels[i].input.value = t;
  });
  modes.forEach(function (mode, i) {
    if (panels[i] && panels[i]._answerMode && (mode === 'total' || mode === 'latest')) {
      panels[i]._answerMode.value = mode;
    }
  });
  /* ★ 2026-10-08：把列 uid 与精度恢复回去。
     uid 不恢复的话（它只在内存里递增），删过左侧列再打开，同样两列会拿到不一样的 uid
     → srcKey「uid:行号」错位 → 恢复算式时把表里已有行顶掉（红队实测：3 行变 2 行、数被改）。 */
  const uids = (d && Object.prototype.toString.call(d.uids) === '[object Array]') ? d.uids : [];
  uids.forEach(function (u, i) {
    if (panels[i] && typeof u === 'number' && u >= 0) {
      panels[i].uid = u;
      if (u > panelSeq) panelSeq = u;
    }
  });
  panels.forEach(function (p) { if (p._precSel) p._precSel.value = curPrec; });
  bootQuiet = true;
  try {
    recomputeAll();                       // 答案行 / 行尾结果按恢复的算式重算（不回写计算稿）
  } catch (e) {
    // 恢复期任何意外都不该拦住页面：清干净就算了，下次打开还能再来
    try { console.warn('算式框恢复失败：', e && e.message); } catch (e2) {}
  } finally {
    bootQuiet = false;
  }
  /* 光标放回第一列末尾，打开就能接着打 */
  const first = panels[0];
  if (first && first.input) {
    try { first.input.focus(); first.input.setSelectionRange(first.input.value.length, first.input.value.length); } catch (e) {}
  }
}

/* 钢筋悬停二级下拉（内嵌在标签下拉中） */
function renderRebarSubmenu(parentEl) {
  const items = rebarItems.map(r =>
    `<div class="rebar-opt" data-n="${escAttr(r.n)}" data-w="${escAttr(r.w)}">
       <span class="dia">${escHtml(r.n)}</span>
       <span class="wt">${escHtml(r.w)} kg/m</span>
     </div>`).join('');
  const sub = document.createElement('div');
  sub.className = 'label-submenu';
  sub.innerHTML = items;
  parentEl.appendChild(sub);
  // 动态定位：fixed 脱离父容器 overflow 裁切
  const positionSub = () => {
    const r = parentEl.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight, PAD = 8;
    /* 首次定位时子菜单还是 display:none（要靠 hover 才展开），量不到尺寸 → 临时占位量一次 */
    const needProbe = (sub.offsetWidth === 0 && sub.offsetHeight === 0);
    if (needProbe) { sub.style.visibility = 'hidden'; sub.style.display = 'block'; }
    const w = sub.offsetWidth, h = sub.offsetHeight;
    if (needProbe) { sub.style.display = ''; sub.style.visibility = ''; }
    // 左侧留 6px 透明 hover 桥，鼠标从父项移过来时即使偏一点也能命中子菜单
    let left = r.right - 6;
    // 水平：默认在右侧；右侧放不下则翻到左侧
    if (left + w > vw - PAD) left = r.left - w + 6;
    left = Math.max(PAD, Math.min(left, vw - PAD - Math.min(w, vw - 2 * PAD)));
    // 垂直：与父项顶对齐；底部放不下则整体上移钳制，再不够就压高度内滚（防“下面缺失/看不到”）
    const top = Math.max(PAD, Math.min(r.top, vh - PAD - Math.min(h, vh - 2 * PAD)));
    const avail = vh - PAD - top;
    sub.style.maxHeight = (h > avail) ? Math.max(60, Math.floor(avail)) + 'px' : '';
    sub.style.left = left + 'px';
    sub.style.top = top + 'px';
  };
  let hideTimer = null;
  const clearHide = () => { if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; } };
  const maybeHide = () => {
    clearHide();
    hideTimer = setTimeout(() => {
      if (!sub.matches(':hover') && !parentEl.matches(':hover')) {
        sub.classList.remove('show');
      }
    }, 150);
  };
  parentEl.addEventListener('mouseenter', () => {
    clearHide();
    sub.classList.add('show');
    positionSub();
  });
  parentEl.addEventListener('mouseleave', e => {
    if (!sub.contains(e.relatedTarget)) maybeHide();
  });
  sub.addEventListener('mouseenter', clearHide);
  sub.addEventListener('mouseleave', e => {
    if (!parentEl.contains(e.relatedTarget)) maybeHide();
  });
  positionSub();
  sub.querySelectorAll('.rebar-opt').forEach(el =>
    el.addEventListener('mousedown', e => {
      e.preventDefault();
      e.stopPropagation();
      insertLabelItem({ kind:'rebar', name:el.dataset.n, w:el.dataset.w, spec:el.dataset.n+'钢筋kg/m' });
      hideLabelDropdown();
    }));
}

/* GB/T 706-2016 角钢截面面积（mm²）：A = d(边长和 − d) + 0.215(r² − 2r₁²)，r₁ 取 r/2 */
function angleAreaEq(b, d) { const r = angleR(b), r1 = r / 2; return d * (2 * b - d) + 0.215 * (r * r - 2 * r1 * r1); }
function angleAreaUe(B, b, d) { const r = angleR(B), r1 = r / 2; return d * (B + b - d) + 0.215 * (r * r - 2 * r1 * r1); }

/* 型号下拉自然排序：先按数字，同数值时带字母的排前面（GB/T 706 槽钢 16a 在 16 前） */
function naturalModelSort(a, b) {
  const parse = s => { const m = String(s).match(/^(\d+(?:\.\d+)?)([a-zA-Z]*)$/); return m ? [parseFloat(m[1]), m[2]] : [0, String(s)]; };
  const [na, sa] = parse(a), [nb, sb] = parse(b);
  if (na !== nb) return na - nb;
  if (sa && !sb) return -1;
  if (!sa && sb) return 1;
  return sa.localeCompare(sb);
}

/* H型钢型号排序：先按系列 HW/HM/HN，再按高度数字 */
function byHBeam(a, b) {
  const parse = s => { const m = String(s).match(/^([A-Z]+)(\d+)/); return m ? [m[1], parseInt(m[2], 10)] : ['', 0]; };
  const [ca, ha] = parse(a), [cb, hb] = parse(b);
  if (ca !== cb) return ca < cb ? -1 : 1;
  return ha - hb;
}

/* 桌面版：卡片在小窗口里装不下 → 请外壳把窗口临时撑大，关闭时还原。
   外壳目前开放的能力：
     · ensure_height(h)      只加高（型钢卡片在用）
     · ensure_size(w, h)     同时改宽高（记录页要横向空间，壳里已备好；未重打包前会跳过）
   在线版没有 pywebview，静默跳过（卡片靠 max-height:100vh 自适应）。 */
const STEEL_WIN_H = 700;
/* 计算稿态**不再改窗口尺寸**（2026-09-18 用户反馈：切视图窗口一下变大、来回还跳位置）。
   窗口完全交给用户自己拖，表格里自己滚动。壳里的 fit_size / ensure_size 保留给
   「型钢」「日期」这两个弹出卡片用。 */
function winFit(w, h) {
  try {
    const api = (window.pywebview && window.pywebview.api) || null;
    if (!api) return;
    /* fit_size = 精确设成这个尺寸（可大可小，切视图专用）；老壳没有就退回 ensure_size（只放大） */
    if (api.fit_size) { api.fit_size(w, h); return; }
    if (api.ensure_size) { api.ensure_size(w, h); return; }
    if (api.ensure_height) api.ensure_height(h);              // 更老的壳：只能加高
  } catch (e) {}
}
/* ★ 只加高、**不动宽**（2026-09-21 修「点击型钢会左右屏幕跳」）
   原来型钢走 winFit(820, 700)、日期走 winFit(1140, 520) —— 两个都调 fit_size，
   而 fit_size 是**精确设置**：窗口宽度会被强行改成 820 / 1140。
   壳那边为了让改宽后的窗口留在屏幕内，还会重算 left（`left = min(rc.l, 屏宽-8-新宽)`），
   于是窗口就"左右跳"。而且宽度本来就与这两个卡片无关（型钢卡片 580 宽、日期卡片 380 宽）。
   现在统一走壳里的 ensure_height(h)：**只加高、不动宽度、也不要缩**，加完高度不够就内部滚。
   老壳若没有 ensure_height 就不动窗口（卡片自己有 max-height:100vh + 内部滚动，不会坏）。 */
function winGrowHeight(h, remember) {
  try {
    const api = (window.pywebview && window.pywebview.api) || null;
    if (api && typeof api.ensure_height === 'function') api.ensure_height(h, !!remember);
  } catch (e) {}
}
function winRestore() {
  try {
    const api = (window.pywebview && window.pywebview.api) || null;
    if (api && api.restore_height) api.restore_height();
  } catch (e) {}
}
/* ★ 2026-09-29 E27（用户：点柱墩卡后窗口顶部多一截白）：卡片开合与视图切换的窗口高度
   在壳里分了两本账（卡片档/视图档）。关卡片一律走这里：先还原到「进卡片前」的高度，
   再按当前视图摆正（计算稿态加高到 SHEET_WIN_H）。四个卡片关闭函数统一调它。 */
function winRestoreCard() {
  try {
    const api = (window.pywebview && window.pywebview.api) || null;
    if (api && typeof api.restore_height === 'function') api.restore_height();
  } catch (e) {}
  if (curView === 'sheet') winGrowHeight(SHEET_WIN_H, true);
}

function viewWinSync() {
  try {
    if (!(window.pywebview && window.pywebview.api)) return;   // 网页版没有窗口可管
    /* remember=true：壳会记住「用户在计算稿态拖出来的高度」，下次切回计算稿用它
       （2026-09-21 修：调完计算稿大小、切到简洁再切回来尺寸又变）。 */
    if (curView === 'sheet') winGrowHeight(SHEET_WIN_H, true);
    else winRestore();
  } catch (e) {}
}

function openSteelCalc() {
  if (labelCtx) {
    const sp0 = exprSpot();
    if (sp0) {
      const text = spotText(sp0), pos = spotSel(sp0)[0];
      spotWrite(sp0, text.substring(0, labelCtx.start) + text.substring(pos), labelCtx.start);
    }
    labelCtx = null;
  }
  hideLabelDropdown();
  steelOverlay.classList.add('show');
  steelWinFit();
  renderSteelFields();
}
function closeSteelCalc() { steelOverlay.classList.remove('show'); winRestoreCard(); viewWinSync(); }
/* 普通尺寸行：可手输数字，focus 时展开白色常用规格下拉，方便鼠标点选 */
function renderNumberRow(f) {
  const opts = (f.opts || []).map(v => `<div class="steel-suggest-item" data-val="${v}">${v}</div>`).join('');
  const def = (f.def != null && f.def !== '') ? ` value="${f.def}"` : '';
  return `<div class="steel-row"><label>${f.t}</label>
    <div class="steel-input-wrap">
      <input type="number" step="any" id="sf_${f.k}" placeholder="mm" autocomplete="off"${def}>
      ${opts ? `<div class="steel-suggest" id="sg_${f.k}">${opts}</div>` : ''}
    </div></div>`;
}

function renderSteelFields() {
  const type = steelType.value;
  const conf = steelFields[type];
  if (Array.isArray(conf)) {
    steelInputs.innerHTML = conf.map(renderNumberRow).join('');
  } else if (conf && conf.mode === 'profile') {
    const modelOpts = Object.keys(conf.table).sort(naturalModelSort).map(k => `<option value="${k}">${k}</option>`).join('');
    const sizeRows = conf.sizes.map(renderNumberRow).join('');
    steelInputs.innerHTML =
      `<div class="steel-row"><label>${conf.name}型号</label>
         <select id="sf_model" data-for="model"><option value="">选常用型号</option>${modelOpts}<option value="custom">自定义尺寸</option></select></div>
       <div id="sf_sizeWrap" style="display:none;flex-direction:column;gap:6px;">${sizeRows}</div>`;
  }
  steelInputs.querySelectorAll('input').forEach(inp => inp.addEventListener('input', computeSteel));
  const modelSel = $('sf_model');
  if (modelSel) {
    modelSel.addEventListener('change', () => {
      const wrap = $('sf_sizeWrap');
      const model = modelSel.value;
      if (model === 'custom') {
        wrap.style.display = 'flex';
        wrap.querySelectorAll('input').forEach(inp => { if (!inp._bound) { inp.addEventListener('input', computeSteel); inp._bound = true; } });
      } else if (conf.formula && conf.table[model]) {
        const d = conf.table[model];
        ['h','b','tw','t2','R'].forEach(k => { const inp = $('sf_'+k); if (inp && d[k]!=null) inp.value = d[k]; });
        wrap.style.display = 'flex';
        wrap.querySelectorAll('input').forEach(inp => { if (!inp._bound) { inp.addEventListener('input', computeSteel); inp._bound = true; } });
      } else {
        wrap.style.display = 'none';
      }
      computeSteel();
    });
  }
  computeSteel();
  renderSteelDiagram(type);
}

function computeSteel() {
  const type = steelType.value;
  let w = 0, unit = 'kg/m', spec = '', source = '';
  const val = k => parseFloat(($('sf_' + k) && $('sf_' + k).value) || '') || 0;
  const conf = steelFields[type];

  if (conf && conf.mode === 'profile') {
    const model = $('sf_model') ? $('sf_model').value : '';
    if (conf.formula) {
      // H型钢：始终按截面面积精确公式（选规格时已自动回填尺寸，自定义可手改微调）
      const h=val('h'),b=val('b'),tw=val('tw'),t2=val('t2'),R=val('R');
      const r = R/2;
      let area = 2*b*t2 + (h-2*t2)*tw;
      if (R>0) area += 0.8584*(R*R - r*r);
      w = area*0.00785; spec=`H型钢 ${h}×${b}×${tw}×${t2}`;
      source = '（按 GB/T 11263-2017 截面面积精确公式）';
    } else if (model && model !== 'custom' && conf.table[model] != null) {
      w = conf.table[model]; spec = `${conf.name} ${model}#`; source = '（按 GB/T 706-2016 理论重量表）';
    } else if (model === 'custom') {
      source = '（按 GB/T 706-2016 截面面积精确公式）';
      if (type === '工字钢') {
        const h=val('h'),b=val('b'),tw=val('tw'),t2=val('t2'),R=val('R');
        const r = R/2;
        let area = 2*b*t2 + (h-2*t2)*tw;
        if (R>0) area += 0.8584*(R*R - r*r);
        w = area*0.00785; spec=`工字钢 ${h}×${b}×${tw}×${t2}`;
      }
      else if (type === '槽钢') {
        const h=val('h'),b=val('b'),tw=val('tw'),t=val('t'),R=val('R');
        const r = R/2;
        let area = 2*b*t + (h-2*t)*tw;
        if (R>0) area += 0.349*(R*R - r*r);
        w = area*0.00785; spec=`槽钢 ${h}×${b}×${tw}×${t}`;
      }
    }
  } else {
    source = '（按 GB/T 706-2016 钢材密度 7.85 计算）';
    if (type === '等边角钢') {
      const b=val('b'),d=val('d');
      const key = b+'x'+d;
      if (eqAngle[key] != null) { w = eqAngle[key]; source='（按 GB/T 706-2016 理论重量表）'; }
      else { w = angleAreaEq(b,d)*0.00785; source='（按 GB/T 706-2016 截面面积精确公式）'; }
      spec=`等边角钢 L${b}×${d}`;
    }
    else if (type === '不等边角钢') {
      const B=val('B'),b=val('b'),d=val('d');
      const key = B+'x'+b+'x'+d;
      if (ueAngle[key] != null) { w = ueAngle[key]; source='（按 GB/T 706-2016 理论重量表）'; }
      else { w = angleAreaUe(B,b,d)*0.00785; source='（按 GB/T 706-2016 截面面积精确公式）'; }
      spec=`不等边角钢 L${B}×${b}×${d}`;
    }
    else if (type === '扁钢') { const d=val('d'),b=val('b'); w=0.00785*d*b; spec=`扁钢 ${b}×${d}`; }
    else if (type === '圆钢') { const d=val('d'); w=0.00617*d*d; spec=`圆钢 Φ${d}`; }
    else if (type === '方钢') { const a=val('a'); w=0.00785*a*a; spec=`方钢 ${a}×${a}`; }
    else if (type === '钢管') { const D=val('D'),d=val('d'); w=0.02466*d*(D-d); spec=`钢管 Φ${D}×${d}`; }
    else if (type === '钢板') { const d=val('d'); w=7.85*d; unit='kg/㎡'; spec=`钢板 ${d}mm`; }
    else if (type === '矩形管') { const a=val('a'),b=val('b'),d=val('d'); w=2*d*(a+b-2*d)*0.00785; spec=`矩形管 ${a}×${b}×${d}`; }
    else if (type === 'C型钢') { const h=val('h'),b=val('b'),c=val('c'),t=val('t'); const L=(h+2*b+2*c); w=L*t*0.00785; spec=`C型钢 ${h}×${b}×${c}×${t}`; source='（按通用五金手册 C型钢展开料计算）'; }
    else if (type === 'Z型钢') { const h=val('h'),b=val('b'),c=val('c'),t=val('t'); const L=(h+2*b+2*c-2*t); w=L*t*0.00785; spec=`Z型钢 ${h}×${b}×${c}×${t}`; source='（按 GB 50018 冷弯薄壁型钢展开料计算）'; }
  }
  w = Number(w.toFixed(3));
  steelResult.innerHTML = `${w} <span class="unit">${unit}</span>`;
  steelResult.dataset.w = w; steelResult.dataset.spec = spec; steelResult.dataset.unit = unit;
  // 截面面积：重量 ÷ 0.00785 得 mm²，再 ÷100 转 cm²（密度 7.85 g/cm³，所有型钢通用）
  const areaCm2 = w > 0 ? w / 0.785 : 0;
  steelResult.dataset.area = areaCm2.toFixed(2);
  const areaEl = $('steelArea');
  if (areaEl) areaEl.innerHTML = `<span class="lbl">截面面积</span><span class="val">${areaCm2 > 0 ? areaCm2.toFixed(1) : '—'}</span> <span class="unit">cm²</span>`;
  const src = $('steelSource'); if (src) src.textContent = source;
}

/* 插入分两种（2026-09-27 用户要求）：重量（kg/m，可直接乘长度）或截面面积（cm²）。 */
function insertSteel(mode) {
  const w = steelResult.dataset.w, spec = steelResult.dataset.spec, unit = steelResult.dataset.unit;
  const area = steelResult.dataset.area;
  if (!w) return;
  const sp = exprSpot();
  if (!sp) { closeSteelCalc(); spotFlashEmpty(); return; }
  const text = spotText(sp), pos = spotSel(sp)[0];
  const before = text.substring(0, pos), after = text.substring(pos);
  let insert, caret;
  if (mode === 'area') {
    const v = Number(area) || 0;
    insert = v + '【' + spec + ' 截面面积 cm²】';
    caret = before.length + String(v).length;
  } else if (unit === 'kg/㎡') { insert = w + '【' + spec + ' kg/㎡】'; caret = before.length + String(w).length; }
  else { insert = '()*' + w + '【' + spec + ' kg/m】'; caret = before.length + 1; }
  closeSteelCalc();
  spotWrite(sp, before + insert + after, caret);
}

/* 普通尺寸输入框：focus 时展开白色常用规格下拉（fixed 定位，不被弹窗裁切），鼠标点选填入 */
function positionSuggest(inp, sg) {
  const wrap = inp.parentElement;
  const r = wrap.getBoundingClientRect();
  /* 先显示再量：原来「先算坐标、后 display:block」，量到的是 0，
     型钢卡片里的规格建议贴到卡片底边就会被切（2026-09-20 统一走 placeFloat）。 */
  sg.style.display = 'block';
  sg.style.width = r.width + 'px';
  placeFloat(sg, r, { gap: 0 });
}
steelInputs.addEventListener('focusin', e => {
  const inp = e.target.closest('input[id^="sf_"]');
  if (!inp) return;
  const sg = $('sg_' + inp.id.replace('sf_', ''));
  if (!sg) return;
  positionSuggest(inp, sg);
});
steelInputs.addEventListener('focusout', e => {
  const inp = e.target.closest('input[id^="sf_"]');
  if (!inp) return;
  const sg = $('sg_' + inp.id.replace('sf_', ''));
  if (!sg) return;
  setTimeout(() => { if (!sg.matches(':hover')) sg.style.display = 'none'; }, 120);
});
steelInputs.addEventListener('mousedown', e => {
  const item = e.target.closest('.steel-suggest-item');
  if (!item) return;
  const sg = item.parentElement;
  const inp = $('sf_' + sg.id.replace('sg_', ''));
  if (inp) { inp.value = item.dataset.val; computeSteel(); }
  sg.style.display = 'none';
});

$('steelInsert').addEventListener('click', function () { insertSteel('weight'); });
$('steelInsertArea').addEventListener('click', function () { insertSteel('area'); });
steelOverlay.addEventListener('click', e => { if (e.target === steelOverlay) closeSteelCalc(); });

/* 键盘顺手：Esc 关弹窗；焦点在型钢输入框/下拉时回车直接插入结果 */
document.addEventListener('keydown', e => {
  if (!steelOverlay.classList.contains('show')) return;
  if (e.key === 'Escape') { closeSteelCalc(); }
  else if (e.key === 'Enter') {
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'SELECT') { e.preventDefault(); insertSteel(); }
    else if (tag === 'INPUT') {
      e.preventDefault();
      // 尺寸框回车 → 跳到下一个输入框（连续输入更顺手）；最后一格回车 → 插入结果
      const card = steelOverlay.querySelector('.steel-card');
      const inputs = card ? Array.from(card.querySelectorAll('input')) : [];
      const idx = inputs.indexOf(e.target);
      if (idx > -1 && idx < inputs.length - 1) {
        const next = inputs[idx + 1];
        next.focus(); if (next.select) next.select();
      } else {
        insertSteel();
      }
    }
  }
});
