<script>
/* 白屏自诊：任何 JS 错误（含语法解析错误）直接画到页面上，对方截图即可回传定位 */
window.onerror = function(m, s, l, c) {
  try {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#c0392b;color:#fff;font:12px/1.6 Consolas,monospace;padding:8px 10px;white-space:pre-wrap;';
    d.textContent = '⚠ JS错误: ' + m + ' @行' + l + ':列' + c;
    (document.body || document.documentElement).appendChild(d);
    document.title = '[ERR] ' + document.title;
  } catch (e) {}
};
/* 环境兜底：部分老内核/被注入的运行环境（微信内置浏览器、劫持插件）报 Proxy 未定义。
   本页代码实际不使用 Proxy，此占位只为消灭环境级 ReferenceError 噪音，防止误导排障。 */
if (typeof window.Proxy === 'undefined') {
  window.Proxy = function(target) { return target; };
}
/* 启动前环境兼容性预检：把"运行不了"从白屏变成可截图的明确提示 */
var __fhCompat = (function() {
  var errors = [];
  function need(name, ok) { if (!ok) errors.push(name); }
  try {
    need('Proxy', typeof Proxy !== 'undefined');
    need('Promise', typeof Promise !== 'undefined');
    need('fetch', typeof fetch !== 'undefined');
    /* ★ 2026-10-08：光「存在」不够，要真试写一次 —— 下载版 file:// 与隐私模式下
       localStorage 对象在、但不能写，只判存在性会一路放行，用户编辑半天关掉全没了。 */
    need('localStorage（可写）', (function () {
      try { window.localStorage.setItem('__fh_probe__', '1'); window.localStorage.removeItem('__fh_probe__'); return true; }
      catch (e) { return false; }
    })());
    need('JSON', typeof JSON !== 'undefined');
    need('箭头函数', (function() { try { eval('(function(){})'); return true; } catch(e) { return false; } })()); // 当前 JS 已能解析
    need('模板字符串', (function() { try { eval('`x`'); return true; } catch(e) { return false; } })());
    need('const/let', (function() { try { eval('const x=1;let y=2;'); return true; } catch(e) { return false; } })());
    need('Object.assign', typeof Object.assign === 'function');
    need('Array.from', typeof Array.from === 'function');
  } catch (e) {}
  return {
    ok: errors.length === 0,
    errors: errors,
    report: function() {
      if (errors.length === 0) return;
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9998;background:#e67e22;color:#fff;font:12px/1.6 "Microsoft YaHei",sans-serif;padding:8px 10px;white-space:pre-wrap;';
      d.textContent = '⚠ 当前运行环境太旧，以下能力缺失：' + errors.join('、') + '。请安装 Edge/WebView2 后再试。';

if (document.readyState === 'loading') {

} else {

}
window.addEventListener('unhandledrejection', function(e) {
  window.onerror('Promise: ' + ((e.reason && e.reason.message) || e.reason), '', 0, 0);
});
/* padStart 垫片：老微信内核(<Chromium 57)无此 API，日期补零会直接崩。补一个等价实现。 */
if (!String.prototype.padStart) {
  String.prototype.padStart = function(targetLength, padString) {
    var s = String(this);
    targetLength = targetLength >> 0;
    padString = String(padString == null ? ' ' : padString);
    if (s.length >= targetLength) return s;
    var pad = '', need = targetLength - s.length;
    while (pad.length < need) pad += padString;
    return pad.slice(0, need) + s;

/* localStorage 安全封装：下载版 file:// 协议 / 隐私模式下部分浏览器禁写，
   代码里任一 localStorage 调用抛错都会整页白屏。统一走 safeLS，探测不可用即降级为内存对象。 */
var safeLS = (function() {
  var mem = {};
  var ok = true;
  try { var k = '__fh_ls_probe__'; window.localStorage.setItem(k, '1'); window.localStorage.removeItem(k); }
  catch (e) { ok = false; }
  var store = ok ? window.localStorage : {
    getItem: function(k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
    setItem: function(k, v) { mem[k] = String(v); },
    removeItem: function(k) { delete mem[k]; },
    clear: function() { mem = {}; }
  };
  return {
    /* ★ 2026-10-08：写不进去（下载版 file:// / 隐私模式）要能被上层看出来 ——
       降级成内存对象后 setItem 不抛错，光看 set() 的返回值永远是 true，
       于是「内容其实关掉就没」这件事一直没能提醒出来（红队实测）。 */
    writable: ok,
    get: function(k) { try { return store.getItem(k); } catch (e) { return null; } },
    /* set 返回是否写成功 —— 存满了 / 隐私模式不让写时，上层要能给用户一句实话（见 sheetSave） */
    set: function(k, v) { try { store.setItem(k, v); return true; } catch (e) { return false; } },
    del: function(k) { try { store.removeItem(k); } catch (e) {} }
  };
})();
try {
  /* 深浅都显式写在 html 上：图标那两条 CSS 靠 [data-theme=...] 取值，
     浅色时不写属性，图标就一个都不显示（2026-09-27 修）。 */
  document.documentElement.setAttribute('data-theme',
    window.localStorage.getItem('calc_theme_v1') === 'dark' ? 'dark' : 'light');
} catch (e) {}

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  color-scheme: light;
  /* ══ 品牌三色（方衡规范）：墨黑 #0A0A0A / 银 #E8E8E8 / 青蓝 #A8D8F0 ══
     2026-09-21 视觉会话（V1）：原来强调色是一个跟品牌无关的自定义蓝。
     现在统一走品牌色 —— 文字用墨黑、边线用品牌银、点缀用品牌青蓝，
     强调色（能当文字用的那档蓝）取青蓝的墨色版 #1B5A7A，与「方衡助手」界面规范同源。 */
  --ink: #0A0A0A;          /* 品牌墨黑：主文字 */
  --silver: #E8E8E8;       /* 品牌银：边线 / 分隔 */
  --sky: #A8D8F0;          /* 品牌青蓝：点缀（滑块、选中底、标签底） */
  --sky-deep: #4AA3CC;     /* 青蓝深一档：hover / 已复制反馈 */
  --bg: #ffffff; --surface: #fafafa; --border: var(--silver);
  --text: var(--ink); --text2: #8a8a8a; --text-muted: #b9b9b9; --placeholder: #bdbdbd;
  --text-quiet: #b0b0b0; --focus-soft: rgba(0,0,0,0.03); --hover-soft: rgba(0,0,0,.05);
  --chrome-hover: rgba(0,0,0,.06);
  --focus-border: #d2d2d2; --scrollbar-thumb: #c9c9c9; --scrollbar-hover: #a9a9a9;
  --danger: #d9534f; --danger-border: #eec7c5;
  --line-dash: #d8d8d8; --result-muted: #84909a; --sym-color: #4d4d4d; --accent: #1B5A7A; --fx-accent: #345160;
  --accent-soft: #EDF6FC; --accent-line: #BEE0F2;
  --btn-hover: #f2f2f2; --btn-active: #ececec; --row-hover: #fcfcfc; --memo-bg: #fffdf6;
  --close-bg: rgba(255,255,255,.85); --danger-soft: #fdf6f5;
  --radius: 4px;
  /* ══ 字号四级（V2 收敛）══
     原来散着 11 / 11.5 / 12 / 12.5 / 13 / 15px 六个值，另有一个 28px 异常值。
     收敛成四级：极小 11.5 / 小 12 / 正文 13 / 大 15；算式与表格字号走 --calc-fs / --sheet-fs。 */
  --fs-1: 11.5px; --fs-2: 12px; --fs-3: 13px; --fs-4: 15px;
  --fs-tiny: 11px;         /* 角标专用（N 行合计 / 单位后缀），只此一处 */
  --dur: .12s;
  --shadow-pop: 0 8px 28px rgba(0,0,0,0.14);
  /* 最外圈那道浅线框（2026-09-20 用户要求）：桌面版是无边框窗口、网页版是满屏白，
     没有这条线时窗口边界和背景糊在一起，贴图纸 / 多窗口并排时分不清哪块是计算器。
     想更淡就调成 #eaeef0，想更明显就调成 #d5dade。 */
  --edge-line: #e3e7ea;
  /* 字体：优先新面孔（Cascadia = Win11 自带、Segoe UI Variable = Win11 系统 UI 字体），老系统自动回退 */
  --font: "Inter Variable", "Segoe UI Variable Text", "Segoe UI", Arial, "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", "JetBrains Mono", "SF Mono", Consolas, "Microsoft YaHei", monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ink: #e6e9ed; --silver: #39414a; --sky: #83c8e8; --sky-deep: #a8ddf3;
  --bg: #181b1f; --surface: #22272d; --border: #39414a;
  --text: #e6e9ed; --text2: #a3adb8; --text-muted: #7f8994; --placeholder: #737e89;
  --text-quiet: #8d98a3; --focus-soft: rgba(255,255,255,.045); --hover-soft: rgba(255,255,255,.07);
  --chrome-hover: rgba(255,255,255,.08);
  --focus-border: #56616d; --scrollbar-thumb: #56616d; --scrollbar-hover: #74808c;
  --danger: #ff918b; --danger-border: #704243;
  --line-dash: #454d56; --result-muted: #a3adb8; --sym-color: #c1c8cf; --accent: #83c8e8; --fx-accent: #83c8e8;
  --accent-soft: #263a45; --accent-line: #38596a;
  --btn-hover: #303840; --btn-active: #3d4650; --row-hover: #2a3037; --memo-bg: #20251f;
  --close-bg: rgba(34,39,45,.92); --danger-soft: #382a2b;
  --shadow-pop: 0 8px 28px rgba(0,0,0,0.46); --edge-line: #39414a;
}
html, body { overflow: hidden; width: 100%; height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg); color: var(--text);
  display: flex; justify-content: center; align-items: flex-start;
  margin: 0; padding: 0;
}
.app {
  width: 100%; height: 100vh;
  /* V5：手机上 100vh 会把键盘弹起后露出的部分算进高度 → 内容被顶出屏幕。
     有 dvh 的浏览器用动态视口单位（键盘弹出时自动收缩）。 */
  height: 100dvh;
  /* 最外圈浅线框：靠 border（全局 box-sizing:border-box，不撑出滚动条），
     不用 inset 阴影 —— 阴影画在子元素底下，会被铺满整行的标题栏盖掉。 */
  border: 1px solid var(--edge-line); border-radius: 0; overflow: hidden; background: var(--bg);
  display: flex; flex-direction: column;
  transition: width .25s ease, height .25s ease;
}
/* ══ 标题栏 / 结果行 ══════════════════════════════════════════════════════════
   ★2026-09-21 还原：本会话早先把这层「标题栏 + 结果行」并成了一层（L1），用户看过之后
   要求「改回原来的表头，符号行以上的都按原来的」→ 这里按原样恢复：
     ① 标题栏：logo ｜ 方衡造价计算器 V2.1 ｜ 窗口按钮
     ② 结果行（每列一份）：＝ 结果 + N行合计小标 ｜ 复制 / 精度 / 设置 / 加列＋
   随之还原的还有 O1（视图切换回到符号行最右端）和 L6（稿名回到计算稿卡片头）。 */
.title-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 14px; background: var(--surface); border-bottom: 1px solid var(--border);
  font-size: var(--fs-3); color: var(--text2);
  -webkit-app-region: drag;          /* 无边框模式：整个标题栏可拖拽 */
  user-select: none;
}
.title-bar .name { font-weight: 600; color: var(--text); }
.title-bar .site { font-weight: 400; color: var(--text2); font-size: var(--fs-2); margin-left: 4px; }
.title-bar .title-logo { width: 20px; height: 20px; border-radius: 3px; flex-shrink: 0; }
.title-bar .title-btns { margin-left: auto; display: flex; gap: 2px; -webkit-app-region: no-drag; }
.title-bar .title-btn {
  -webkit-app-region: no-drag;      /* 按钮不可拖拽，可点击 */
  width: 28px; height: 24px; border: none; background: transparent;
  font-size: 14px; cursor: pointer; border-radius: 4px; display: flex;
  align-items: center; justify-content: center;
}
.title-bar .title-btn:hover { background: var(--chrome-hover); }
.title-bar #appCloseBtn:hover { background: #e81123; color: #fff; }

/* Answer row（每列一份，跟着列一起建）
   ★ 右侧必须给关列 ✕ 留出位置：✕ 是绝对定位在面板右上角（right:4px 起、22×22；
     触屏 44×44），而结果行最右端就是「＋加列」—— 两个正好叠在一起。原版就叠着，
     全靠 ✕ 只有 22 高、点控件中心差几像素侥幸躲过；触屏放大后直接吞掉点击
     （点「设置」/「＋」会被 ✕ 吃掉 = 把这一列清空了）。这里用 padding-right 让位。 */
.answer-row {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 30px 12px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.answer-eq { font-size: calc(var(--calc-fs, 15px) * 1.47); font-weight: 300; color: var(--text2); }
/* 多行时在结果右边标一下这是几行的合计（单行时不显示） */
.answer-tag { font-size: var(--fs-tiny); color: var(--text2); font-family: var(--font); white-space: nowrap; }
.answer-row .answer-mode { width: 66px; height: 28px; padding: 0 4px; font-size: var(--fs-tiny); border-color: transparent; background: transparent; color: var(--text2); }
.answer-row .answer-mode:hover, .answer-row .answer-mode:focus-visible { border-color: var(--border); background: var(--surface); outline: none; }
.answer-mode[hidden] { display: none; }
.answer-value {
  /* 跟随「设置 → 字体」（2026-09-21）：原来写死 --mono，换字体时结果行不跟，
     于是同一个屏幕出现两套数字字形。 */
  flex: 1; font-family: var(--calc-font, var(--mono));
  /* 字号跟随「设置 → 字号」（2026-09-18 用户反馈：调字号时结果行没跟着变） */
  font-size: calc(var(--calc-fs, 15px) * 1.47); font-weight: 600; color: var(--text); line-height: 1.2;
  min-width: 40px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  letter-spacing: 0;
}
/* 没数可显示时的占位话（计算稿态没选中行）—— 不占着位置却一片空白，让人以为坏了 */
.answer-value.answer-ph {
  font-family: var(--font); font-size: var(--fs-2); font-weight: 400; color: var(--text-muted); letter-spacing: 0;
}
.control {
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 5px 11px; font-size: var(--fs-2); background: var(--bg); outline: none;
  cursor: pointer; color: var(--text2); white-space: nowrap;
  font-family: var(--font); transition: background .15s, color .15s, border-color .15s;
}
.control:hover { background: var(--btn-hover); color: var(--text); }
:root[data-theme="dark"] .panel-set { background-color: var(--bg); }
:root[data-theme="dark"] .panel-set:hover { background-color: var(--btn-hover); }
.btn-copy { color: var(--accent); border-color: var(--accent-line); }
.btn-copy.copied { color: var(--sky-deep); border-color: var(--accent-line); background: var(--accent-soft); }

/* 悬停加列按钮（结果行「=」旁，默认隐藏，鼠标移入 answer-row 显现）
   ★ V5：触屏上 hover 永远不发生 → @media (hover:none) 里改常显（见下方手机端那段） */
.hover-add {
  margin-left: auto; width: 24px; height: 24px; border: 1px solid var(--border);
  border-radius: 50%; background: var(--bg); cursor: pointer;
  font-size: 14px; line-height: 1; opacity: 0; transition: opacity .18s, background .15s;
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  color: var(--accent);
}
.answer-row:hover .hover-add, .hover-add:focus { opacity: 1; }
.hover-add:hover { background: var(--accent-soft); }

/* 输入区 — 多列并排，白色干净无列头文字 */
.input-area { flex: 1; display: flex; flex-direction: row; min-height: 150px; }
.panel { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; border-left: 1px solid var(--border); background: var(--bg); }
.panel:first-child { border-left: none; }
.panel-input {
  flex: 1;
  width: 100%; border: none; outline: none; padding: 12px;
  font-size: var(--calc-fs, 15px); resize: none; background: transparent;
  font-family: var(--calc-font, var(--mono)); line-height: 1.9; color: var(--text);
  z-index: 1; position: relative;
}
.panel-input::placeholder { color: var(--placeholder); }

/* 输入框右上角的附图小条：在输入框里贴了图，立刻挂在眼前 */
.input-wrap { position: relative; flex: 1; display: flex; min-height: 0; }
/* 列关闭按钮：鼠标环境悬停面板才显；
   ★ V5：触屏没有 hover → 手机上常显且放大到 44px（原来 opacity:0 = 永远点不到） */
.panel-close {
  position: absolute; top: 4px; right: 4px; width: 22px; height: 22px;
  border: none; background: var(--close-bg); border-radius: 3px;
  cursor: pointer; font-size: var(--fs-tiny); color: var(--text2); opacity: 0; z-index: 2;
  transition: opacity var(--dur), color var(--dur);
}
.panel:hover .panel-close, .panel-close:focus { opacity: 1; }
.panel-close:hover { color: var(--danger); }

/* Symbol bar */
.sym-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 6px 12px;
  border-bottom: 1px solid var(--border); background: var(--surface);
}
/* L9：符号行分两组（运算符组 ｜ 工具组），中间一条浅竖线分开 —— 原来 15 个按钮平铺、
   只有一个 6px 左边距，找按钮靠背位置。视图切换已按 O1 提到顶栏，不再占这一行。 */
.sym-sep { width: 1px; height: 16px; background: var(--border); margin: 0 7px; flex-shrink: 0; }
.sym-btn {
  padding: 4px 11px; font-size: var(--fs-3); font-weight: 400; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--bg); cursor: pointer;
  font-family: var(--font); color: var(--sym-color); transition: background .15s, color .15s;
}
.sym-btn:hover { background: var(--btn-hover); color: var(--text); }
.sym-btn:active { background: var(--btn-active); }
.sym-btn-fx { color: var(--fx-accent); padding: 4px 11px; font-weight: 700; }
/* 型钢 / 公式 动作按钮（工具组，与运算符组靠分隔线区分；转置 2026-10-08 挪右键菜单） */
.sym-btn.act-btn { padding: 4px 11px; }

/* 函数下拉（f(x) 按钮弹出） */
.fx-dropdown {
  display: none; position: fixed; z-index: 210; width: 220px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: var(--shadow-pop); padding: 4px; max-height: 360px; overflow-y: auto;
}
.fx-dropdown.show { display: block; }
.fx-opt {
  padding: 7px 12px; font-size: var(--fs-3); cursor: pointer; border-radius: 5px;
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.fx-opt:hover, .fx-opt.active { background: var(--accent-soft); color: var(--accent); }
.fx-opt .name { font-family: var(--mono); font-weight: 500; }
.fx-opt .desc { font-size: var(--fs-tiny); color: var(--text2); }
.fx-opt:hover .desc, .fx-opt.active .desc { color: var(--accent); }

/* 自定义公式项：删除按钮 + 内嵌确认卡片 */
.fx-opt.fx-mine { position: relative; }
.fx-actions { position: relative; display: flex; align-items: center; margin-left: auto; }
.fx-del-btn {
  color: #bcbcbc; cursor: pointer; font-size: var(--fs-2); line-height: 1;
  border: none; background: none; padding: 2px 6px; border-radius: 4px;
  transition: color .12s, background .12s; flex-shrink: 0;
}
.fx-del-btn:hover { color: #d33; background: rgba(221,51,51,.08); }
.fx-confirm-card {
  display: none; position: absolute; right: 0; top: 50%; transform: translateY(-50%);
  z-index: 10; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: var(--shadow-pop); padding: 7px 9px; gap: 8px; align-items: center;
  white-space: nowrap;
}
.fx-confirm-card.show { display: flex; }
.fx-confirm-text { font-size: var(--fs-tiny); color: var(--text2); }
.fx-confirm-btns { display: flex; gap: 6px; }
.fx-confirm-btns button {
  border: 1px solid var(--border); background: var(--bg); border-radius: var(--radius);
  padding: 3px 8px; font-size: var(--fs-tiny); cursor: pointer; color: var(--text2);
  font-family: var(--font);
}
.fx-confirm-btns button:hover { background: var(--btn-hover); color: var(--text); }
.fx-confirm-btns button.danger { color: #fff; background: #d9534f; border-color: #d9534f; }
.fx-confirm-btns button.danger:hover { background: #c9302c; border-color: #c9302c; color: #fff; }

/* 右键菜单 */
.context-menu {
  display: none; position: fixed; z-index: 300; min-width: 180px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: var(--shadow-pop); padding: 4px;
}
.context-menu.show { display: block; }
.calc-result-card { display:none; position:fixed; z-index:320; width:min(320px,calc(100vw - 16px)); padding:12px 14px; color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:8px; box-shadow:var(--shadow-pop); }
.calc-result-card.show { display:block; }
.calc-result-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; color:var(--text2); font-size:var(--fs-2); }
.calc-result-close { border:0; padding:0 2px; color:var(--text2); background:transparent; cursor:pointer; font-size:16px; }
.calc-result-expr { display:block; width:100%; min-height:58px; max-height:96px; resize:vertical; padding:6px 8px; overflow:auto; overflow-wrap:anywhere; color:var(--text); background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); font:var(--fs-3) / 1.5 var(--mono); }
.calc-result-expr:focus { outline:1px solid var(--accent); border-color:var(--accent); }
.calc-result-value { display:block; width:100%; margin-top:7px; padding:5px 7px; text-align:left; color:var(--text); background:transparent; border:0; border-radius:var(--radius); font:700 var(--fs-4) var(--font); cursor:pointer; overflow-wrap:anywhere; }
.calc-result-value:hover, .calc-result-value.copied { background:var(--accent-soft); color:var(--accent); }
.calc-result-value:disabled { cursor:default; color:var(--text2); background:transparent; }
.ctx-item {
  padding: 7px 14px; font-size: var(--fs-3); cursor: pointer; border-radius: 5px;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.ctx-item:hover { background: var(--accent-soft); color: var(--accent); }
.ctx-item .kbd { font-size: var(--fs-tiny); color: var(--text2); }
.ctx-item:hover .kbd { color: var(--accent); }
.ctx-sep { height: 1px; background: var(--border); margin: 4px 6px; }
.ctx-submenu { position: relative; }
.ctx-submenu .ctx-arrow { color: var(--text2); font-size: var(--fs-tiny); }
/* 函数子菜单：**fixed + JS 定位**（2026-09-21 改）。
   原来是 absolute（父项内定位），于是被主菜单的边界框关系绑住 —— 主菜单一旦为适配小窗口
   压了高度（max-height），子菜单就跟着被推出窗口外。改 fixed 后它只认视口坐标，
   就算主菜单被压成内部滚动、被裁，子菜单也照样完整摆得下。
   注意：它仍是 .ctx-submenu 的 DOM 子节点（fixed 只改包含块，不改父子关系），
   所以 `:hover` 传递仍然成立，鼠标划进子菜单不会把它收掉。 */
.ctx-submenu-panel {
  display: none; position: fixed; left: 0; top: 0; min-width: 200px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: var(--shadow-pop); padding: 4px; z-index: 310;
  max-height: min(420px, calc(100vh - 16px)); overflow-y: auto;
}
.ctx-submenu:hover .ctx-submenu-panel { display: block; }

/* Overlay card */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(20,20,20,0.38); z-index: 100;
  align-items: center; justify-content: center;
  padding: 8px;                       /* 卡片与窗口边缘留 8px，别贴着被切 */
  backdrop-filter: blur(2px);
}
.overlay.show { display: flex; }
.card {
  width: 560px; max-width: 96vw;
  height: auto;
  max-height: min(96vh, 680px);
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 18px 50px rgba(0,0,0,0.18);
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface);
  font-size: var(--fs-3); font-weight: 600;
}
.card-head button:not(.sheet-btn) {
  border: none; background: none; font-size: 16px; color: var(--text2);
  cursor: pointer; padding: 0 4px; line-height: 1;
}
.card-head button:not(.sheet-btn):hover { color: var(--text); }
.head-right {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0; margin-left: 2px;
}
.col { flex: 1; background: var(--bg); display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.col textarea {
  flex: 1; min-height: 108px; width: 100%; border: none; outline: none; padding: 10px 12px;
  font-size: var(--fs-3); resize: none; background: var(--memo-bg); line-height: 1.7;
  font-family: var(--font);
}
/* ══ 记录窗口 · 计算稿表格（2026-09-17 改版：取消左栏，整窗变一张可编辑计算稿） ══
   配色一律走浅色系，按钮与输入区右上角的「4位 / 记录」保持同一风格。 */
/* 吃满窗口（原来 95vw 在窄窗口里把标题挤成两行）；表格本身给最小宽度 + 横向滚动 */
.sheet-card { width: min(1120px, calc(100vw - 12px)); max-height: calc(100vh - 12px); }
.sheet-card .card-head { gap: 8px 10px; flex-wrap: wrap; }
.sheet-card .card-head > span:first-child { flex-shrink: 0; }
/* 稿名（#sheetTitle）：长在计算稿卡片头（L6 一度搬到顶栏，2026-09-21 按用户要求还原回来） */
.sheet-title {
  font-weight: 400; font-size: var(--fs-2); color: var(--text2);
  border: 1px solid transparent; border-radius: 6px; padding: 2px 6px; outline: none;
  flex: 1 1 150px; min-width: 90px;   /* 不限宽、不截断：标题要能看全 */
}
.sheet-title:hover { border-color: var(--border); }
.sheet-title:focus { border-color: var(--text-muted); background: var(--bg); }
.sheet-title:empty::before { content: attr(data-ph); color: var(--text-muted); }
.sheet-tools { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.sheet-btn {
  border: 1px solid var(--border); background: var(--bg); color: var(--text2);
  font-size: var(--fs-2); padding: 4px 11px; border-radius: 6px; cursor: pointer;
  font-family: var(--font); flex-shrink: 0; transition: color var(--dur), border-color var(--dur);
}
.sheet-btn:hover { color: var(--text); border-color: var(--focus-border); }
/* L8 + V4：危险操作（清空）与常用操作拉开距离、平时不抢眼，悬停才显红 —— 原来跟导出/插入行
   同字色同边框紧挨着，误点概率高（虽然弹二次确认）。 */
.sheet-tools .tools-gap { width: 1px; height: 16px; background: var(--border); margin: 0 3px; flex-shrink: 0; }
.sheet-btn.btn-danger { border-color: transparent; color: var(--text-quiet); }
.sheet-btn.btn-danger:hover { color: var(--danger); border-color: var(--danger-border); background: var(--danger-soft); }
.sheet-wrap { flex: 1; overflow: auto; min-height: 0; background: var(--bg); }
/* ★ 2026-10-07（第 9 条）加码：滚动条加粗（横向 14px）、拇指加深并给最小宽度，
   窄窗里一眼能认出「可以拖」；滚动条占布局空间，不会盖住表格内容。 */
.sheet-wrap::-webkit-scrollbar { width: 11px; height: 14px; }
.sheet-wrap::-webkit-scrollbar-thumb { background: var(--scrollbar-hover); border-radius: 7px; border: 3px solid var(--bg); min-width: 48px; }
.sheet-wrap::-webkit-scrollbar-thumb:hover { background: var(--text2); }
.sheet-wrap::-webkit-scrollbar-track { background: var(--surface); }
.sheet-wrap::-webkit-scrollbar-corner { background: var(--surface); }
/* ★ 2026-10-07（第 9 条）新增：横向溢出时右下角浮一条「可以左右看」的小提示，
   几秒后自己退场（不长期占地方、几乎不挡内容）；宽窗口没溢出就根本不出现。 */
.sheet-scroll-hint {
  position: absolute; right: 16px; bottom: 22px; z-index: 6;
  max-width: 60%; padding: 5px 12px; border-radius: 999px;
  background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent);
  font-size: var(--fs-2); pointer-events: none; opacity: 0; visibility: hidden;
  transition: opacity .25s, visibility .25s;
}
.sheet-scroll-hint.show { opacity: 1; visibility: visible; }
.sheet-table {
  border-collapse: collapse; width: 100%; table-layout: fixed;
  min-width: 720px;   /* 窗口再窄也不压扁列，靠外层横向滚动 */
  font-size: var(--sheet-fs, 12px); font-family: var(--sheet-font, var(--font));
}
.sheet-table th {
  position: relative;      /* L5：列宽拖拽热区的定位锚点（sticky 由下面的 thead th 规则给） */
  font-weight: 400; font-size: var(--fs-2); color: var(--text2);
  background: var(--surface); border: 1px solid var(--border);
  padding: 6px 8px; text-align: center; white-space: nowrap;
}
/* 左上角全选：不画框，就是空白 —— 点击/回车都能全选（2026-09-27 用户要求：原来那个勾选框太丑） */
.sheet-select-all { display: block; width: 100%; height: 100%; padding: 0; border: 0; background: transparent; cursor: pointer; outline: none; min-height: 24px; }
.sheet-select-all:hover, .sheet-select-all:focus-visible { background: var(--accent-soft); }
.sheet-select-all:focus-visible { box-shadow: inset 0 0 0 2px var(--accent-line); }
.sheet-select-all[aria-pressed="true"] { background: var(--accent-soft); }
.sheet-table .grid-cell-selected { background: var(--accent-soft) !important; }
.sheet-table th.grid-head-selected { color: var(--accent); }
/* 表头列选中：只把表头小格染淡蓝，不给整列描边（描边在全选时看着像方格） */
/* L5（2026-09-21）：列宽可拖 —— 表头右缘 6px 是热区，拖完记住（localStorage）。
   原来是 8 列写死百分比 + min-width:720px，窄窗下单位/工程量被挤出屏幕只能横滚。 */
.sheet-table th.col-resizable::after {
  content: ''; position: absolute; top: 0; right: -3px; width: 6px; height: 100%;
  cursor: col-resize; z-index: 5;
}
.sheet-table th.col-resizable:hover::after { background: var(--accent-line); }
.sheet-table td {
  border: 1px solid var(--border); padding: 5px 7px; vertical-align: top;
  line-height: 1.4; overflow: hidden;   /* 行高比原来松一点点（2026-09-21 用户要求）：上下 3→5px + 行高 1.35→1.4 */
}
/* 列宽正在拖：整页禁选 + 光标锁定，免得拖出蓝条 */
body.col-resizing { user-select: none; cursor: col-resize; }
.srow:hover td { background: var(--row-hover); }
.srow.section td { background: var(--surface); }
.srow.section .c-sec { font-weight: 400; }   /* 不加粗：靠底色和缩进区分层级 */
/* ★ 2026-10-21 卓米D：部位行可收起（用户要的「部位加分组」）—— 收起后这段明细整段隐藏，只留题头。
   三角放在行首那格（原来只放个"能点"的小箭头，部位行这格闲着）。 */
.srow.section .c-ops::after { content: none; }
.sec-fold { width: 100%; height: 20px; border: none; background: transparent; color: var(--text2);
  font-size: 10px; line-height: 1; padding: 0; cursor: pointer; }
.sec-fold:hover { color: var(--accent); }
.sec-count { margin-left: 8px; font-size: var(--fs-2); color: var(--text2); }
.srow.sel td { background: var(--accent-soft); }
/* 整行选中（点行首）：左侧一条色条 + 整行淡底 —— 不再给每个格子描一圈边 */
.srow.row-sel > td { background: var(--accent-soft); }
.srow.row-sel > td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
/* 空表引导：给几条点一下就填进去的示例（比一行灰字管用） */
.sheet-empty { text-align: center; color: var(--text-muted); font-size: var(--fs-2); line-height: 2; padding: 20px 12px !important; }
.demo-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin-top: 2px; }
.demo-cap { color: var(--text-muted); }
.demo-chip {
  border: 1px dashed var(--border); background: var(--bg); color: var(--accent);
  font-size: var(--fs-2); padding: 3px 11px; border-radius: 12px; cursor: pointer; font-family: var(--font);
  transition: background .12s, border-color .12s;
}
.demo-chip:hover { background: var(--accent-soft); border-color: var(--accent-line); }
.c-ops { width: 26px; text-align: center; padding: 3px 0 !important; border-left: none !important; cursor: pointer; min-height: 24px; height: 24px; }
.c-ops[tabindex="0"]:focus-visible, .c-seq[tabindex="0"]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
/* 行首这一格只干一件事：点一下选整行（2026-09-27 用户要求：＋/✕ 挪走）。
   平时是干净空白，鼠标到这一行才露出个小箭头提示这里能点。 */
.c-ops::after { content: '\276F'; display: block; font-size: 9px; line-height: 1.2; color: var(--text-muted); opacity: 0; transition: opacity var(--dur); }
.srow:hover .c-ops::after { opacity: 1; }
.srow.row-sel .c-ops::after { opacity: 1; color: var(--accent); }
/* 行尾 ＋/✕（2026-09-27 从行首挪过来）：贴着行尾，不占行首那一格 */
.row-ops { position: absolute; top: 2px; right: 3px; z-index: 4; display: flex; gap: 3px; opacity: 0; transition: opacity var(--dur); }
.srow:hover .row-ops, .row-ops:focus-within { opacity: 1; }
.row-ops .op { border: 1px solid var(--border); background: var(--bg); color: var(--text2); border-radius: 4px; font-size: 13px; line-height: 1; padding: 3px 6px; cursor: pointer; min-width: 20px; min-height: 20px; }
.row-ops .op:hover { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.c-note, .c-sec { position: relative; }
/* ★ V5（2026-09-21）：触屏没有 hover —— 三处 `opacity:0` 让手机上"加不了行、删不了行"。
   `@media (hover:none)` 里改常显，并把触控目标放大到 ≥44px（列宽由下面的 col 规则放开）。 */
@media (hover: none) {
  .row-ops { opacity: 1; }
  .sheet-table col.c-ops-col { width: 40px !important; }
  .row-ops .op { padding: 8px 12px; font-size: var(--fs-4); }
  /* 触屏没有 hover、title 也不弹 —— 收起三角得放大到能点准（跟 ＋/✕ 同一口径） */
  .sec-fold { height: 34px; font-size: 15px; }
  .panel-close { opacity: 1; width: 44px; height: 44px; font-size: var(--fs-4); }
  .answer-row { padding-right: 52px; }
  .hover-add { opacity: 1; width: 36px; height: 36px; }
  .title-bar .title-btn { width: 40px; height: 36px; }
}
/* 数字列跟随「设置 → 字体」（2026-09-21）：原来写死 --mono，
   导致换字体时中文变了、数字不变 → 一格里两副面孔。 */
.c-seq, .c-unit, .c-qty { text-align: center; font-family: var(--sheet-font, var(--mono)); }
.c-seq { color: var(--text2); font-size: var(--fs-1); cursor: pointer; }
.srow .c-seq:hover { color: var(--accent); }
.c-unit { color: var(--text2); }
.c-unit-in {
  width: 100%; border: none; background: transparent; text-align: center;
  font-family: inherit; font-size: inherit; color: inherit;   /* inherit：跟着计算稿字体走 */
  padding: 0; outline: none;
}
.c-unit-in:focus { background: var(--focus-soft); border-radius: 3px; }
/* 工程量列：长数字也要能折行显示全 —— 与「点击计算式会折行」保持一致。
   原来只有一行且被裁（13 位的量显示成 1456526285…），点击复制也拿不全
   （2026-09-21 用户实报）。overflow-wrap:anywhere 让它在放不下处才断行。 */
.c-qty { color: var(--text); cursor: pointer; white-space: normal; overflow-wrap: anywhere; }
.c-qty:hover { color: var(--accent); }
.c-edit { outline: none; min-height: 1.25em; white-space: pre-wrap; word-break: break-word; }
.c-edit:empty::before { content: attr(data-ph); color: var(--text-muted); }
.c-edit:focus { box-shadow: inset 0 0 0 1px var(--accent); border-radius: 3px; }
.c-expr { font-family: var(--sheet-font, var(--mono)); font-size: var(--fs-2); }
/* 超长算式：**必须用 nowrap** 才裁得住。
   试过 max-height —— 对 display:table-cell 会被浏览器忽略（设为 17.4px，td 实测 39px），
   所以改用「不换行 + 横向裁掉 + 省略号」，悬停看 title 全文、行高不受影响；
   点进去编辑时恢复换行，免得打长算式看不到自己写的。 */
.c-expr { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-expr:focus { white-space: pre-wrap; overflow: visible; text-overflow: clip; }
/* 备注列：可以打字，也可以贴图 —— 贴了图就用图盖住备注（与「图优先」的导出口径一致） */
.c-note { position: relative; text-align: left; cursor: text; }
.c-note .c-note-txt { min-height: 1.25em; }
.note-shot {
  position: absolute; inset: 0; background: var(--bg); z-index: 2;
  display: flex; align-items: center; justify-content: center;
}
.c-note.drop { box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.c-note .shot-mini { max-height: 46px; max-width: 100%; object-fit: contain; cursor: zoom-in; }
.shot-mini {
  display: block; width: 100%; height: 46px; object-fit: cover;
  border: 1px solid var(--border); border-radius: 3px; background: var(--surface);
}
.shot-del {
  position: absolute; top: 3px; right: 3px; width: 15px; height: 15px; border: none;
  border-radius: 50%; background: rgba(0,0,0,0.42); color: #fff; font-size: 10px;
  line-height: 1; cursor: pointer; padding: 0;
}
/* 计算稿的「明细统计 + 操作提示」并入底部那一条（2026-09-21 用户要求：底部两行 → 一行，省 30px）。
   原来它们是单独一行 .sheet-foot（表格卡片里）+ .bottom-bar（全宽）两行；现在都挂进 .bottom-bar。 */
.bar-stat {
  flex-shrink: 0; font-size: var(--fs-1); color: var(--text-quiet);
  font-variant-numeric: tabular-nums;
}
.bar-tip {
  flex: 1; min-width: 0; font-size: var(--fs-1); color: var(--text-quiet);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* 计算稿态：全局提示位让位给「明细/提示」（不然两个 flex:1 各分一半，提示被压短） */
.app[data-view="sheet"] .bar-msg { flex: 0 1 auto; }
/* 不在计算稿态就把这两块收掉（它们只在算量时有意义） */
.app:not([data-view="sheet"]) .bar-stat,
.app:not([data-view="sheet"]) .bar-tip { display: none; }

/* ══ 输入框行尾浅色结果（镜像层：算式透明占位、结果浅色可见） ══ */
.line-echo {
  position: absolute; inset: 0; z-index: 2; overflow: hidden;
  padding: 12px; color: transparent;
  font-family: var(--calc-font, var(--mono)); font-size: var(--calc-fs, 15px);
  line-height: 1.9; white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word;
  pointer-events: none; user-select: none;
}
.line-echo .le-dash {
  display: inline-block; width: 28px; height: 0; margin: 0 2px;
  border-top: 1px solid var(--line-dash); font-size: 0; line-height: 0;
  vertical-align: middle;
}
/* 行尾结果：点一下把这个数复制走（镜像层整体不吃事件，只放行这一小块） */
.line-echo .le-val {
  color: var(--result-muted); pointer-events: auto; cursor: pointer;
  border-radius: 3px; padding: 0 2px; font-weight: 700; font-variant-numeric: tabular-nums lining-nums;
  transition: color .12s, background .12s;
}
.line-echo .le-val:hover { color: var(--text2); background: var(--hover-soft); }
.line-echo .le-val.le-copied { color: var(--sky-deep); }
/* ★ 2026-10-07（第 1 条）：算式出错时行尾给出真实原因（红字），替代以前的「无声无息」 */
.line-echo .le-err {
  color: var(--danger, #c0392b); pointer-events: auto; cursor: help;
  border-radius: 3px; padding: 0 2px; font-family: var(--font); font-weight: 400;
  font-size: calc(var(--calc-fs, 15px) * 0.82);
}
/* ★ 2026-10-08（用户「哪里错了标红」）：算式里出错的那个字/片段直接在原位标红垫底，
   一眼看到错在哪，不用对着「第 N 个字」数格子 */
.line-echo .le-bad {
  color: var(--danger, #c0392b); background: rgba(192, 57, 43, 0.13);
  border-radius: 2px; font-weight: 700;
}

/* ══ 分层：账号 / 版本 两行（2026-09-22 试做）══ */
.set-row-sep { height: 1px; background: var(--border); margin: 9px 0; padding: 0; }
.set-acc { flex: 1; min-width: 0; font-style: normal; color: var(--text2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.set-acc.on { color: var(--accent); }
.set-mini { flex-shrink: 0; font-family: var(--font); font-size: var(--fs-1);
  padding: 3px 10px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--bg); color: var(--accent); cursor: pointer; }
.set-mini:hover { background: var(--accent-soft); border-color: var(--accent-line); }
.set-mini.solid { background: var(--accent); border-color: var(--accent); color: #fff; }
/* 撞行数 / 购买容量 弹窗 */
.lim-note { font-size: var(--fs-1); color: var(--text2); line-height: 1.7; margin: 8px 0 0; }
.pay-btns { display: flex; flex-direction: column; gap: 7px; margin: 12px 0 0; }
.pay-btn { font-family: var(--font); font-size: var(--fs-3); padding: 8px 14px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; text-align: center; }
.pay-btn.solid { background: var(--accent); border-color: var(--accent); color: #fff; }
.pay-btn[disabled] { opacity: .45; cursor: not-allowed; background: var(--surface); color: var(--text2); }
.pay-btn small { font-size: var(--fs-1); opacity: .82; margin-left: 6px; }
/* 购买时长选项（按月） */
.fh-plans { display: flex; gap: 8px; margin: 12px 0 0; }
.fh-plan { flex: 1; display: block; padding: 8px 10px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--bg); cursor: pointer;
  font-family: var(--font); font-size: var(--fs-2); }
.fh-plan:hover { border-color: var(--accent-line); }
.fh-plan.on { border-color: var(--accent); background: var(--accent-soft); }
.fh-plan span { display: block; color: var(--text); }
.fh-plan em { display: block; font-style: normal; color: var(--accent); font-weight: 600; margin-top: 3px; }
.fh-plan em small { color: #8a8a8a; font-weight: 400; margin-left: 4px; }
/* 轻量提示条（解锁成功等反馈，不打断操作） */
.fh-toast { position: fixed; left: 50%; bottom: 54px; transform: translate(-50%, 8px);
  max-width: 78vw; padding: 8px 16px; border-radius: 8px; background: #1f2937; color: #fff;
  font-family: var(--font); font-size: var(--fs-2); opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s; z-index: 9999; }
.fh-toast.show { opacity: 1; transform: translate(-50%, 0); }
/* 「有新版本」小链接（常驻底栏，不弹窗不打断） */
.fh-upd { margin-left: 12px; font-family: var(--font); font-size: var(--fs-1);
  color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent-line); }
.fh-upd:hover { border-bottom-style: solid; }
/* ══ 常驻上限提示条（到上限才出现，一直在；明写"导出不受影响"）══ */
.fh-capbar { display: flex; align-items: center; gap: 10px; margin: 0 14px 8px;
  padding: 8px 12px; border-radius: var(--radius); background: var(--accent-soft);
  border: 1px solid var(--accent-line); font-family: var(--font); font-size: var(--fs-2);
  color: var(--text); line-height: 1.6; }
.fh-capbar[hidden] { display: none; }
.fh-capbar .fh-cap-ok { color: var(--accent); font-weight: 600; }
.fh-capbar button { flex-shrink: 0; margin-left: auto; font-family: var(--font);
  font-size: var(--fs-1); padding: 4px 12px; border-radius: var(--radius);
  border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
.fh-capbar button:hover { filter: brightness(1.06); }

/* ══ 设置面板（字号 / 字体） ══ */
.set-wrap { position: relative; display: flex; }
.set-pop {
  /* fixed 而非 absolute：计算稿态下 .input-area 是 overflow:hidden（为了把算式区压成一条），
     absolute 的面板会被它裁掉，第三行「窗口透明度」就看不见了（2026-09-18 实测）。
     left/top 由 JS 按按钮位置算，见 bindViewSet。 */
  display: none; position: fixed; z-index: 330;
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: var(--shadow-pop); padding: 11px 13px; min-width: 236px;
}
.set-pop.show { display: block; }
.set-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; font-size: var(--fs-2); color: var(--text2); }
.set-row:last-child { margin-bottom: 0; }
.set-row > span { flex-shrink: 0; width: 60px; }   /* 60px 才放得下「窗口透明度」五个字，44px 会折成两行 */
.set-row-alpha { align-items: center; }
.set-row-alpha .set-alpha { flex: 1; min-width: 0; margin: 0 8px 0 0; accent-color: var(--sky); cursor: pointer; }
.set-row-alpha .set-alpha-val { flex-shrink: 0; width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
.set-row-alpha .set-alpha:disabled { opacity: .45; cursor: not-allowed; }
.set-theme-toggle {
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  width: 28px; height: 28px; margin-left: 6px; padding: 0;
  border: 1px solid var(--border); border-radius: 50%; background: var(--bg);
  color: var(--text2); cursor: pointer; transition: color var(--dur), border-color var(--dur), background var(--dur);
}
.set-theme-toggle:hover, .set-theme-toggle:focus-visible { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); outline: none; }
.theme-icon { width: 16px; height: 16px; display: none; }
/* 浅色时显示月亮（点了变黑），深色时显示太阳（点了变白）—— 看 aria-pressed，
   不再依赖 html 上的 data-theme，脚本慢一拍也不会两个都不显示。 */
.set-theme-toggle[aria-pressed="false"] .theme-moon { display: block; }
.set-theme-toggle[aria-pressed="true"] .theme-sun { display: block; }
/* 双击滑块 = 一键回「不透明」（2026-09-21 用户定的；提示写在滑块的 title 里） */
.set-row select {
  flex: 1; font-size: var(--fs-2); font-family: var(--font); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px;
  background: var(--bg); outline: none; cursor: pointer;
}
.set-row select:hover { border-color: var(--focus-border); }

/* 看图 */
.img-viewer {
  display: none; position: fixed; inset: 0; z-index: 220; padding: 24px;
  background: rgba(12,12,12,0.82); align-items: center; justify-content: center;
  flex-direction: column; gap: 14px;
}
.img-viewer.show { display: flex; }
.img-viewer-stage {
  flex: 1; width: 100%; display: flex; align-items: center; justify-content: center;
  overflow: hidden; min-height: 0;
}
.img-viewer img {
  max-width: 92vw; max-height: 70vh; border-radius: 8px;
  box-shadow: 0 18px 50px rgba(0,0,0,0.45); cursor: zoom-in;
  user-select: none; -webkit-user-drag: none;
  transition: transform .12s ease-out;
}
.img-viewer img.zoomed { cursor: zoom-out; }
.img-viewer img.dragging { transition: none; cursor: grabbing; }
.img-viewer-tip { font-size: var(--fs-1); color: rgba(255,255,255,0.62); font-family: var(--mono); margin-right: 4px; }
.img-viewer-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.img-viewer-bar button {
  border: 1px solid rgba(255,255,255,0.28); background: rgba(255,255,255,0.08);
  color: #fff; font-size: var(--fs-2); padding: 6px 14px; border-radius: 7px; cursor: pointer;
  font-family: var(--font);
}
.img-viewer-bar button:hover { background: rgba(255,255,255,0.18); }

::-webkit-scrollbar { width: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }

/* Label dropdown — 常用标签 + 卡片入口 */
.label-dropdown {
  display: none; position: fixed; z-index: 200; width: 248px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: var(--shadow-pop); max-height: 300px; overflow-y: auto; padding: 4px;
}
.label-dropdown.show { display: block; }
.label-cap {
  /* V2（2026-09-21）：原来是 28px —— 整个文件里唯一的异常值，比正文大一倍多。
     它只是下拉里的一个小标题，收敛到「小」这一级。 */
  padding: 7px 12px 4px; font-size: var(--fs-2); color: var(--text-muted); user-select: none;
}
.label-opt {
  padding: 7px 12px 7px 22px; font-size: var(--fs-3); cursor: pointer; border-radius: 5px;
  display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.label-opt .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.label-opt .w { font-family: var(--mono); font-size: var(--fs-tiny); color: var(--text2); white-space: nowrap; }
.label-opt.active, .label-opt:hover { background: var(--accent-soft); color: var(--accent); }
.label-opt.active .w, .label-opt:hover .w { color: var(--accent); }
.label-add {
  padding: 8px 12px; font-size: var(--fs-2); color: var(--accent); cursor: pointer;
  border-top: 1px solid var(--border); margin-top: 4px;
}
.label-add:hover { text-decoration: underline; }

/* 型钢 / 钢筋 重量计算器（弹出卡片，黑白简洁） */
.steel-overlay {
  display: none; position: fixed; inset: 0; z-index: 250;
  background: rgba(20,20,20,0.38); align-items: center; justify-content: center;
  padding: 8px;                       /* 同上：窗口再矮也要留出边距，卡片不贴边被切 */
  backdrop-filter: blur(2px);
}
.steel-overlay.show { display: flex; }
.steel-card {
  width: 580px; max-width: calc(100vw - 16px);
  height: auto;                       /* 按内容自适应，不强制撑满 */
  max-height: min(96vh, 780px);       /* 内容过多时仍受视口保护 */
  display: flex; flex-direction: column;
  background: var(--bg);
  border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  box-shadow: 0 18px 50px rgba(0,0,0,0.18); font-size: var(--fs-3);
}
/* 型钢重量卡片：固定高度，不随计算器窗口/视口高低变化（内部滚动）。
   桌面版打开时会请求窗口自动加高到 700px 装下它，关闭还原。
   ⚠️ 窗口矮（网页版 360px 高、或桌面版刚打开还没加高）时，660px 会顶出上下边缘被切
   → 高度改成 min(660, 视口-16)，最低也能内部滚动看全（2026-09-20 修）。 */
#steelOverlay .steel-card {
  height: min(660px, calc(100vh - 16px));
  max-height: calc(100vh - 16px);
}
.steel-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface); font-weight: 600;
}
.steel-head button { border: none; background: none; font-size: 16px; color: var(--text2); cursor: pointer; padding: 0 4px; line-height: 1; }
.steel-head button:hover { color: var(--text); }
/* ★ 2026-10-07 B：标题右边的后缀输入框（.xz-name）已随 xzName 一起删 —— 那项输入
   从 2026-10-07 起不参与插入结果，留着只会误导人填了没效果。 */
.steel-body { flex: 1; min-height: 0; padding: 10px 16px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
.steel-diagram { flex-shrink: 0; max-height: 150px; display: flex; align-items: center; justify-content: center; }
.steel-row { display: flex; align-items: center; gap: 8px; }
.steel-row label { width: 70px; color: var(--text2); flex-shrink: 0; }
.steel-row select, .steel-row input {
  flex: 1; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: var(--fs-3); font-family: var(--font); outline: none; background: var(--bg); color: var(--text);
}
.steel-row select:focus, .steel-row input:focus { border-color: var(--accent); }
.steel-input-wrap { flex: 1; position: relative; }
.steel-input-wrap input { width: 100%; box-sizing: border-box; }
.steel-input-wrap input[type="number"]::-webkit-inner-spin-button,
.steel-input-wrap input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.steel-input-wrap input[type="number"] { -moz-appearance: textfield; }
.steel-suggest {
  display: none; position: fixed; z-index: 260;
  max-height: 190px; overflow-y: auto; margin-top: 2px;
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 6px 16px rgba(0,0,0,0.10);
}
.steel-suggest-item { padding: 6px 10px; cursor: pointer; color: var(--text); font-size: var(--fs-3); }
.steel-suggest-item:hover { background: var(--accent-soft); color: var(--accent); }
.steel-result-row { display: flex; gap: 8px; margin-top: 2px; }
.steel-result {
  flex: 1; padding: 10px 8px; background: var(--accent-soft); border-radius: var(--radius);
  font-family: var(--mono); font-size: var(--fs-4); color: var(--accent); text-align: center;
}
.steel-result .unit { font-size: var(--fs-tiny); color: var(--text2); font-family: var(--font); }
.steel-result .lbl { color: var(--text2); font-family: var(--font); margin-right: 4px; font-size: var(--fs-tiny); }
/* ★ 2026-10-08（用户「这两个太大了，可以长一点，不要那么高那么大」）：柱墩卡
   体积 / 斜边 两个结果块压扁 —— 内边距减半、字号降一档，看着是两条扁长的结果条而不是大方块 */
.xz-overlay .steel-result { padding: 4px 8px; font-size: var(--fs-3); }
.xz-overlay .steel-area { padding: 4px 8px; }
.steel-area {
  flex: 1; margin-top: 0; padding: 10px 8px; background: var(--bg); border: 1px dashed var(--border); border-radius: var(--radius);
  font-family: var(--mono); font-size: var(--fs-3); color: var(--text); text-align: center;
}
.steel-area .lbl { color: var(--text2); font-family: var(--font); margin-right: 4px; }
.steel-area .unit { font-size: var(--fs-tiny); color: var(--text2); font-family: var(--font); }
.steel-source {
  margin-top: 4px; font-size: var(--fs-tiny); color: #999; text-align: center; font-family: var(--font);
}
.steel-source.is-error { color: var(--danger, #c0392b); }
.steel-foot {
  display: flex; gap: 8px; padding: 12px 16px 16px; flex-shrink: 0; border-top: 1px solid var(--border); background: var(--bg);
  display: flex; gap: 8px; padding: 12px 16px 16px; flex-shrink: 0; border-top: 1px solid var(--border); background: var(--bg);
}
.steel-foot button {
  flex: 1; padding: 8px; border-radius: var(--radius); font-size: var(--fs-3); cursor: pointer;
  border: 1px solid var(--border); background: var(--bg); color: var(--text2);
}
.steel-foot .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.steel-foot .primary:hover { filter: brightness(1.05); }
.date-overlay .steel-card { width: 380px; }
.tri-overlay .steel-card { width: min(380px, calc(100vw - 24px)); }
.tri-overlay .tri-diagram { height: 190px; max-height: none; position: relative; }
.tri-diagram svg { width: 100%; height: 100%; }
.tri-field { position: absolute; width: 64px; font-size: var(--fs-tiny); color: var(--text2); }
.tri-field label { display: block; margin-bottom: 2px; }
.tri-field input { width: 100%; height: 27px; padding: 2px 4px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); font: inherit; }
.tri-field input:focus { outline: 2px solid var(--accent-line); outline-offset: 0; }
.tri-field input[readonly] { background: var(--accent-soft); color: var(--accent); }
.tri-field-a { left: 43%; top: 75%; }
.tri-field-b { left: 1%; top: 40%; width: 50px; }
.tri-field-c { left: 58%; top: 25%; }
.tri-field-A { left: 25%; top: 1%; }
.tri-field-B { right: 2%; top: 42%; }
.tri-reset { border: 0; background: transparent; color: var(--accent); cursor: pointer; padding: 2px 4px; font: inherit; }
/* 人防下柱墩卡（2026-09-28）：只算几何 —— b1/B1/H 输入 → 底口 b2/B2 自动出。
   ★ 16:2x 用户「钢筋的先全部删掉」：钢筋量/顶平/弯折整块已删，不留残留。 */
.xz-overlay .steel-card { width: min(660px, calc(100vw - 24px)); }
/* ★★ 图面 V5（2026-09-28 17:0x，用户「位置都歪了…在下面做个表在下面填吧」）：
   **图上不放输入框**，只留变量名标注（b1/B1/b2/B2/H/α 贴对应边）；
   六个输入框全部搬到图下方的两列表格，一行两个：要填的四个在前，自动出的两个在后。
   ⇒ 彻底废掉 V4 的「绝对定位嵌图上」那套（canvas + XZ_POS + 缩放比换算），
     它靠 JS 算 px 对齐 viewBox，窗口一缩放就歪，实测三版都没稳住。
   ⇒ 现在图与表各占各的文档流，零坐标系换算，永远对得齐。 */
.xz-overlay .xz-diagram { height: auto; max-height: none; display: block; }
/* ★★ 这里必须用 .xz-overlay 抬高特异性 —— 共用样式 `.steel-diagram svg { max-width:100%; max-height:100% }`
   （写在后面）会给 svg 套个 max-height:100%，而父级是 flex/auto 高度 →
   svg 退回浏览器默认高 150px、宽度按比例缩成 300px（实测踩过：图看着就是"有点小看不清"）。
   柱墩卡的图要占满卡片宽度，所以显式 width:100% + max-height:none。 */
.xz-overlay .xz-canvas { width: 100%; }
.xz-overlay .xz-canvas > svg { width: 100%; height: auto; max-width: 100%; max-height: none; aspect-ratio: 442 / 220; display: block; }
/* ★ 2026-10-08 轻量兜底（用户「矮窗口够不到柱墩卡」）：图按 660 宽等比要 328px 高，
   窗口一矮它独占整卡，填数表全压到滚动区底下。矮视口下把图限高（viewBox 等比缩、
   内容居中不裁切），填数表不滚动就能露出来；高窗口不受影响（min 取不到上限）。 */
.xz-overlay .xz-canvas > svg { max-height: min(328px, 42vh); }
/* ★ 2026-09-30 用户：柱墩卡两个结果块样式统一 —— 右块（斜边）原来白底虚线、
   跟左块（体积）的浅蓝实底不搭，看着像两种东西。现在同款蓝底、同字号、同居中，
   只靠文字内容区分。只动柱墩卡（.xz-overlay），型钢/三角卡保持原样。 */
.xz-overlay .steel-area {
  background: var(--accent-soft); border: none;
  font-size: var(--fs-4); color: var(--accent);
}
/* 图下方填数表：两列网格，每格 = 一行标签（变量名+中文名+单位/状态）+ 一个输入框
   ★ 17:2x 用户「有点小有点看不清，再大一点」→ 字号/行高整体上调一档 */
.xz-table { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 14px; margin-top: 12px; }
.xz-cell { display: flex; flex-direction: column; gap: 3px; }
.xz-cell .xz-label { display: flex; align-items: baseline; gap: 5px; font-size: 12.5px; color: var(--text2); }
.xz-cell .xz-label b { font-family: var(--mono); font-weight: 600; font-size: 14.5px; color: var(--text); }
.xz-cell.auto .xz-label b { color: var(--accent); }
.xz-cell .xz-label em { font-style: normal; }
.xz-cell .xz-label i { font-style: normal; margin-left: auto; opacity: 0.6; }

.xz-cell input { width: 100%; height: 32px; padding: 2px 9px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); color: var(--text); font: inherit; font-family: var(--mono); font-size: 15.5px; text-align: center; }

.xz-cell input[type="number"]::-webkit-inner-spin-button,
.xz-cell input[type="number"]::-webkit-outer-spin-button {

   原 .tri-reset.xz-reset-hot 红底样式与 xzReset 绑定一并清除。 */
/* ★ 2026-09-29 E25：底栏三个动作按钮（插计算稿/插体积/插表面积）在 660px 卡里一行放得下，
   但窄屏（手机）会挤 —— 允许换行，每个按钮占约一半宽 */

/* 钢筋悬停二级下拉（标签下拉内嵌） */

.label-submenu {

     放不下就在内部滚。JS 的 positionSub() 还会再钳一次，两边都兜住。 */
  max-height: min(280px, calc(100vh - 16px)); overflow-y: auto;

.label-submenu .rebar-opt {

.label-submenu .rebar-opt .dia { font-family: var(--mono); font-weight: 600; }

/* 自定义标签删除按钮 */

.bar-undo.show { display: inline-block; }

/* 窗口边缘缩放热区（无边框窗体） */
.edge { position: fixed; z-index: 200; }

.edge-w { top:10px; bottom:10px; left:0; width:5px; cursor:w-resize; }
.edge-e { top:10px; bottom:10px; right:0; width:5px; cursor:e-resize; }
.edge-nw { top:0; left:0; width:14px; height:14px; cursor:nw-resize; }
.edge-ne { top:0; right:0; width:14px; height:14px; cursor:ne-resize; }

/* ══ 两态视图（2026-09-18）：简洁（算）/ 计算稿（表）在同一个窗口里切换，
   不再用遮罩弹窗 —— 那样会挡住算式、还锁住窗口没法拖到图纸旁边 ══ */
.sheet-zone { display: none; flex: 1; min-height: 0; overflow: hidden; border-top: 1px solid var(--border); }
.app[data-view="sheet"] .sheet-zone { display: block; }

   → 想压缩的容器必须显式 min-height:0。 */
.app[data-view="sheet"] .input-area { flex: 0 0 auto; min-height: 0; }
.app[data-view="sheet"] .panel:not(.active) { display: none; }   /* 表格态只留当前列 */
.app[data-view="sheet"] .panel { min-height: 0; }
.app[data-view="sheet"] .panel-add { display: none; }        /* 压缩时「＋加列」会被 ✕ 盖住，表格态直接不给 */
/* 计算稿态的结果**必须留语义标签**（2026-09-20 改）：
   原来这里 display:none 把标签藏了，同一个位置在「算」是「N 行合计」、在计算稿是
   「选中行工程量」，两个含义完全不同的数长得一模一样，切过来数字一跳会以为算错了。
   （L1 后结果簇已并进顶栏，这里只微调字号，不再有整行 padding。） */
.app[data-view="sheet"] .answer-row { padding: 4px 30px 4px 12px; border-bottom: none; }
.app[data-view="sheet"] .answer-tag { font-size: var(--fs-tiny); color: var(--text2); }
.app[data-view="sheet"] .answer-mode { display: none; }
.app[data-view="sheet"] .sym-bar { padding: 5px 12px; }
/* 计算稿态**不要算式输入行**（用户 2026-09-20：「计算稿模式这个行不要」）——
   表格里本来就有「计算式」列，符号行改为写进当前选中那一行的计算式格。 */
.app[data-view="sheet"] .input-wrap { display: none; }
.app[data-view="sheet"] .panel-input { padding: 8px 12px; }
/* 表头冻结：行一多，滚动时表头必须还在（Excel 的冻结首行） */
.sheet-table thead th {
  position: sticky; top: 0; z-index: 4;
  background: var(--surface);
  /* 表格是 border-collapse:collapse，sticky 会把 th 的下边框吃掉 → 用 inset 阴影补一条 */
  box-shadow: inset 0 -1px 0 var(--border);
}
/* 计算稿态的「＝结果」用表格口径字号（同样跟着「设置 → 字号」走） */
.app[data-view="sheet"] .answer-eq { font-size: calc(var(--sheet-fs, 12px) * 1.3); }
.app[data-view="sheet"] .answer-value { font-size: calc(var(--sheet-fs, 12px) * 1.3); }

/* ── 视图切换（算 / 计算稿）：挂在符号行最右端 ──
   （O1 一度把它移到顶栏右侧，2026-09-21 按用户要求还原到符号行。）
   符号行每个面板各有一份，但同一时刻只显示一份：简洁态显示第一列的、计算稿态显示活动列的。 */
.view-switch {
  display: none; margin-left: auto; align-items: center; flex-shrink: 0;
  border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--bg);
}
.app[data-view="calc"] .panel:first-child .view-switch { display: inline-flex; }
.app[data-view="sheet"] .panel.active .view-switch { display: inline-flex; }
/* ★ 2026-09-30 增大（用户：「计算稿计算切换按钮调大」）：字号升一档、内边距加倍、整块加粗。
   窄窗下限 560px 时符号行还有 ƒ / ? 等按钮，所以只加到 14px 字号 + 7px 内边距，

.vs-btn {
  border: none; background: transparent; cursor: pointer; padding: 7px 16px;
  font-family: var(--font); font-size: var(--fs-3); font-weight: 500; color: var(--text2); line-height: 1.4;
}
.vs-btn + .vs-btn { border-left: 1px solid var(--border); }

.vs-btn.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

.sheet-zone .card.sheet-card {
  position: relative;   /* 横向溢出小提示的定位基准（2026-10-07） */
  width: 100%; height: 100%; max-width: none; max-height: none;
  border: none; border-radius: 0; box-shadow: none;
}
/* 计算稿态显示全部 8 列（含备注列）；窗口窄时靠 .sheet-wrap 横向滚动兜底 */

/* ══ V5 手机端（2026-09-21）═════════════════════════════════════════════
   现状：整个文件 0 处 @media 断点，手机上就是"桌面版缩小"，且三处按钮 hover 才显
   → 触屏上"加不了行、删不了行、加不了列"（不是难用，是用不了）。
   做法：窄屏 + 触屏两件事分开判 ——
     · 触屏（hover:none）：把 hover 才显的按钮改常显（见上面的 @media (hover:none) 块）

}

@media (hover: none) and (max-width: 820px) {
  .title-bar .title-btns { display: none; }
}

<script>
const $ = id => document.getElementById(id);
let inputArea = null;
let activePanel = null;
let panels = [];
let panelSeq = -1;   // 每列一个不复用的 uid（idx 会因删列重排，附图归属必须用 uid）
const MAX_PANELS = 4;
const panelsRoot = $('panels');
/* ── 算式框持久化（2026-09-20）────────────────────────────────────────────
   原来只存计算稿、不存算式框 —— 关掉再打开，输入框是空的，可表里那些行的
   srcLine 绑定（第几行）还留着 → 再算第一道题就**静默顶掉上次的表行**
   （实测：算 24.5*3.6 入表 → 重开 → 算 5*5 → 表里那行变成 5*5，旧算式无声消失）。
   现在把「列数 + 每列算式」一起存，重开时和表里的绑定同步恢复，两边不会再错位。
   ⚠️ 这三个状态必须声明在下面那句 panelsRestore() 之前（var/const 不提升赋值）。 */
const PANELS_LS = 'calc_panels_v1';
const CALC_PREC_LS = 'calc_prec_v1';
let bootQuiet = false;         // 启动恢复期间：算式只算数，不回写计算稿（免得顶掉用户在表里手改的内容）
let panelsSaveTimer = null;
/* 全局精度：每列答案行里的精度下拉镜像此值，改任意一个全局生效。
   ★ 2026-10-08：要活过重开 —— 原来写死 '4' 且不落盘，用户改成 2 位、关掉再开又回 4 位
   （红队实测：localStorage 里根本没有存精度的键）。 */
let curPrec = (function () {
  try { const v = String(safeLS.get(CALC_PREC_LS) || ''); return /^[0-4]$/.test(v) ? v : '4'; } catch (e) { return '4'; }
})();
function setPrecision(v) {
  curPrec = v;
  try { safeLS.set(CALC_PREC_LS, String(v)); } catch (e) {}
  panels.forEach(p => { if (p._precSel) p._precSel.value = v; });
  recomputeAll();
}
let history = [];
let lastResult = '';

try { history = JSON.parse(safeLS.get('calc_history') || '[]'); } catch(e) { history = []; }
/* 算式流水保留期：原来只留 24 小时（一过夜全清，和「操作即沉淀」自相矛盾），
   现改为 180 天；表里的计算稿另存 calc_sheet_v1，两者互不影响。 */
const KEEP_HISTORY_MS = 180 * 24 * 60 * 60 * 1000;
history = history.filter(h => Date.now() - h.time < KEEP_HISTORY_MS);

// 左下角网址：桌面壳里用系统浏览器打开（WebView2 内跳转会顶掉计算器页面），浏览器环境直接新开标签
$('siteLink').addEventListener('click', (e) => {
  e.preventDefault();
  const s = getShell();
  const fn = s && (s.open_site || s.openSite);
  if (fn) fn.call(s);
  else window.open('https://fhzjsj.cn', '_blank', 'noopener');
});
$('closeBtn').addEventListener('click', closeSheet);
/* 记录已改为窗口内视图（不再有遮罩弹层），点背景关闭的逻辑随之取消 */
/* ══════════════════════════════════════════════════════════════════════════
   全局提示位（底部那条）+ 撤销（2026-09-20）
   为什么要有它：「算」视图里原本没有任何提示条 —— 删行、存储写不进去这些消息
   以前只能发到计算稿底部的提示行，用户在「算」视图里根本看不到。
   appTip(msg, ms, undoFn, kind)：显示一句话；给了 undoFn 就同时亮出「撤销」按钮。
   ══════════════════════════════════════════════════════════════════════════ */
var barMsgTimer = null, barUndoFn = null;
function appTip(msg, ms, undoFn, kind) {
  const m = $('barMsg'), u = $('barUndo');
  if (!m || !u) return;
  m.textContent = msg || '';
  m.classList.toggle('warn', kind === 'warn');
  barUndoFn = (typeof undoFn === 'function') ? undoFn : null;
  u.classList.toggle('show', !!barUndoFn);
  if (barMsgTimer) { clearTimeout(barMsgTimer); barMsgTimer = null; }
  if (msg) {
    barMsgTimer = setTimeout(function () { appTip(''); }, ms || 3200);
  }
}
/* ★ 2026-10-21 糯米B #395 P2：导入完成的撤销改成非模态后，10 秒窗口期里用户很可能已经开始
   编辑（输名称、插行）。此时点那颗「撤销」会整表回滚，把新输入一起吃进去 —— 原来有模态框挡着，
   这条路走不到；改成非模态后它就可达了。所以：任何**内容变更**入口都先把撤销摘掉，
   要撤销就只能趁"还没动过"的那几秒。 */
function fhKillUndo() {
  try {
    barUndoFn = null;
    var u = $('barUndo'); if (u) u.classList.remove('show');
  } catch (e) {}
}
window.fhKillUndo = fhKillUndo;

/* ★ 2026-10-21 用户：「导入的时候应该要可以拖动，我都拖不动」——
   所有弹窗（导入预览/恢复预览/确认框）按住标题栏就能拖走，看清被它挡住的表格。
   用事件委托注册一次，不用逐处改挂载点；只在 .confirm-title 上起拖，
   避免抢输入框 / 下拉 / 按钮 / 预览表格里的滚动和选择。 */
(function fhDragAnyModal() {
  var box = null, sx = 0, sy = 0, ox = 0, oy = 0;
  document.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    var t = e.target;
    if (!t || !t.closest) return;
    var title = t.closest('.confirm-title');
    if (!title) return;
    var b = title.closest('.confirm-box');
    if (!b) return;
    var r = b.getBoundingClientRect();
    box = b; sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top;
    /* 居中是靠 margin:auto 实现的，拖之前先换成固定坐标，否则一拖就弹回中间 */
    b.style.position = 'fixed';
    b.style.margin = '0';
    b.style.left = ox + 'px';
    b.style.top = oy + 'px';
    b.style.transform = 'none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', function (e) {
    if (!box) return;
    var nx = ox + (e.clientX - sx), ny = oy + (e.clientY - sy);
    /* 别让人把窗拖出屏幕（左右至少留一截标题能抓回来） */
    nx = Math.max(60 - box.offsetWidth, Math.min(nx, window.innerWidth - 60));
    ny = Math.max(0, Math.min(ny, window.innerHeight - 36));
    box.style.left = nx + 'px';
    box.style.top = ny + 'px';
  });
  document.addEventListener('mouseup', function () { box = null; });
})();
