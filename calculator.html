/* 日期计算卡片（模式：日期差天数 / 日期 ± N 天） */
const dateOverlay = $('dateOverlay');
const dateMode = $('dateMode');
const dateInputs = $('dateInputs');
const dateResult = $('dateResult');

function parseDate(v) {
  if (!v) return null;
  const m = String(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (!m) return null;
  return Date.UTC(+m[1], +m[2] - 1, +m[3]);
}
function fmtDate(ms) {
  const d = new Date(ms);
  const y = d.getUTCFullYear();
  const mo = String(d.getUTCMonth() + 1).padStart(2, '0');
  const da = String(d.getUTCDate()).padStart(2, '0');
  return `${y}-${mo}-${da}`;
}

function openDateCalc() {
  if (labelCtx) {
    const sp0 = exprSpot();
    if (sp0) {
      const text = spotText(sp0), pos = spotSel(sp0)[0];
      spotWrite(sp0, text.substring(0, labelCtx.start) + text.substring(pos), labelCtx.start);
    }
    labelCtx = null;
  }
  hideLabelDropdown();
  dateOverlay.classList.add('show');
  /* 日期卡片只有 380 宽、需要约 420 高 —— 原来借 winFit(1140, 520) 把窗口**拉宽到 1140**，
     同样会触发"窗口左右跳"。改成只加高（2026-09-21）。 */
  winGrowHeight(520);
  renderDateFields();
}
function closeDateCalc() { dateOverlay.classList.remove('show'); winRestoreCard(); viewWinSync(); }

function renderDateFields() {
  const mode = dateMode.value;
  if (mode === 'diff') {
    dateInputs.innerHTML =
      `<div class="steel-row"><label>开始日期</label><input type="date" id="dateStart"></div>
       <div class="steel-row"><label>结束日期</label><input type="date" id="dateEnd"></div>`;
  } else {
    dateInputs.innerHTML =
      `<div class="steel-row"><label>基准日期</label><input type="date" id="dateBase"></div>
       <div class="steel-row"><label>天数(±)</label><input type="number" step="any" id="dateDays" placeholder="可负，如 -7"></div>`;
  }
  dateInputs.querySelectorAll('input').forEach(inp => inp.addEventListener('input', computeDate));
  computeDate();
}

function computeDate() {
  const mode = dateMode.value;
  let res = '—', val = '', spec = '';
  if (mode === 'diff') {
    const a = parseDate($('dateStart').value), b = parseDate($('dateEnd').value);
    if (a != null && b != null) {
      const days = Math.round((b - a) / 86400000);
      res = days + ' <span class="unit">天</span>';
      val = String(days); spec = '日期差 天';
    }
  } else {
    const base = parseDate($('dateBase').value);
    const days = parseFloat($('dateDays').value);
    if (base != null && !isNaN(days)) {
      const out = fmtDate(base + days * 86400000);
      res = out; val = ''; spec = '推算日期 ' + out;
    }
  }
  dateResult.innerHTML = res;
  dateResult.dataset.val = val; dateResult.dataset.spec = spec;
}

function insertDate() {
  const val = dateResult.dataset.val || '', spec = dateResult.dataset.spec || '';
  if (!spec) return;
  const sp = exprSpot();
  if (!sp) { closeDateCalc(); spotFlashEmpty(); return; }
  const text = spotText(sp), pos = spotSel(sp)[0];
  const before = text.substring(0, pos), after = text.substring(pos);
  let insert, caret;
  if (val) { insert = val + '【' + spec + '】'; caret = before.length + String(val).length; }
  else { insert = '【' + spec + '】'; caret = before.length + insert.length; }
  closeDateCalc();
  spotWrite(sp, before + insert + after, caret);
}

/* Right triangle: enter two sides, or one side and one acute angle. */
const triOverlay = $('triOverlay');
const triResult = $('triResult'), triArea = $('triArea'), triSource = $('triSource');
function openTriCalc() {
  if (labelCtx) {
    const sp0 = exprSpot();
    if (sp0) {
      const text = spotText(sp0), pos = spotSel(sp0)[0];
      spotWrite(sp0, text.substring(0, labelCtx.start) + text.substring(pos), labelCtx.start);
    }

  }

  triOverlay.classList.add('show');
  winGrowHeight(520);
  renderTriFields();
}
function closeTriCalc() { triOverlay.classList.remove('show'); winRestoreCard(); viewWinSync(); }
let triUser = new Set();   /* Only entered values count as constraints; calculated fields are read-only. */
function renderTriFields() {
  triUser = new Set();
  renderTriDiagram();
  $('triDiagram').querySelectorAll('input').forEach(function (inp) {
    inp.addEventListener('input', function () {
      if (inp.value.trim()) triUser.add(inp.id);
      else triUser.delete(inp.id);
      computeTri();
    });
  });
  computeTri();
}
/* Fixed right-angle sketch. Each label and input stays next to its own side or corner. */
function renderTriDiagram() {
  const box = $('triDiagram');
  if (!box) return;
  box.innerHTML =
    '<svg viewBox="0 0 320 180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M 57 31 L 57 130 L 263 130 Z" fill="none" stroke="currentColor" stroke-width="1.6"/>' +
    '<path d="M 67 130 L 67 120 L 57 120" fill="none" stroke="currentColor" stroke-width="1.2"/>' +
    '<path d="M 57 47 Q 70 43 72 39 M 247 130 Q 247 121 249 116" fill="none" stroke="currentColor" stroke-width="1.1"/>' +
    '</svg>' +
    [
      ['tri_A', 'A 角 °', 'tri-field-A', '角 A（上方，0-90 度）'],
      ['tri_B', 'B 角 °', 'tri-field-B', '角 B（右下方，0-90 度）'],
      ['tri_a', 'a 底边 m', 'tri-field-a', '边 a（底边）'],
      ['tri_b', 'b 竖边 m', 'tri-field-b', '边 b（左竖边）'],
      ['tri_c', 'c 斜边 m', 'tri-field-c', '边 c（斜边）']
    ].map(function (f) {
      return '<div class="tri-field ' + f[2] + '"><label for="' + f[0] + '">' + f[1] + '</label>' +
        '<input id="' + f[0] + '" type="number" step="any" inputmode="decimal" placeholder="?" aria-label="' + f[3] + '"></div>';
    }).join('');
}

function computeTri() {
  /* Clear derived values before each solve, so an old result never becomes a new constraint. */
  ['tri_a','tri_b','tri_c','tri_A','tri_B'].forEach(function (id) {
    const el = $(id);
    if (el && !triUser.has(id)) { el.value = ''; el.readOnly = false; }
  });
  const g = function (id) { return triUser.has(id) && $(id) ? parseFloat($(id).value) : NaN; };
  let a = g('tri_a'), b = g('tri_b'), c = g('tri_c'), A = g('tri_A'), B = g('tri_B');
  const isNum = function (v) { return isFinite(v) && v > 0; };
  /* 两个角都填 → 校验和为 90；只填 B → A = 90-B */
  let note = '';
  if (isFinite(A) && isFinite(B)) {
    if (A <= 0 || B <= 0 || Math.abs(A + B - 90) > 0.01) { note = 'A + B 必须等于 90°'; }
  } else if (!isFinite(A) && isFinite(B) && B > 0 && B < 90) { A = 90 - B; }
  else if (!isFinite(B) && isFinite(A) && A > 0 && A < 90) { B = 90 - A; }
  const rad = isFinite(A) ? A * Math.PI / 180 : null;
  const r = Math.PI / 180;
  /* 解算：能定几个未知量就解几个（至少两条边，或一条边+一角） */
  try {
    if (isFinite(a) && a <= 0) throw '边 a 必须大于 0';
    if (isFinite(b) && b <= 0) throw '边 b 必须大于 0';
    if (isFinite(c) && c <= 0) throw '边 c 必须大于 0';
    /* 填了角就必须合法：0 < A < 90（90 是直角本身，不能当锐角填） */
    if (isFinite(A) && (A <= 0 || A >= 90)) throw '角 A 必须在 0-90° 之间（不含 90）';
    if (isFinite(B) && (B <= 0 || B >= 90)) throw '角 B 必须在 0-90° 之间（不含 90）';
    if (note) throw note;   /* A+B ≠ 90 → 明说，不静默按一条边+一角算 */
    if (isNum(a) && isNum(b)) {
      c = Math.sqrt(a * a + b * b);
      A = Math.atan2(a, b) / r; B = 90 - A;
      /* 用户还亲手填了 c 但和 a,b 勾股不一致 → 明说，别静默用两条边 */
      if (triUser.has('tri_c') && Math.abs(c - parseFloat($( 'tri_c').value)) > 0.01) throw 'a、b、c 不构成直角三角形（c 应为 ' + (Math.round(c * 1000) / 1000) + '）';
      if (triUser.has('tri_A') && isFinite(g('tri_A')) && Math.abs(A - g('tri_A')) > 0.05) throw '按边 a' + a + ' / b' + b + '，角 A 应为 ' + (Math.round(A * 100) / 100) + '°，与填的 ' + g('tri_A') + '° 矛盾';
      if (triUser.has('tri_B') && isFinite(g('tri_B')) && Math.abs(B - g('tri_B')) > 0.05) throw '按边 a' + a + ' / b' + b + '，角 B 应为 ' + (Math.round(B * 100) / 100) + '°，与填的 ' + g('tri_B') + '° 矛盾';
    }
    else if (isNum(a) && isNum(c)) {
      if (c <= a) throw '斜边必须大于直角边';
      b = Math.sqrt(c * c - a * a);
      A = Math.asin(a / c) / r; B = 90 - A;
      if (triUser.has('tri_b') && isNum(g('tri_b')) && Math.abs(b - g('tri_b')) > 0.01) throw 'a、b、c 不构成直角三角形（b 应为 ' + (Math.round(b * 1000) / 1000) + '）';
      if (triUser.has('tri_A') && isFinite(g('tri_A')) && Math.abs(A - g('tri_A')) > 0.05) throw '按边 a' + a + ' / c' + c + '，角 A 应为 ' + (Math.round(A * 100) / 100) + '°，与填的 ' + g('tri_A') + '° 矛盾';
    }
    else if (isNum(b) && isNum(c)) {
      if (c <= b) throw '斜边必须大于直角边';
      a = Math.sqrt(c * c - b * b);
      A = Math.acos(b / c) / r; B = 90 - A;
      if (triUser.has('tri_A') && isFinite(g('tri_A')) && Math.abs(A - g('tri_A')) > 0.05) throw '按边 b' + b + ' / c' + c + '，角 A 应为 ' + (Math.round(A * 100) / 100) + '°，与填的 ' + g('tri_A') + '° 矛盾';
    }
    else if (isNum(a) && rad) { b = a / Math.tan(rad); c = a / Math.sin(rad); B = 90 - A; }
    else if (isNum(b) && rad) { a = b * Math.tan(rad); c = b / Math.cos(rad); B = 90 - A; }
    else if (isNum(c) && rad) { a = c * Math.sin(rad); b = c * Math.cos(rad); B = 90 - A; }
    else {
      if (isFinite(A) && !triUser.has('tri_B')) { $('tri_B').value = Math.round(B * 1000) / 1000; $('tri_B').readOnly = true; }
      if (isFinite(B) && !triUser.has('tri_A')) { $('tri_A').value = Math.round(A * 1000) / 1000; $('tri_A').readOnly = true; }
      triResult.textContent = '—'; triResult.dataset.val = ''; triResult.dataset.spec = '';
      triArea.innerHTML = '<span class="lbl">面积</span><span class="val">—</span> <span class="unit">㎡</span>';
      triSource.textContent = '填任意两条边，或一条边和一个角';
      triSource.classList.remove('is-error');
      return;
    }

    /* 无论哪组输入触发解算，都核对用户亲自填写的全部值，避免额外条件被分支忽略。 */
    [
      ['tri_a', a, '边 a'], ['tri_b', b, '边 b'], ['tri_c', c, '边 c'],
      ['tri_A', A, '角 A'], ['tri_B', B, '角 B']
    ].forEach(function (item) {
      const entered = g(item[0]);
      if (!isFinite(entered)) return;
      const isAngle = item[0] === 'tri_A' || item[0] === 'tri_B';
      const tolerance = isAngle ? 0.05 : Math.max(0.01, Math.abs(item[1]) * 0.000001);
      if (Math.abs(entered - item[1]) > tolerance) {
        const expected = Math.round(item[1] * (isAngle ? 100 : 1000)) / (isAngle ? 100 : 1000);
        throw '按其他已知尺寸，' + item[2] + ' 应为 ' + expected + (isAngle ? '°' : '');
      }
    });
  } catch (err) {
    triResult.textContent = '条件冲突'; triResult.dataset.val = ''; triResult.dataset.spec = '';
    triArea.innerHTML = '<span class="lbl">面积</span><span class="val">—</span> <span class="unit">㎡</span>';
    triSource.textContent = String(err);
    triSource.classList.add('is-error');
    return;
  }
  const R3 = function (v) { return Math.round(v * 1000) / 1000; };
  a = R3(a); b = R3(b); c = R3(c); A = R3(A); B = R3(B);
  /* 把算出的值回填到输入框（用户填过的原值不动数值本身，只规范小数位） */
  ['tri_a','tri_b','tri_c','tri_A','tri_B'].forEach(function (id, i) {
    const el = $(id); const v = [a, b, c, A, B][i];
    if (el && !triUser.has(id)) { el.value = v; el.readOnly = true; }
  });
  triResult.innerHTML = c + ' <span class="unit">m</span>';
  triResult.dataset.val = String(c);
  triResult.dataset.spec = '三角 c=a' + a + ' b' + b + ' A' + A + '°';
  const area = 0.5 * a * b;
  triArea.innerHTML = '<span class="lbl">面积</span><span class="val">' + R3(area) + '</span> <span class="unit">㎡</span>';
  triSource.textContent = '直角三角形 · a' + a + ' × b' + b + '，角 A=' + A + '° / 角 B=' + B + '°';
  triSource.classList.remove('is-error');
}

function insertTri() {
  const val = triResult.dataset.val || '', spec = triResult.dataset.spec || '';
  if (!val) return;
  const sp = exprSpot();
  if (!sp) { closeTriCalc(); spotFlashEmpty(); return; }
  const text = spotText(sp), pos = spotSel(sp)[0];
  const before = text.substring(0, pos), after = text.substring(pos);
  const insert = val + '【' + spec + '】';
  closeTriCalc();
  spotWrite(sp, before + insert + after, before.length + val.length);
}
$('triClose').addEventListener('click', closeTriCalc);
$('triCancel').addEventListener('click', closeTriCalc);
$('triInsert').addEventListener('click', insertTri);
$('triReset').addEventListener('click', renderTriFields);
triOverlay.addEventListener('click', function (e) { if (e.target === triOverlay) closeTriCalc(); });
document.addEventListener('keydown', function (e) {
  if (!triOverlay.classList.contains('show')) return;
  if (e.key === 'Escape') closeTriCalc();
  else if (e.key === 'Enter') insertTri();
});

    /* 带自造 MIME 只能走异步 write(ClipboardItem)；这条路上失败再退回纯文本 */
    if (extra && window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      return navigator.clipboard.write([new window.ClipboardItem({
        'text/plain': new Blob([txt], { type: 'text/plain' }),
        [extra.mime]: new Blob([extra.data], { type: extra.mime })
      })]).then(function () { return true; })
        .catch(function () { return copyPlainText(txt); });
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(txt).then(function () { return true; })
        .catch(function () { return fallback(); });
    }
  } catch (e) {}
  return Promise.resolve(fallback());
}

/* 复制整行：剪贴板里同时放「看得见的制表符文本」和「只有本机能认的整行标记」，
   粘贴时凭标记认领 —— 从别处复制来的普通文本不会被误当成整行而在下方凭空插一行。 */
function sheetCopyRow(id, text) {
  const row = sheetFind(id);
  if (!row) return Promise.resolve(false);
  const payload = {
    type: 'row',
    kind: row.kind || 'item', node: row.node || '', name: row.name || '',
    expr: row.expr || '', unit: row.unit || '', note: row.note || '',
    shotId: row.shotId != null ? row.shotId : null
  };
  return copyPlainText(text, { mime: SHEET_ROW_MIME, data: JSON.stringify(payload) })
    .then(function (ok) {
      sheetGridClipboard = ok ? { type: 'row', text: text, row: payload, marked: true } : null;
      return ok;
    });
}


function sheetFreeUrls() {
  sheetUrls.forEach(function (u) { try { URL.revokeObjectURL(u); } catch (e) {} });
  sheetUrls = [];
}

/* 备注列（最后一列）：平时是能打字的备注格；这一行贴了图，就用图盖住备注。
   出口径与此一致：有图导内嵌图、没图导备注文字。 */
function sheetNoteCell(r, byId) {
  const txt = '<div class="c-edit c-note-txt" contenteditable="true" spellcheck="false" data-f="note" ' +
              'data-ph="备注">' + escHtml(r.note || '') + '</div>';
  if (!r.shotId) return txt;                           // 贴图入口：顶栏「截图」/ 选中行 Ctrl+V / 直接拖进来
  const rec = byId[r.shotId];
  if (!rec) return txt;                                // 原图丢了：重新截图或 Ctrl+V 即可覆盖
  const url = URL.createObjectURL(rec.blob);
  sheetUrls.push(url);
  return txt +
    '<div class="note-shot">' +
      '<img class="shot-mini" src="' + url + '" alt="附图" loading="lazy" decoding="async" data-shot="' + r.shotId + '">' +
      '<button class="shot-del" data-act="shotdel" title="删掉这张图（删掉后备注可见）">✕</button>' +
    '</div>';
}

/* 重绘前先把「正在编辑的那一格」落库并失焦。
   踩过的坑：整表 innerHTML 重绘时若还有格子处于编辑态，浏览器的失焦时序会把文字写到错的行上
   （实测：给行 A 贴图，行 C 的算式跑到了行 A、行 C 变空）。 */
/* 单位 / 项目名称换成了 <input>（要能下拉选候选），所以取值/赋值都要分类型。
   <input> 类格子（带 data-f）直接返回自己；contenteditable 格子往上找 .c-edit。 */
function cellOf(e) {
  const el = e && e.target;
  if (!el || !el.classList) return null;
  if ((el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') && el.dataset && el.dataset.f) return el;
  return el.closest ? el.closest('.c-edit') : null;
}
function cellVal(el) {
  if (!el) return '';
  if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return el.value;
  return el.innerText.replace(/\u00a0/g, ' ').replace(/\n+$/, '');
}
function cellSet(el, v) {
  if (!el) return;
  if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.value = v;
  else el.textContent = v;
}
function sheetCommitFocus() {
  const ae = document.activeElement;
  if (!ae || !ae.closest || !ae.closest('#sheetBody')) return;
  const cell = cellOf({ target: ae });
  if (cell) {
    const tr = cell.closest('tr[data-id]');
    const r = tr ? sheetFind(Number(tr.dataset.id)) : null;
    if (r) {
      const f = cell.dataset.f;
      const nv = cellVal(cell);
      if (r[f] !== nv) { r[f] = nv; sheetSave(); fhKillUndo(); }   /* 真改了才摘导入撤销 */
    }
  }
  try { ae.blur(); } catch (e) {}
}

/* 行尾 ＋（下面插一行）/ ✕（删这一行）—— 2026-09-27 从行首挪过来，行首只管选行 */
const ROW_OPS = '<span class="row-ops">' +
  '<button class="op" type="button" data-act="ins" title="在下面插一行">＋</button>' +
  '<button class="op" type="button" data-act="del" title="删掉这一行">✕</button></span>';

async function sheetRender() {

    sheetRows.forEach(function (r, i) {

'<td class="c-ops" tabindex="0" title="' + (_cnt > 0 ? '这一段有 ' + _cnt + ' 条明细：点三角收起/展开，点别处选整行' : '点击选择整行（Ctrl / Shift 点可多选）') + '">' +
  (_cnt > 0
    ? '<button class="sec-fold" type="button" data-act="fold" aria-label="' + (r.collapsed ? '展开' : '收起') + '这一段' + _cnt + '条明细" title="' + (r.collapsed ? '展开' : '收起') + '下面 ' + _cnt + ' 条明细">' + (r.collapsed ? '▸' : '▾') + '</button>'
    : '') + '</td>' +

          '<td class="c-sec" colspan="' + _secSpan + '"><div class="c-edit" contenteditable="true" spellcheck="false" data-f="name" data-ph="部位名，如 地面 / 墙面 / 天棚">' + escHtml(r.name || '') + '</div>' +
          (r.collapsed && _cnt ? '<span class="sec-count">已收起 ' + _cnt + ' 条 · 点 ▸ 展开</span>' : '') + ROW_OPS + '</td>' +

        html += '<tr class="srow item ' + (sheetSel === id ? 'sel' : '') + '" data-id="' + id + '">' +
'<td class="c-ops" tabindex="0" title="点击选择整行（Ctrl / Shift 点可多选）"></td>' +
'<td class="c-seq" tabindex="0" title="点击选择整行（Ctrl / Shift 点可多选）">' + (seqs[i] === '' ? '' : seqs[i]) + '</td>' +

          '<td class="c-qty">' + escHtml(sheetQty(r.expr)) + '</td>' +

          '</tr>';

  body.innerHTML = html;

  const items = sheetRows.filter(function (r) { return r.kind === 'item'; }).length;
  /* ★ 2026-10-21：底部统计照旧按全量算（收起的行没被删），但要说清"为什么屏上少了" */
  let _fsec = 0, _hid = 0, _inF = false;
  sheetRows.forEach(function (r) {
    if (r.kind === 'section') { _inF = !!r.collapsed; if (_inF) _fsec++; }
    else if (_inF) _hid++;
  });
  const st = $('sheetStat');
  if (st) {
    const sz = bytes >= 1048576 ? (bytes / 1048576).toFixed(1) + ' MB'
             : bytes >= 1024 ? Math.round(bytes / 1024) + ' KB'
             : bytes + ' B';
    st.textContent = items + ' 条明细 / 共 ' + sheetRows.length + ' 行' +
      (_fsec ? ' · 收起 ' + _fsec + ' 段（' + _hid + ' 条暂不显示，导出照旧）' : '') +

      (all.length && !shotStoreOK ? ' · ⚠ 本环境不能长期存图' : '') +

  syncSheetAnswer();   // 计算稿态的结果行跟随选中行（没有顶部输入框了）
  try { sheetOverflowSync(false); } catch (e) {}   // 行数/列宽变了，溢出状态跟着刷新（2026-10-07）

/* ══════════════════════════════════════════════════════════════════════
   表格键盘 = Excel 手感（2026-09-20 用户：「按回车应该是往下一格，按 tab 是右边一格」）
     Enter       → 下一格（**已在末行就自动补一行**，Excel 也这样）
     Shift+Enter → 上一格
     Tab         → 右一格（末列 → 下一行的首格）；Shift+Tab → 左一格
     Esc         → 撤销这一格本次改动并退出编辑（**再按一次 Esc 才切回「算」视图**）
   移动后一律 scrollIntoView —— 按 Tab 不再跳出视野。
   ══════════════════════════════════════════════════════════════════════ */
var cellEditBackup = null;        // { el, val }：某格进入编辑时的原值，供 Esc 还原
function sheetRowEls() {
  const body = $('sheetBody');
  return body ? Array.prototype.slice.call(body.querySelectorAll('tr[data-id]')) : [];
}
function sheetRowEditables(row) {
  return row ? Array.prototype.slice.call(row.querySelectorAll('[data-f]')) : [];
}
function caretToEnd(el) {
  try {
    const sel = window.getSelection(); if (!sel) return;
    const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
    sel.removeAllRanges(); sel.addRange(r);
  } catch (e) {}
}
function focusSheetEl(rowIdx, el) {
  const rows = sheetRowEls();
  const row = rows[rowIdx];
  if (!row || !el) return false;
  try { el.focus(); } catch (e) { return false; }
  if (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA') caretToEnd(el);
  sheetSel = Number(row.dataset.id);
  const body = $('sheetBody');
  if (body) Array.prototype.slice.call(body.querySelectorAll('tr.sel')).forEach(function (x) { x.classList.remove('sel'); });
  row.classList.add('sel');
  try { el.scrollIntoView({ block: 'nearest' }); } catch (e) {}
  syncSheetAnswer();
  return true;
}
function focusRowCell(rowIdx, f, wantLast) {
  const rows = sheetRowEls();
  const row = rows[rowIdx];
  if (!row) return false;
  const cells = sheetRowEditables(row);
  let el = f ? row.querySelector('[data-f="' + f + '"]') : null;
  if (!el) el = wantLast ? cells[cells.length - 1] : cells[0];
  return focusSheetEl(rowIdx, el);
}
function sheetCellMove(dir) {
  const ae = document.activeElement;
  if (!ae || !ae.closest || !ae.closest('#sheetBody')) return false;
  const cell = cellOf({ target: ae });
  if (!cell) return false;
  const tr = cell.closest('tr[data-id]');
  if (!tr) return false;
  const rows = sheetRowEls();
  const ri = rows.indexOf(tr);
  const cells = sheetRowEditables(tr);
  const ci = cells.indexOf(cell);
  if (ri < 0 || ci < 0) return false;
  const f = cell.dataset.f;
  let nr = ri, nc = ci;
  if (dir === 'down') nr = ri + 1;
  else if (dir === 'up') nr = ri - 1;
  else if (dir === 'right') { nc = ci + 1; if (nc >= cells.length) { nc = 0; nr = ri + 1; } }
  else if (dir === 'left') { nc = ci - 1; if (nc < 0) { nr = ri - 1; nc = -1; } }
  if (nr < 0) return true;                                   // 已在首行：停住
  if (nr >= rows.length) {                                    // 已在末行：自动补一行
    if (dir === 'down' || dir === 'right') {
      /* 下移：落到新行的同一列；右移跨行：落到新行的首格 */
      const wantF = (dir === 'down') ? f : null;
      sheetAddRow(tr.dataset.id, 'item', 'below').then(function () { focusRowCell(rows.length, wantF); });
    }
    return true;
  }
  if (dir === 'down' || dir === 'up') { focusRowCell(nr, f); return true; }
  /* 左右移动：按「该行的可编辑格顺序」取相邻格 —— 不能按列名取，否则永远停在原地 */
  const tCells = sheetRowEditables(rows[nr]);
  const tEl = tCells[nc < 0 ? tCells.length - 1 : Math.min(nc, tCells.length - 1)];
  return focusSheetEl(nr, tEl);
}
function sheetCellEsc(cell) {
  if (cellEditBackup && cellEditBackup.el === cell) {
    cellSet(cell, cellEditBackup.val);
    cell.dispatchEvent(new Event('input', { bubbles: true }));
  }
  try { cell.blur(); } catch (e) {}
  sheetFlash('已撤销这一格的改动', 1800);
}
/* 计算稿态的结果行：没有顶部输入框了，就显示**当前选中那一行**的工程量（像 Excel 的编辑栏） */
function syncSheetAnswer() {
  if (curView !== 'sheet') return;
  const r = (sheetSel !== null && sheetSel !== undefined) ? sheetFind(sheetSel) : null;
  const val = (r && r.kind === 'item') ? sheetQty(r.expr) : '';
  panels.forEach(function (p) {
    if (p._ansEl) {
      /* 没选中行时给一句占位话，而不是留一片空白（原来那一行高度照占、什么也不说） */
      p._ansEl.classList.toggle('answer-ph', !val);
      p._ansEl.textContent = val || '点一格看它的工程量';
      p._ansEl.title = val ? '选中行的工程量' : '在下面表格里点一行或点一个格子';
    }
    if (p._ansTag) p._ansTag.textContent = val ? '选中行' : '';
  });
}

function sheetApplyGridSelection() {
  const table = $('sheetTable');
  if (!table) return;
  Array.prototype.slice.call(table.querySelectorAll('.grid-cell-selected, .grid-head-selected')).forEach(function (el) {
    el.classList.remove('grid-cell-selected', 'grid-head-selected');
  });
  Array.prototype.slice.call(table.querySelectorAll('tbody tr.row-sel')).forEach(function (el) {
    el.classList.remove('row-sel');
  Array.prototype.slice.call(table.querySelectorAll('tbody tr.sel')).forEach(function (el) {
    el.classList.remove('sel');
  });
  });
  const selection = sheetGridSelection;
  const allButton = table.querySelector('.sheet-select-all');
  if (allButton) {
    const all = !!selection && selection.type === 'all';
    allButton.setAttribute('aria-pressed', all ? 'true' : 'false');
  }
  if (!selection) return;
  if (selection.type === 'all') {
    Array.prototype.slice.call(table.querySelectorAll('thead th, tbody tr[data-id] td')).forEach(function (el) {
      el.classList.add('grid-cell-selected');
    });
    return;
  }
  if (selection.type === 'row') {
    const ids = sheetSelectedRowIds();
    Array.prototype.slice.call(table.querySelectorAll('tbody tr[data-id]')).forEach(function (row) {
      const on = ids.indexOf(Number(row.dataset.id)) >= 0;
      row.classList.toggle('row-sel', on);
      row.classList.toggle('sel', on);   /* 旧类保留，避免残留 */
    });
    return;
  }
  if (selection.type === 'column') {
    const index = selection.index;
    const head = table.querySelector('thead tr');
    if (head && head.children[index]) head.children[index].classList.add('grid-head-selected');
    Array.prototype.slice.call(table.querySelectorAll('tbody tr[data-id]')).forEach(function (row) {
      if (row.children[index]) row.children[index].classList.add('grid-cell-selected');
    });
  }
}

function sheetGridValues(row, index, seqs) {
  if (row.kind === 'section') return ['', row.name || '', '', '', '', '', ''];
  return [seqs[index] || '', row.node || '', row.name || '', row.expr || '', row.unit || '', sheetQty(row.expr), row.note || ''];
}

function sheetGridCopyText() {
  const headers = Array.prototype.slice.call($('sheetTable').querySelectorAll('thead th')).slice(1).map(function (th) {
    return th.innerText.trim();
  });
  const seqs = sheetSeqs();
  const selection = sheetGridSelection;
  if (selection.type === 'row') {
    const ids = sheetSelectedRowIds();
    if (ids.length > 1) return sheetRowsText(ids);
    const index = sheetRows.findIndex(function (row) { return row.id === selection.id; });
    return index < 0 ? '' : sheetGridValues(sheetRows[index], index, seqs).join('\t');
  }
  /* ★ 2026-10-21：收起段里的行不在屏上，复制也不该带出去（否则粘到 Excel 会多出一截） */
  const _v = sheetVisibleIdSet();
  const _vr = sheetRows.map(function (row, index) { return { row: row, index: index }; })
    .filter(function (o) { return _v[o.row.id]; });
  if (selection.type === 'column') {
    const column = selection.index - 1;
    return [headers[column]].concat(_vr.map(function (o) {
      return sheetGridValues(o.row, o.index, seqs)[column];
    })).join('\n');
  }
  return [headers].concat(_vr.map(function (o) {
    return sheetGridValues(o.row, o.index, seqs);
  })).map(function (values) { return values.join('\t'); }).join('\n');
}

/* ★ 2026-10-21 卓米D：部位段收起后，段里的明细在屏上根本不存在。
   选择 / 复制 / 删除都必须把它们排除 —— 否则会出现「按 Delete 删掉了几条你看不见的行」。
   返回 { 行id: 1 } 的可见集合（部位题头本身永远可见）。每次调用 O(n)，选择路径够用。 */
function sheetVisibleIdSet() {
  var vis = {}, hidden = false;
  sheetRows.forEach(function (r) {
    if (r.kind === 'section') { hidden = !!r.collapsed; vis[r.id] = 1; }
    else if (!hidden) { vis[r.id] = 1; }
  });
  return vis;
}

/* 行首/序号点击选行：Ctrl 点 = 加选/取消，Shift 点 = 连选一段，普通点 = 只选这一行。
   选中的行始终按表内先后排序存 ids，粘贴时才不会「先点的排在后面」。 */
function sheetSelectRow(id, e) {
  const ctrl = !!(e && (e.ctrlKey || e.metaKey));
  const shift = !!(e && e.shiftKey);
  /* 拖选路径：mousedown 时传 baseId，锚点固定在那行（不跟 mousemove 一起动） */
  const anchorId = (e && e.baseId != null) ? e.baseId
    : (sheetGridSelection && sheetGridSelection.type === 'row' ? sheetGridSelection.id : id);
  const prev = (e && e.baseId != null) ? []
    : (sheetGridSelection && sheetGridSelection.type === 'row' ? sheetGridSelection.ids || [] : []);
  let ids;
  if (shift && sheetIndexOf(anchorId) >= 0) {
    const a = sheetIndexOf(anchorId), b = sheetIndexOf(id);
    const _vis = sheetVisibleIdSet();
    const range = sheetRows.slice(Math.min(a, b), Math.max(a, b) + 1)
      .map(function (r) { return r.id; })
      .filter(function (rid) { return _vis[rid]; });   // 收起段里的行不进区间（屏上看不见就不该被选中）
    ids = prev.concat(range);
  } else if (ctrl) {
    ids = prev.indexOf(id) >= 0 ? prev.filter(function (x) { return x !== id; }) : prev.concat([id]);
  } else {
    ids = [id];
  }

/* 当前选中的行 id 列表（多选时多个，没多选就一个）—— 表内先后排序，粘贴按这个顺序 */
function sheetSelectedRowIds() {
  const sel = sheetGridSelection;
  if (!sel || sel.type !== 'row') return [];
  let ids = (sel.ids && sel.ids.length) ? sel.ids.slice() : [sel.id];
  const _vis = sheetVisibleIdSet();
  /* 收起段里的行不算选中：Delete / 复制 / 粘贴都不该带上它们 */
  ids = ids.filter(function (id) { return sheetIndexOf(id) >= 0 && _vis[id]; });
  if (!ids.length && sheetIndexOf(sel.id) >= 0 && _vis[sel.id]) ids = [sel.id];
  /* 按表内顺序排：粘贴时才不会“先点的排在后面” */
  return sheetRows.filter(function (r) { return ids.indexOf(r.id) >= 0; }).map(function (r) { return r.id; });

/* 若干行拼成复制文本（制表符分隔，一行一条） */
function sheetRowsText(ids) {
  const seqs = sheetSeqs();
  return sheetRows.filter(function (r) { return ids.indexOf(r.id) >= 0; })
    .map(function (r, i) { return sheetGridValues(r, sheetRows.indexOf(r), seqs).join('\t'); })

function sheetRowPayload(id) {

async function sheetPasteRowsBelow(targetId, rows) {
  fhKillUndo();                                  /* 有粘贴＝内容要变，先摘掉导入撤销 */
  const list = (rows || []).filter(Boolean);
  let index = sheetIndexOf(targetId);
  if (!list.length || index < 0) return false;
  const cap = window.fhCapNow ? window.fhCapNow() : FH_ROW_CAP;
  if (sheetRows.length + list.length > cap) { fhShowLimit(); return false; }
  sheetCommitFocus();
  await sheetSaveSnapshot();
  sheetUnfoldAbove(index);                       // 落在收起段里的话先展开，别让用户"粘了看不见"
  let warning = false, lastId = null;
  for (let i = 0; i < list.length; i++) {
    const source = list[i];
    const row = {
      id: sheetUid(), kind: source.kind || 'item', node: source.node || '',
      name: source.name || '', expr: source.expr || '', unit: source.unit || '',
      note: source.note || '', shotId: null
    };
    if (source.shotId != null) {
      row.shotId = await shotClone(source.shotId);
      if (!row.shotId) warning = true;
    }
    index = sheetIndexOf(lastId === null ? targetId : lastId);
    if (index < 0) index = sheetRows.length - 1;
    sheetRows.splice(index + 1, 0, row);
    lastId = row.id;

      if (q) q.textContent = sheetQty(r.expr);
      cell.setAttribute('title', r.expr || '');   // 长算式悬停看全文
      /* ★ 2026-10-08（第 3 条）：改的正是当前这一行时，顶部结果立刻跟着走 ——
         清空算式就该当场回滚（旧值不留），不用等下一次选行才刷新。 */
      if (r.id === sheetSel) { try { syncSheetAnswer(); } catch (e2) {} }
      /* 格子里打「【」也能调出标签下拉（2026-09-18 用户反馈：计算稿态下拉不出来） */
      if (document.activeElement === cell) renderLabelDropdown();
    }
    /* 单位 / 项目名称：边打边筛候选 */
    if (cell.dataset.pick) cdRender(cell.value);
  });

  /* 单位 / 项目名称：点进格子就出候选下拉（能选表里已有的，也能自己打字）。
     顺带记下每格进入编辑前的原值 → Esc 可以撤销这一格的改动（Excel 手感）。 */
  body.addEventListener('focusin', function (e) {
    const el = e.target;
    if (!el || !el.dataset) return;
    if (el.dataset.f) {
      cellEditBackup = { el: el, val: cellVal(el) };
      /* 进格编辑也算「选中了这行」：截图 / Ctrl+V 贴图要落到这里
         （2026-09-29 用户反馈：截图总落到末尾行 —— 点进格子不设选中，兜底就成了加新行） */
      const tr = el.closest('tr[data-id]');
      if (tr) {
        sheetFocusRowId = Number(tr.dataset.id);
        /* ★ 2026-10-08（第 3 条）：进算式格编辑＝把这一行当「当前行」，顶部结果立刻换成它的工程量。
           否则编辑 B 行、顶部还挂着 A 行的数，把 B 行清空看着就像「旧结果没回滚」。
           只动 sheetSel（当前行），不碰 sheetGridSelection（整行高亮）。 */
        if (el.dataset.f === 'expr') { sheetSel = sheetFocusRowId; try { syncSheetAnswer(); } catch (e2) {} }
      }
    }
    if (el.dataset.pick) openCellDropdown(el);
  });

  /* 键盘：候选下拉打开时方向键选、回车确认、Esc 关（两种下拉共用，避免 Enter 在格子里换行）。
     ⚠️ 一律 stopPropagation：否则 Esc 会冒泡到 document 的视图切换处理器，
     在计算稿态顺手把视图切回「算」（2026-09-19 线上冒烟抓到）。 */
  body.addEventListener('keydown', function (e) {
    const rowSelector = e.target.closest('td.c-ops[tabindex="0"], td.c-seq[tabindex="0"]');
    /* ★ 2026-10-21：焦点落在收起三角上时，Enter/空格 要让给按钮自己（否则键盘永远展不开） */
    if (rowSelector && !e.target.closest('.sec-fold') && (e.key === 'Enter' || e.key === ' ')) {
      const tr = rowSelector.closest('tr[data-id]');
      if (tr) {
        e.preventDefault();
        sheetSel = Number(tr.dataset.id);
        sheetGridSelection = { type: 'row', id: sheetSel };
        Array.prototype.slice.call(body.querySelectorAll('tr.sel')).forEach(function (x) { x.classList.remove('sel'); });
        tr.classList.add('sel');
        sheetApplyGridSelection();
        syncSheetAnswer();
      }
      return;
    }
    if (cellDrop.classList.contains('show')) {
      const n = cdItems.length;
      if (e.key === 'ArrowDown') { e.preventDefault(); e.stopPropagation(); cdActive = n ? Math.min(cdActive + 1, n - 1) : -1; cdUpdateActive(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); cdActive = n ? Math.max(cdActive - 1, 0) : -1; cdUpdateActive(); return; }
      if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); if (cdItems[cdActive]) cdPick(cdActive); else closeCellDropdown(); return; }
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeCellDropdown(); return; }
    }
    const inCellDD = labelTargetEl && labelTargetEl.closest && labelTargetEl.closest('#sheetBody');
    if (labelDropdown.classList.contains('show') && inCellDD) {
      const n = visibleItems.length;
      if (e.key === 'ArrowDown') { e.preventDefault(); e.stopPropagation(); if (n) { labelActive = Math.min(labelActive + 1, n - 1); updateActive(); } }
      else if (e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); if (n) { labelActive = Math.max(labelActive - 1, 0); updateActive(); } }
      else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); if (visibleItems[labelActive]) selectByIdx(labelActive); }
      else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); hideLabelDropdown(); }
      return;
    }
    /* Ctrl+Enter：**格内换行**（Enter 已经让给「下一格」了，换行得另给一个键 —— 2026-09-20 用户要求）。
       只对内容可编辑格生效（单位/项目名称是 <input>，本来就存不下换行）。 */
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !e.altKey) {
      const aeN = document.activeElement;
      if (aeN && aeN.tagName !== 'INPUT' && aeN.tagName !== 'TEXTAREA' &&
          aeN.closest && aeN.closest('#sheetBody') && aeN.isContentEditable) {
        e.preventDefault();
        e.stopPropagation();
        document.execCommand('insertLineBreak');
        aeN.dispatchEvent(new Event('input', { bubbles: true }));
        return;
      }
    }
    /* Ctrl+1 / Ctrl+2：加括号 —— 与「算」视图同语义（2026-09-22 用户要求「计算式快捷键要同那边」）。
       ★ 这里必须 stopPropagation：否则事件会冒到全局的「函数快捷键 Ctrl+0~9」处理器，
         于是**同一个 Ctrl+1 在格子里变成往格子里插 sqrt()**，跟「算」视图的「加括号」根本不是一回事
         —— 这就是用户说的"不同那边"。（实查：fxItems[0]=SQRT、[1]=ABS，见 1925 行那条注释） */
    if ((e.ctrlKey || e.metaKey) && !e.altKey &&
        (e.key === '1' || e.key === '2' || e.code === 'Digit1' || e.code === 'Digit2')) {
      const aeB = document.activeElement;
      if (aeB && aeB.classList && aeB.classList.contains('c-expr') && aeB.closest && aeB.closest('#sheetBody')) {
        e.preventDefault();
        e.stopPropagation();
        if (e.key === '1' || e.code === 'Digit1') bracketAroundSel({ cell: aeB });
        else bracketAroundLine({ cell: aeB });
        return;
      }
    }
    /* 没开下拉 → Excel 手感：Enter 下一格 / Shift+Enter 上一格 / Tab 右一格 / Shift+Tab 左一格 / Esc 撤销本格
       ⚠️ 只在「焦点真的落在可编辑格上」时接管 —— 格子里的按钮（如删图 ✕）要保留原生行为，
       否则点完按钮按 Esc 会既撤不掉格、又切不回「算」视图。 */
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    const aeK = document.activeElement;
    if (!aeK || !aeK.closest || !aeK.closest('#sheetBody')) return;
    const kcell = cellOf({ target: aeK });
    if (!kcell || kcell !== aeK) return;
    if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); sheetCellMove(e.shiftKey ? 'up' : 'down'); return; }
    if (e.key === 'Tab') { e.preventDefault(); e.stopPropagation(); sheetCellMove(e.shiftKey ? 'left' : 'right'); return; }
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); sheetCellEsc(kcell); return; }
  });

  /* 失焦规整：去换行、去多余空白，保证存的是纯文本 */
  body.addEventListener('focusout', function (e) {
    /* 离开单位/项目名称格 → 顺手把候选下拉收掉（点候选项是 mousedown+preventDefault，不会触发这里） */
    if (e.target && e.target.dataset && e.target.dataset.pick) setTimeout(closeCellDropdown, 120);
    const cell = cellOf(e);
    if (!cell) return;
    const tr = cell.closest('tr[data-id]');
    const r = tr ? sheetFind(Number(tr.dataset.id)) : null;
    if (!r) return;
    const f = cell.dataset.f;
    /* 备注是自由文本：保留换行（Ctrl+Enter 打的换行要留住）；其余格一律把换行压成空格 */
    const v = (f === 'note')
      ? String(r[f] || '').replace(/[ \t]+$/gm, '').replace(/\n{3,}/g, '\n\n').trim()
      : (r[f] || '').replace(/\s*\n\s*/g, ' ').trim();
    r[f] = v; sheetSave();
    if (cellVal(cell).trim() !== v) cellSet(cell, v);
  });

  /* 粘贴：只收纯文本（防 Word/网页富文本把表格撑坏）；纯图片交给贴图逻辑。
     ★ 2026-09-20：粘到「计算式」格、且剪贴板是多行时，**按行拆开、一行一条** ——
       在 Excel 里复制一列直接贴进来就能用（原来一律把换行压成空格，从别处搬数据这条路等于堵死）。 */
  /* 兜底：焦点在 td（c-ops / c-seq）上时，浏览器不给触发 body 的 paste ——
     这里直接在 document 层接，调 sheetPasteCopiedRowBelow / sheetPasteRowsBelow。
     （2026-09-27 质检抓到：Ctrl+C 后 Ctrl+V 没反应，就是这条路径没通。） */
  document.addEventListener('paste', function (e) {
    const ae = document.activeElement;
    let sel = (ae && ae.closest && ae.closest('#sheetBody')) ? ae.closest('td.c-ops, td.c-seq') : null;
    if (!sel && sheetGridSelection && sheetGridSelection.type === 'row') {
      const tr2 = document.querySelector('#sheetBody tr[data-id="' + sheetGridSelection.id + '"]');
      if (tr2) sel = tr2.querySelector('td.c-ops, td.c-seq');
    }
    if (curView !== 'sheet') return;
    let targetId = null;
    if (sel && sel.closest('tr[data-id]')) {
      targetId = Number(sel.closest('tr[data-id]').dataset.id);
    } else if (sheetGridSelection && sheetGridSelection.type === 'row') {
      /* 多选时：粘到最后选中那行下方（Excel 习惯）。
         2026-09-29 修：原先算完 lastId 又被下一行无条件覆盖回「第一选中行」，多选永远粘错位置 */
      const lastId = (sheetGridSelection.ids && sheetGridSelection.ids.length) ? sheetGridSelection.ids[sheetGridSelection.ids.length - 1] : sheetGridSelection.id;
      if (lastId != null) targetId = Number(lastId);
    } else {
      return;
    }
    const cb = e.clipboardData;
    const types = cb && cb.types ? Array.prototype.slice.call(cb.types) : [];
    const marked = types.indexOf(SHEET_ROW_MIME) >= 0;
    const sameText = types.indexOf('text/plain') >= 0 && sheetGridClipboard && sheetGridClipboard.marked &&
      (sheetGridClipboard.type === 'row' || sheetGridClipboard.type === 'rows') &&
      cb.getData('text/plain').replace(/\r\n/g, '\n') === sheetGridClipboard.text;
    if (!marked && !sameText) return;
    e.preventDefault();
    let rows = null;
    if (marked) {
      try {
        const raw = JSON.parse(cb.getData(SHEET_ROW_MIME) || '{}');
        if (raw && raw.type === 'rows' && raw.rows) rows = raw.rows;
        else if (raw && raw.type === 'row') rows = [raw];
      } catch (err) { rows = null; }
    }
    if (!rows && sheetGridClipboard) {
      rows = sheetGridClipboard.type === 'rows' ? sheetGridClipboard.rows : (sheetGridClipboard.row ? [sheetGridClipboard.row] : null);
    }
    if (!rows || !rows.length) return;
    if (rows.length > 1) {
      sheetPasteRowsBelow(targetId, rows).then(function (ok) {
        sheetFlash(ok ? ('已在下方粘贴 ' + rows.length + ' 行') : '粘贴失败', 2800);
      });
    } else {
      sheetPasteCopiedRowBelow(targetId);
    }
  });
  body.addEventListener('paste', function (e) {
    const rowCell = e.target.closest('.c-ops[tabindex="0"], .c-seq[tabindex="0"]');
    const selectedRow = rowCell && rowCell.closest('tr[data-id]');
    const cb = e.clipboardData;
    const types = cb && cb.types ? Array.prototype.slice.call(cb.types) : [];
    /* 整行粘贴：优先认自造 MIME（跨会话可靠）；老剪贴板没有它时，
       才用「文本一致 + 本机刚复制过整行」兜底 —— 外部复制来的文本不会误触发插行。 */
    const marked = types.indexOf(SHEET_ROW_MIME) >= 0;
    const sameText = types.indexOf('text/plain') >= 0 && sheetGridClipboard && sheetGridClipboard.marked &&
      (sheetGridClipboard.type === 'row' || sheetGridClipboard.type === 'rows') &&
      cb.getData('text/plain') === sheetGridClipboard.text;
    if (selectedRow && (marked || sameText)) {
      e.preventDefault();
      const targetId = Number(selectedRow.dataset.id);
      /* 自造 MIME 里带着完整 payload：一次能粘多行，也不依赖本机变量还在不在 */
      let rows = null;
      if (marked) {
        try {
          const raw = JSON.parse(cb.getData(SHEET_ROW_MIME) || '{}');
          if (raw && raw.type === 'rows' && raw.rows) rows = raw.rows;
          else if (raw && raw.type === 'row') rows = [raw];
        } catch (err) { rows = null; }
      }
      if (!rows && sheetGridClipboard) {
        rows = sheetGridClipboard.type === 'rows' ? sheetGridClipboard.rows
            : (sheetGridClipboard.row ? [sheetGridClipboard.row] : null);
      }
      if (rows && rows.length > 1) {
        sheetPasteRowsBelow(targetId, rows).then(function (ok) {
          sheetFlash(ok ? ('已在下方粘贴 ' + rows.length + ' 行') : '粘贴失败', 2800);
        });
      } else {
        sheetPasteCopiedRowBelow(targetId);
      }
      return;
    }
    const cell = e.target.closest('.c-edit');
    const inCell = (!cell) ? e.target.closest('.c-name-in, .c-unit-in') : null;
    if (!cell && !inCell) return;
    if (!cb) return;
    if (types.indexOf('text/plain') < 0) return;      // 纯图：不拦，走 document 上的贴图
    e.preventDefault();
    const raw = cb.getData('text/plain') || '';
    const lines = raw.replace(/\r/g, '').split('\n').map(function (t) { return t.trim(); }).filter(Boolean);
    if (!lines.length) return;
    if (inCell) { pasteFieldLines(inCell, inCell.dataset.f, lines); return; }   // 名称 / 单位格：多行拆成多行新行
    if (cell.classList.contains('c-expr') && lines.length > 1) { pasteExprLines(cell, lines); return; }
    /* 其余格（节点 / 备注）与单行粘贴：还是老规矩 —— 换行压成空格，插在光标处 */
    document.execCommand('insertText', false, lines.join(' '));
  });
}

/* pos='above' 插在参考行上方（工具栏按钮用）；默认插在参考行下方（行首 ＋ 用）
   参考行不存在或没传 → 追加到末尾。 */
function sheetAddRow(refId, kind, pos) {
  sheetCommitFocus();
  fhKillUndo();                                  /* 插了行就不能再整表回滚（糯米B #395 P2） */
  /* ★ 分层试做：超过上限不再加行，改弹「购买更多容量」（正式版上限 50） */
  if (sheetRows.length >= (window.fhCapNow ? window.fhCapNow() : FH_ROW_CAP)) { fhShowLimit(); return Promise.resolve(); }   // 先把正在编辑的格子落库并失焦，避免插行时打字被吞
  const r = { id: sheetUid(), kind: kind || 'item', node: '', name: '', expr: '', unit: '', note: '', shotId: null };
  let i = sheetRows.length;
  if (refId !== null && refId !== undefined) {
    const k = sheetIndexOf(refId);
    if (k >= 0) i = pos === 'above' ? k : k + 1;
  }
  /* ★ 2026-10-09：插行同病根的第二病灶（跟柱墩插入一起修）。
   插行是**结构性改动**，撤不回等于用户白干 —— 之前只给「删行/多选删行/粘贴/清空」挂了
   可撤回调（appTip 第三参数），插行一路 appTip 都没有，Ctrl+Z 自然按了没反应。
   用 sheetSaveSnapshot() 同一套写法：备份 slice → 插 → 提示里挂「撤销」。
   ⚠️ 备份必须取在 splice **之前**（第一版写在 splice 之后，等于备份了已插入的结果，
   撤销 = 没撤 —— 空表插第一行时 100% 复现）。
   也放在容量上限判定之后（上面已 return），免得「没插进去却提示可撤销」的空快照。 */
/* ★ 2026-10-21：新行若落在被收起的部位段里，先把那段展开 —— 否则插完看不见，以为没插进去。
   放在 backup 之前：撤销时回的是「已展开」的样子，跟用户看到的一致。 */
sheetUnfoldAbove(i);
const backup = sheetRows.slice();
  sheetRows.splice(i, 0, r);
  sheetSel = r.id;
  sheetSave();
  /* 返回 promise：Excel 式「末行按 Enter 自动补一行」要靠它把焦点续到新行的同一列 */
  return sheetRender().then(function () {
    const tr = document.querySelector('#sheetBody tr[data-id="' + r.id + '"]');
    if (tr) { const c = tr.querySelector('.c-edit'); if (c) c.focus(); }
    appTip('已插入一行 · 5 秒内可撤销', 5000, function () {
      sheetRows = backup; sheetSel = null; sheetSave(); sheetRender();
      sheetFlash('已撤销插行');
    });
  });
}
/* 空表引导：点示例 → 建一条带算式的行（手动加的行不挂算式框绑定，不和自动入表打架） */
async function demoSample(expr) {
  sheetCommitFocus();
  const r = newCalcRow(expr, null);
  sheetRows.push(r);
  sheetSel = r.id;
  sheetSave();
  await sheetRender();
  const tr = document.querySelector('#sheetBody tr[data-id="' + r.id + '"]');
  if (tr) { const c = tr.querySelector('td.c-expr'); if (c) { try { c.focus(); caretToEnd(c); } catch (e) {} } }
  sheetFlash('已加一条 · 接着点「项目名称 / 单位」补上就能导出', 3600);
}
/* 一次粘入多行算式（Excel 里复制一列直接贴）：
   当前格收第一行，其余各行在它下面依次新建一行 —— 只动 expr 与工程量，
   节点/项目名称/单位留给用户自己补，不瞎猜。 */
async function pasteExprLines(cell, lines) {
  const tr = cell.closest('tr[data-id]');
  const r = tr ? sheetFind(Number(tr.dataset.id)) : null;
  if (!r) { document.execCommand('insertText', false, lines.join(' ')); return; }
  r.expr = lines[0];
  cell.textContent = lines[0];
  const q = tr.querySelector('.c-qty'); if (q) q.textContent = sheetQty(r.expr);
  sheetSave();
  let refId = r.id;
  for (let i = 1; i < lines.length; i++) {
    await sheetAddRow(refId, 'item', 'below');
    const nr = sheetFind(sheetSel);
    if (!nr) break;
    nr.expr = lines[i];
    sheetSave();
    const ntr = document.querySelector('#sheetBody tr[data-id="' + nr.id + '"]');
    if (ntr) {
      const c = ntr.querySelector('td.c-expr'); if (c) c.textContent = lines[i];
      const q2 = ntr.querySelector('.c-qty'); if (q2) q2.textContent = sheetQty(nr.expr);
    }
    refId = nr.id;
  }
  sheetFlash('已按行粘入 ' + lines.length + ' 条算式（节点/名称/单位接着补）', 3600);
}
/* 项目名称 / 单位格粘多行：当前格收第一行，其余各行依次在下方建新行、填进同一列。
   （2026-10-08 用户：项目名称格粘多行也要能拆开 —— 它是 <input>，原来不认多行，等于没粘。） */
async function pasteFieldLines(inCell, field, lines) {
  const tr = inCell.closest('tr[data-id]');
  const r = tr ? sheetFind(Number(tr.dataset.id)) : null;
  if (!r) { inCell.value = lines[0]; inCell.dispatchEvent(new Event('input', { bubbles: true })); return; }
  r[field] = lines[0];
  inCell.value = lines[0];
  let refId = r.id;
  for (let i = 1; i < lines.length; i++) {
    await sheetAddRow(refId, 'item', 'below');
    const nr = sheetFind(sheetSel);
    if (!nr) break;
    nr[field] = lines[i];
    sheetSave();
    const ntr = document.querySelector('#sheetBody tr[data-id="' + nr.id + '"]');
    if (ntr) { const c = ntr.querySelector('[data-f="' + field + '"]'); if (c) c.value = lines[i]; }
    refId = nr.id;
  }
  sheetFlash('已按行粘入 ' + lines.length + ' 条' + (field === 'name' ? '项目名称' : '单位'), 3600);
}
function sheetAddSection() {
  sheetCommitFocus();
  const r = { id: sheetUid(), kind: 'section', name: '' };
  let i = sheetRows.length;
  if (sheetSel !== null) { const k = sheetIndexOf(sheetSel); if (k >= 0) i = k; }   // 插在选中行上方
  sheetRows.splice(i, 0, r);
  sheetSel = r.id; sheetSave();
  sheetRender().then(function () {
    const tr = document.querySelector('#sheetBody tr[data-id="' + r.id + '"]');
    if (tr) { const c = tr.querySelector('.c-edit'); if (c) c.focus(); }
    sheetFlash('在选中行上方插了一个部位行，直接改名字');
  });
}
/* 删行（可撤销，2026-09-20）：
   行先摘掉，但**附图先不删** —— 撤销窗口内点「撤销」能连图一起回来；
   过了窗口，图就成了没有行引用的孤儿，下次启动由 pruneOrphanShots() 收掉。
   原来删行既没确认也没撤销，✕ 还紧挨着 ＋，误删就直接丢数据。 */
async function sheetDelRow(id) {
  const i = sheetIndexOf(id);
  if (i < 0) return;
  fhKillUndo();                                  /* 删了行就不能再整表回滚 */
  
  const r = sheetRows[i];
  /* ★ 2026-10-21：删部位题头时，它下面的明细**不跟着删**（会并到上一段名下）。

    cols.forEach(function (c, i) { c.style.width = COLW_DEFAULT_PCT[i] || '10%'; });
    t.style.minWidth = ''; t.style.width = '';

  }

  /* ★ 2026-10-08（用户选 C 方案）：写进 D 列的算式先归一化。

       · 不剥离【】[] 标注 —— D 列要留原文，交给定义体转 *ISTEXT；
       · 不把 % 换成 (数字/100) —— Excel 的 % 本来就对（5% = 0.05）；
       · 保留换行 —— 定义体把它换成 + 连接多行；

      });

           .replace(/（/g, '(').replace(/）/g, ')');

         是式子的转圆括号，纯标注的整段剥掉。

      /* ★ 同上（7b）：数字/右括号 紧跟函数名 也是隐式乘 —— D 列是用户直接看的文字，
         不补 * 就会把 `1+1trunc(` 原样显示出来，跟用户在 App 里按 Ctrl+3 得到的
         观感对不上（用户截图里 D 列就是 `1+1trunc()` 原文）。 */
      s = s.replace(/(\d|\))(?=[A-Za-z]+\()/g, '$1*');
      /* ★ 同上（7c）：D 列是用户直接读的文字，函数名顺手规整成 Excel 大写 ——
         用户按 Ctrl+3 插出来的是 `trunc(`，导出稿里也该写 TRUNC(，
         否则 D 列显示 `1+1*trunc(2)`，跟截图里那种大小写混杂的观感对不上。
         ⚠️ 只在「后面紧跟左括号」时才改（形参不是函数调用）——

      s = s.replace(/\b(sqrt|abs|trunc|round|pow|exp|ln|log|sin|cos|tan|asin|acos|atan|pi)(?=\()/gi,

  function normCommon(expr) {
    var s = String(expr === null || expr === undefined ? '' : expr);
    // 1. 剥离标注（花括号：是式子的转圆括号，纯标注的剥掉；口径同 safeEval）

    s = s.replace(/\[[^\]]*\]/g, '').replace(/【[^】]*】/g, '')
         .replace(/[¥$￥]/g, '').replace(/　/g, ' ')
         .replace(/[！-～]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
         .replace(/｛/g, '{').replace(/｝/g, '}');
    for (var bi = 0; bi < 8 && s.indexOf('{') >= 0; bi++) {
      var prevS = s;
      s = s.replace(/\{([^{}]*)\}/g, function (m, inner) {
        var t = inner.replace(/\[[^\]]*\]/g, '').replace(/【[^】]*】/g, '');

    if (!s.trim()) { return ''; }
    // 2. 去货币符号、全角空格
    s = s.replace(/[¥$￥]/g, '').replace(/　/g, ' ');
    // 3. 全角 → 半角
    s = s.replace(/[！-～]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); });
    // 4. 去空格 + 千分位逗号（括号外的删，括号内的留）
    s = s.replace(/\s+/g, '');
    s = s.replace(/(\d),(?=\d)/g, function (m, p1, off, str) {
      var depth = 0;
      for (var i = 0; i < off; i++) { if (str[i] === '(') { depth++; } else if (str[i] === ')') { depth--; } }
      return depth > 0 ? m : p1;
    });

    s = s.replace(/×/g, '*').replace(/÷/g, '/')
         .replace(/（/g, '(').replace(/）/g, ')')
         .replace(/[·•]/g, '*');

    s = s.replace(/((?:\d+(?:\.\d+)?|\.\d+))%(?=[)+\-*/(]|$)/g, '($1/100)');
    // 7. 隐式乘号：数字/右括号 后紧跟 ( → 补 *
    s = s.replace(/(\d|\))\s*\(/g, '$1*(');
    /* ★ 7b 隐式乘号之二：数字/右括号 后紧跟**函数名** → 也要补 *。
       为什么必须加：App 的 Ctrl+3 / Ctrl+5 等快捷键是在**光标处**插 `trunc(`，
       所以最自然的输入长成 `1+1trunc()`（前一字符是数字/右括号）。
       少了这一步，归一化后的串仍是 `1+1trunc(`，函数名扫描把「1trunc」当一个
       未知标识 → 报「不支持的函数 trunc」→ 导出该行回落写数值，
       WPS 打开看到的就是裸数字（用户截图 2 里 A 列显示 <unknown> 的那一类）。
       ⚠️ 判据用「前一个字符是数字/右括号」而不是「是不是数字」——
       否则 `sum(...)` 这种正常调用前的标识符也会被误插 *。 */
    s = s.replace(/(\d|\))(?=[A-Za-z]+\()/g, '$1*');

    s = s.replace(/([A-Z][A-Z0-9]*)\(/g, function (m, name) {

        else if (ch === ')') { depth--; if (depth === 0) { end = j; break; } }
        else if (ch === ',' && depth === 1) { commas++; }
        if (depth >= 1 && j > start) { inner++; }

    }
    return null;
  }

  /* 单参数调用补默认第二参：ROUND(a) → ROUND(a,0) */

      var depth = 0, j = at + tag.length - 1, commas = 0, end = -1;
      for (; j < s.length; j++) {
        var ch = s[j];
        if (ch === '(') { depth++; }
        else if (ch === ')') { depth--; if (depth === 0) { end = j; break; } }
        else if (ch === ',' && depth === 1) { commas++; }
      }
      if (end < 0) { out += s.slice(i); break; }
      out += s.slice(i, at) + tag + s.slice(at + tag.length, end) + (commas === 0 ? extra : '') + ')';

  /* 计算式 → Excel 原生公式
     返回 { ok:true, formula:'ROUND((19.6+3.55)*2*2.9,3)' } 或 { ok:false, why:'…' }

  function exprToExcel(expr, refValue) {
    var s = normCommon(expr);
    if (!s) { return { ok: false, why: '空算式' }; }

    // 幂：Excel 用 ^（App 内部把 ^ 转 **；这里保留 ^，若用户写了 ** 则换成 ^）
    s = s.replace(/\*\*/g, '^');

         .replace(/\bacos\b/gi, 'ACOS')
         .replace(/\batan\b/gi, 'ATAN')
         .replace(/\bround\b/gi, 'ROUND')
         .replace(/\bsqrt\b/gi, 'SQRT')
         .replace(/\btrunc\b/gi, 'TRUNC')
         .replace(/\babs\b/gi, 'ABS')
         .replace(/\btan\b/gi, 'TAN')
         .replace(/\bsin\b/gi, 'SIN')
         .replace(/\bcos\b/gi, 'COS')
         .replace(/\bexp\b/gi, 'EXP')
         .replace(/\bln\b/gi, 'LN')
         .replace(/\blog\b/gi, 'LOG10')
         .replace(/\bpow\b/gi, 'POWER');

    }
    var ary = arityProblem(s);
    if (ary) { return { ok: false, why: ary }; }

    // ★ 自检反算：翻出来的公式在 JS 里算一遍，必须和 App 原值一致
    var got = evalAsJS(s);
    if (got === null || !isFinite(got)) { return { ok: false, why: '自检算不出' }; }
    if (refValue !== null && refValue !== undefined && refValue !== '' && isFinite(Number(refValue))) {
      if (!sameNumber(got, Number(refValue))) { return { ok: false, why: '自检数值不符 ' + got + '≠' + refValue }; }
    }
    return { ok: true, formula: s };
  }

function shotDims(blob) {
  return new Promise(function (resolve) {
    try {
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = function () { const r = { w: img.naturalWidth || 400, h: img.naturalHeight || 300 }; URL.revokeObjectURL(url); resolve(r); };
      img.onerror = function () { URL.revokeObjectURL(url); resolve({ w: 400, h: 300 }); };
      img.src = url;
    } catch (e) { resolve({ w: 400, h: 300 }); }
  });
}
function sheetStamp() {
  const d = new Date(), p = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes());
}
async function saveXlsx(bytes, name) {
  /* MIME 按扩展名：.xlsm = 启用宏工作簿（2026-09-28 F4 模式），.xlsx 保持原样 */
  const isXlsm = /\.xlsm$/i.test(name);
  const mime = isXlsm ? 'application/vnd.ms-excel.sheet.macroEnabled.12' : ForhanXlsx.MIME;
  const blob = new Blob([bytes], { type: mime });
  /* ① 原生「另存为」对话框（Chromium/Edge 系支持；真实点击手势下会弹框）。
     ★ 2026-10-07（第 11 条）：返回用户实际保存的文件名（他可能改名）——
     浏览器拿不到绝对保存路径，所以只如实报文件名，不编造路径。 */
  if (window.showSaveFilePicker) {
    try {
      const h = await window.showSaveFilePicker({
        suggestedName: name,
        types: [isXlsm
          ? { description: 'Excel 启用宏的工作簿', accept: { 'application/vnd.ms-excel.sheet.macroEnabled.12': ['.xlsm'] } }
          : { description: 'Excel 工作簿', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }]
      });
      const w = await h.createWritable();
      await w.write(blob); await w.close();
      return { kind: 'saved', name: (h.name || name) };
    } catch (e) {
      if (e && e.name === 'AbortError') return { kind: 'cancel' };
      /* 其他错误（含环境不支持）→ 继续降级 */
    }
  }
  /* ② 普通下载（浏览器里会进"下载"文件夹；桌面壳若不接管下载则可能无反应） */
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 6000);
    return { kind: 'download', name: name };
  } catch (e) {}
  /* ③ 兜底：把文件摆成一个链接，手动右键「另存为」也能拿到 */
  try { showSaveLink(blob, name); } catch (e) {}
  return { kind: 'manual', name: name };
}
/* 兜底：在底部提示行挂一个可右键另存的链接，并提示同时也可用在线版导出 */
function showSaveLink(blob, name) {
  const bar = document.querySelector('.bottom-bar');   // 2026-09-21：底部并成一条，改挂这里
  if (!bar) return;
  const old = bar.querySelector('.save-link');
  if (old) old.parentNode.removeChild(old);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.className = 'save-link';
  a.href = url; a.download = name;
  a.textContent = '点这里保存 ' + name;
  a.style.cssText = 'margin-left:10px;color:var(--accent);font-size:12px;';
  bar.appendChild(a);
  if (typeof sheetFlash === 'function') sheetFlash('这个环境不能自动弹保存框，点右下角的链接另存为', 6000);
}
/* 导出工程量公式用 =求值(Dx) + definedName（2026-09-28 用户拍板回归 F4 模式），产物 .xlsm：
   WPS 打开可改计算式联动重算（实测通过）；微软 Excel 对 xlsm 里的名称求值待真机验证。
   纯数字直接写入数值，App 自己算不出的行留空。 */
async function sheetExportXlsx() {
  /* ★ 2026-09-28 用户拍板：回归 F4 模式（=求值(Dx) + definedName + .xlsm）。
     compat 开关保留作降级口（true = @EVALUATE 直写 .xlsx），默认走 xlsm 名称方案。 */
  const compat = false;
  const btn = $('sheetExport');
  const old = btn ? btn.textContent : '';
  const say = function (t) { if (btn) { btn.textContent = t; setTimeout(function () { btn.textContent = old; }, 2600); } };
  const items = sheetRows.filter(function (r) { return r.kind === 'item' && (r.name || r.expr); });
  if (!items.length) { say('没有内容可导'); return; }
  say('正在生成…');
  try {
    const all = await shotAll();
    const byId = {}; all.forEach(function (r) { byId[r.id] = r; });
    const model = { sheetName: 'Sheet1', title: (sheetTitle || '').trim() || null, rows: [] };
    for (let i = 0; i < sheetRows.length; i++) {
      const r = sheetRows[i];
      if (r.kind === 'section') {
        model.rows.push({ id: r.id, kind: 'section', name: r.name || '' });
        continue;
      }
      let img = null;
      if (r.shotId && byId[r.shotId] && byId[r.shotId].blob) {
        const blob = byId[r.shotId].blob;
        const buf = await blob.arrayBuffer();
        const d = await shotDims(blob);
        /* key 用内容特征：同一张图在表里出现两次时只写一份 media */
        img = { bytes: new Uint8Array(buf), w: d.w, h: d.h, key: blob.size + ':' + (r.shotId) };
      }
      model.rows.push({
        id: r.id, kind: 'item', node: r.node || '', name: r.name || '',
        expr: r.expr || '', unit: r.unit || '', note: r.note || '',
        qty: sheetQty(r.expr) || null, qtyRaw: sheetQtyRaw(r.expr), img: img
      });
    }
    /* ★ 2026-10-19 P0-B：版本化恢复元数据（需求基线「新导出格式附版本化恢复元数据与基线摘要」）。
       只带恢复所需最小集：稳定行 ID/类型/层级名/名称/单位/计算式原文/备注/工程量原始值。
       附图不进元数据（xlsx 里以 media 存在，恢复走图锚点，另行处理）。 */
    const metaRows = model.rows.map(function (r) {
      return { id: r.id, kind: r.kind || 'blank', node: r.node || '', name: r.name || '',
               unit: r.unit || '', expr: r.expr || '', note: r.note || '',
               qtyRaw: (typeof r.qtyRaw === 'number' ? r.qtyRaw : null) };
    });
    const metaJson = JSON.stringify(metaRows);
    let metaHash = 5381;
    for (let mi = 0; mi < metaJson.length; mi++) metaHash = ((metaHash * 33) ^ metaJson.charCodeAt(mi)) >>> 0;
    model.meta = {
      app: 'forhan-calc', metaVersion: 3,     /* v3 = 多了 imgIds（附图随行恢复） */
      imgIds: {},
      exportedAt: new Date().toISOString(),
      title: model.title || null,
      rows: metaRows,
      digest: 'fnv1a-' + metaHash.toString(16)
    };
    /* ★ 2026-10-22：默认 'num'（纯数值）。要恢复 WPS 联动改回 'wps'（代码路径保留）。 */
    const bytes = ForhanXlsx.buildCalcSheet(model, { mode: compat ? 'compat' : 'num' });
    /* App 算不出、工程量留空的行数 —— 如实报给用户，不藏着 */
    const fixed = (bytes.forhanFallback || []).length;
    /* 文件名：Windows 下非法字符已过滤，再把结尾的点/空格去掉（Windows 会静默截掉）
       并限长 —— 标题写太长会让整条路径超 260 字符，保存直接失败。 */
    const safeTitle = (model.title || '')
      .replace(/[\\/:*?"<>|]/g, '').replace(/^[\s.]+|[\s.]+$/g, '').slice(0, 40);
    const name = '计算稿' + (safeTitle ? '_' + safeTitle : '') + '_' + sheetStamp() + (compat ? '.xlsx' : '.xlsm');
    const res = await saveXlsx(bytes, name);
    if (res.kind === 'cancel') { say(old); return; }
    /* ★ 2026-10-07（第 11 条）：反馈说真话 —— 「另存为」拿到的是用户实际保存的文件名
       （可能改过名）；走下载通道就如实说「进了下载文件夹」；浏览器拿不到绝对路径，
       一律不编造保存位置。桌面壳同理（壳的下载落点由 WebView2 决定，页面拿不到路径）。 */
    const finalName = res.name || name;
    if (res.kind === 'saved') say('已保存 ✓');
    else if (res.kind === 'download') say('已开始下载 ✓');
    else say('已生成 ✓');
    const howSaved = res.kind === 'saved' ? '（保存在你刚选的位置）'
      : res.kind === 'download' ? '（已存到系统/浏览器的下载文件夹）'
      : '（点右下角的保存链接拿文件）';
    sheetFlash('导出完成：' + finalName + howSaved +
      ' · 公式栏是简短的 =求值(Dx)，WPS 打开改计算式即联动重算' +
      (fixed ? '（' + fixed + ' 行 App 算不出，留空）' : ''), 6400);
  } catch (e) {
    say('导出失败');
    sheetFlash('导出失败：' + (e && e.message ? e.message : e), 3600);
  }
}

(function () {

  btn.addEventListener('click', function () { window.fhImportExcel(); });

  var refreshUndo = function () { try { window.fhRestoreUndoRefresh && window.fhRestoreUndoRefresh(); } catch (e) {} };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', refreshUndo);
  else refreshUndo();
  setTimeout(refreshUndo, 800);
})();

/* ── 一键截图（2026-09-21 改：非阻塞 + 可取消）──────────────────────────────
   桌面版请壳唤起系统截图（截完自动落图，不必 Ctrl+V）；网页版 / 旧壳退化为提示手动截图。

   ★ 为什么改：旧版走壳里那个**阻塞**的 snap_screen() —— 用户在系统截图工具里按 Esc 取消后，
     剪贴板永远不变，壳那边要干等满 45 秒才返回；这段时间「截图」按钮灰着、底部写着「等截图…」，
     看着就是卡死（用户真机反馈：取消截图后会卡住）。
   现在走三件套：snap_begin（唤起，立刻返回）→ snap_poll（每 250ms 问一次，永不阻塞）→
   snap_cancel（底部「取消截图」，点了立刻收工）。没有 snap_begin 的老壳自动退回旧路径。 */
var snapWatch = null;                       // { stop() }：当前等待的收工开关
var SNAP_POLL_MS = 250;
var SNAP_MAX_MS = 90 * 1000;                // 等满 90 秒就不等了（用户可能忘了自己在截）
function snapBarOn(on, msg) {
  const b = $('barCancel');
  if (b) b.classList.toggle('show', !!on);
  if (on) appTip(msg || '', SNAP_MAX_MS);
  else appTip('');
}
function pollSnap(api) {
  return new Promise(function (resolve) {
    const t0 = Date.now();
    let stopped = false;
    snapWatch = {
      stop: function () {
        if (stopped) return;
        stopped = true;
        try { if (api.snap_cancel) api.snap_cancel(); } catch (e) {}
        resolve({ ok: false, cancelled: true, err: '已取消截图' });
      }
    };
    /* 注意：pywebview 的 js_api 方法返回的是 Promise → 每一步都要 await，
       否则拿到的是 Promise 对象、永远判不出 pending。 */
    async function tick() {
      if (stopped) return;
      let r = null;
      try { r = await api.snap_poll(); } catch (e) { r = { ok: false, done: true, err: String(e) }; }
      if (stopped) return;
      if (r && r.done) { snapWatch = null; resolve(r); return; }
      if (Date.now() - t0 > SNAP_MAX_MS) {
        try { if (api.snap_cancel) api.snap_cancel(); } catch (e) {}
        snapWatch = null;
        resolve({ ok: false, err: '等了 90 秒没等到截图，已停止等待' });
        return;
      }
      setTimeout(tick, SNAP_POLL_MS);
    }
    tick();
  });
}
/* 底部「取消截图」按钮 → 让等待立刻收工 */
(function snapCancelInit() {
  const b = $('barCancel');
  if (b) b.addEventListener('click', function () {
    if (snapWatch && snapWatch.stop) snapWatch.stop();
  });
})();

/* 截图 / Ctrl+V 贴图落行：最后一次交互的行（点行首或进格编辑）→ 选中行 → 都没有返回 null。
   2026-09-29 用户反馈：截图总落到末尾行 —— 原先只认 sheetSel，点进格子编辑不设它，兜底就加新行。 */
function sheetImageTargetRow() {
  if (sheetFocusRowId != null && sheetFind(sheetFocusRowId)) return sheetFocusRowId;
  if (sheetSel != null && sheetFind(sheetSel)) return sheetSel;
  return null;
}

async function snapAndAttach() {
  const api = (window.pywebview && window.pywebview.api) || null;
  const canPoll = api && typeof api.snap_begin === 'function' && typeof api.snap_poll === 'function';
  const canBlock = api && typeof api.snap_screen === 'function';
  if (!canPoll && !canBlock) {
    sheetFlash('当前程序是旧版 exe，没有"一键截图"模块 —— 先用这个：按 Win+Shift+S 框选，回到这里 Ctrl+V。'
      + '装新版安装包后就能点一下直接截', 9000);
    return;
  }
  /* 目标是哪一行：选中的行 → 算式对应的行 → 都没有就新加一行。
     绝不因为"没选行"就把人挡回去（2026-09-18 真机反馈：点了像没反应）。 */
  let target = sheetImageTargetRow();
  if (!target && activePanel && activePanel.input) {
    const row = sheetRowForLine(curLineIndex(activePanel.input));
    if (row) target = row.id;
  }
  if (!target) {
    sheetAddRow(null, 'item');
    target = sheetSel;
  }
  if (!target) { sheetFlash('表格还没准备好，稍后再试'); return; }
  let pos = 0;
  for (let i = 0; i < sheetRows.length; i++) { if (sheetRows[i].id === target) { pos = i + 1; break; } }
  sheetSnapSay('等截图…');
  const tip = '系统截图已唤起 —— 框选后自动贴到第 ' + pos + ' 行的备注列；不想截就点右下「取消截图」';
  let r = null;
  if (canPoll) {
    try { await api.snap_begin(); } catch (e) {}
    snapBarOn(true, tip);
    r = await pollSnap(api);
    snapBarOn(false);
  } else {
    /* 老壳只有阻塞接口 → 老路径（点了 Esc 会等到超时，只能靠它自己 45 秒收工） */
    sheetFlash(tip, 12000);
    try { r = await api.snap_screen(); } catch (e) { r = { ok: false, err: String(e) }; }
  }
  sheetSnapSay('');
  if (!r || !r.ok) {
    if (r && r.cancelled) { sheetFlash('已取消截图', 2200); return; }
    sheetFlash('没截到图' + ((r && r.err) ? '（' + r.err + '）' : '')
      + '——请确认截图工具里"自动复制到剪贴板"已开；也可直接 Ctrl+V 贴剪贴板里的图', 9000);
    return;
  }
  try {
    const bin = atob(r.b64);
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const blob = new Blob([u8], { type: r.mime || 'image/bmp' });
    await sheetAttachShot(target, new File([blob], 'snap.bmp', { type: blob.type }));
    sheetFlash('已贴到这一行（点图可放大，右上 ✕ 可删）', 3000);
  } catch (e) {
    sheetFlash('截图拿到了但落图失败：' + (e && e.message ? e.message : e), 4500);
  }
}

/* 拖图进表格某一行 */
(function sheetDropInit() {
  const body = $('sheetBody');
  if (!body) return;
  body.addEventListener('dragover', function (e) {
    const td = e.target.closest ? e.target.closest('td.c-note') : null;
    if (!td) return;
    e.preventDefault();
    Array.prototype.slice.call(body.querySelectorAll('td.c-note.drop')).forEach(function (x) { x.classList.remove('drop'); });
    td.classList.add('drop');
  });
  body.addEventListener('dragleave', function (e) {
    if (e.target.closest && e.target.closest('td.c-note')) e.target.closest('td.c-note').classList.remove('drop');
  });
  body.addEventListener('drop', function (e) {
    const td = e.target.closest ? e.target.closest('td.c-note') : null;
    if (!td) return;
    e.preventDefault();
    td.classList.remove('drop');
    const tr = td.closest('tr[data-id]');
    const f = shotFirstImage(e.dataTransfer);
    if (tr && f) sheetAttachShot(Number(tr.dataset.id), f);
  });
})();

  window.fhSetMe = function (o) {

  function fhImportDetectLayout(rows) {
    /* 标题行识别（2026-10-19 用户截图实锤）：方衡导出的表第 1 行是「方衡 Forhan - fhzjsj.cn」

       之前拿第 1 行当表头 → 猜列全错、映射瞎指、表头行混进数据。

    var KW = /名称|项目|清单|品名|单位|计量|工程量|数量|计算式|公式|备注|说明|序号|节点|特征|部位/;
    var filled = function (r) { var n = 0; (r || []).forEach(function (c) { if (String(c == null ? '' : c).trim()) n++; }); return n; };
    var kwHits = function (r) { var n = 0; (r || []).forEach(function (c) { if (KW.test(String(c == null ? '' : c))) n++; }); return n; };
    if (rows && rows.length > 1 && filled(rows[0]) <= 2 && filled(rows[1]) >= 3 && kwHits(rows[1]) >= 2) {

  function fhImportGuessCols(rows, headIdx) {

    var head = (rows && rows[headIdx || 0]) || [];

      else if (g.unit < 0 && /单位|计量|计价单位/.test(t)) g.unit = i;

  var FH_RESTORE_BK = 'fh_restore_backup_v1';
  function fhRestoreBackupSave(o) {
